}

/* ============================== TRIP PLANNER (Plan Trip section) ============================== */
// Rough nightly-hotel and daily-food cost bands standing in for a live pricing
// API — used only to produce an approximate trip estimate, not a live quote.
const HOTEL_TIER_INR = { "₹": 900, "₹₹": 2000, "₹₹₹": 4000, "₹₹₹₹": 8500 };
const FOOD_PER_PERSON_PER_DAY_INR = 450;

function formatINR(n) {
  return "₹" + Math.round(n).toLocaleString("en-IN");
}

/* ---- Season-aware trip cost model -----------------------------------------
   No live pricing API is wired in — every figure below is a clearly-labelled
   ESTIMATE derived from hand-set, configurable seasonal data per destination.
   Swap STATE_SEASON_CALENDAR / STATE_BASE_RATES for a real pricing feed to
   go live without touching the calculation or UI logic. --------------------- */
const SEASON_LABELS = ["Peak", "Shoulder", "Off"];

// Jan..Dec seasonality per destination, based on typical climate/tourist-flow
// patterns (cool-dry winters = peak in most of India; snowbound/monsoon = off).
const STATE_SEASON_CALENDAR = {
  "rajasthan":       ["Peak", "Peak", "Shoulder", "Off", "Off", "Off", "Off", "Off", "Shoulder", "Shoulder", "Peak", "Peak"],
  "uttar-pradesh":   ["Peak", "Peak", "Shoulder", "Off", "Off", "Off", "Shoulder", "Shoulder", "Shoulder", "Peak", "Peak", "Peak"],
  "delhi":           ["Peak", "Shoulder", "Shoulder", "Off", "Off", "Off", "Shoulder", "Shoulder", "Shoulder", "Peak", "Peak", "Peak"],
  "punjab":          ["Peak", "Shoulder", "Shoulder", "Off", "Off", "Off", "Off", "Shoulder", "Shoulder", "Peak", "Peak", "Peak"],
  "kerala":          ["Peak", "Peak", "Shoulder", "Off", "Off", "Off", "Off", "Off", "Off", "Shoulder", "Shoulder", "Peak"],
  "tamil-nadu":      ["Peak", "Peak", "Shoulder", "Off", "Off", "Off", "Off", "Off", "Off", "Shoulder", "Shoulder", "Peak"],
  "maharashtra":     ["Peak", "Peak", "Shoulder", "Off", "Off", "Off", "Off", "Off", "Off", "Shoulder", "Peak", "Peak"],
  "west-bengal":     ["Peak", "Peak", "Shoulder", "Off", "Off", "Off", "Off", "Off", "Shoulder", "Peak", "Peak", "Peak"],
  "jammu-kashmir":   ["Off", "Off", "Shoulder", "Shoulder", "Peak", "Peak", "Peak", "Peak", "Peak", "Shoulder", "Off", "Off"],
  "ladakh":          ["Off", "Off", "Off", "Off", "Shoulder", "Peak", "Peak", "Peak", "Shoulder", "Off", "Off", "Off"],
};
const DEFAULT_SEASON_CALENDAR = ["Peak", "Peak", "Shoulder", "Off", "Off", "Off", "Shoulder", "Shoulder", "Shoulder", "Peak", "Peak", "Peak"];

// Indicative per-day baseline rates (INR) at "Shoulder" season for each destination.
// hotel = per room/night · food, transport, activities = per traveller/day.
const STATE_BASE_RATES = {
  "rajasthan":       { hotel: 2400, food: 550, transport: 500, activities: 450 },
  "uttar-pradesh":   { hotel: 2200, food: 500, transport: 450, activities: 500 },
  "delhi":           { hotel: 2600, food: 550, transport: 400, activities: 350 },
  "punjab":          { hotel: 2000, food: 450, transport: 400, activities: 250 },
  "kerala":          { hotel: 2800, food: 600, transport: 700, activities: 600 },
  "tamil-nadu":      { hotel: 2000, food: 450, transport: 400, activities: 350 },
  "maharashtra":     { hotel: 3200, food: 650, transport: 500, activities: 400 },
  "west-bengal":     { hotel: 2200, food: 450, transport: 350, activities: 300 },
  "jammu-kashmir":   { hotel: 3000, food: 550, transport: 600, activities: 450 },
  "ladakh":          { hotel: 2600, food: 600, transport: 900, activities: 500 },
};
const DEFAULT_BASE_RATES = { hotel: 2300, food: 500, transport: 450, activities: 400 };

// Season multipliers applied over the Shoulder baseline above.
const SEASON_MULTIPLIER = {
  Peak:     { hotel: 1.45, food: 1.15, transport: 1.20, activities: 1.15 },
  Shoulder: { hotel: 1.00, food: 1.00, transport: 1.00, activities: 1.00 },
  Off:      { hotel: 0.65, food: 0.90, transport: 0.85, activities: 0.85 },
};

// Spread used to show a LOW / EXPECTED / HIGH range around the estimate —
// actual prices vary with specific hotel, operator and booking timing.
const PRICE_RANGE_FACTOR = { low: 0.85, high: 1.22 };

// Used only for a quick season preview before a full itinerary exists.
const REGION_REPRESENTATIVE_STATE = { North: "delhi", South: "kerala", West: "rajasthan", East: "west-bengal" };

// All 28 states + 8 union territories, sorted for the "By State / UT" picker —
// built once from STATES so adding/removing an entry there is the only upkeep
// this dropdown ever needs (no separate list to keep in sync by hand).
const ALL_STATES_SORTED = [...STATES].sort((a, b) => a.name.localeCompare(b.name));

// The trip destination select's value is either "All", a region name (e.g. "South"),
// "st:<stateId>" for one specific state/UT, or "ct:<cityName>" for one specific
// city (e.g. Vrindavan, Agra) — these helpers tell the three apart.
function isStateDestination(destination) { return destination.startsWith("st:"); }
function destinationStateId(destination) { return isStateDestination(destination) ? destination.slice(3) : null; }
function isCityDestination(destination) { return destination.startsWith("ct:"); }
function destinationCityName(destination) { return isCityDestination(destination) ? destination.slice(3) : null; }

// Turns the manual planner's current region/district/days selection into a
// plain-text query the AI Heritage Guide's own parser can read (e.g.
// "5 days in Rajasthan") — this is what powers the "Ask the AI Guide
// instead" handoff between the two planners.
function plannerSelectionToGuideText({ region, district, days }) {
  let destName = null;
  if (district !== "All") {
    const stId = DISTRICT_STATE_MAP[district];
    const st = STATES.find((s) => s.id === stId);
    destName = (st && st.name) || district;
  } else if (isCityDestination(region)) {
    destName = destinationCityName(region);
  } else if (isStateDestination(region)) {
    const st = STATES.find((s) => s.id === destinationStateId(region));
    destName = st ? st.name : null;
  } else if (region !== "All") {
    destName = region;
  }
  const base = `${days} days`;
  return destName ? `${base} in ${destName}` : base;
}

function seasonForState(stateId, date) {
  const cal = STATE_SEASON_CALENDAR[stateId] || DEFAULT_SEASON_CALENDAR;
  return cal[date.getMonth()];
}
function ratesForState(stateId) {
  return STATE_BASE_RATES[stateId] || DEFAULT_BASE_RATES;
}
function addDaysToDate(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function dayCostForState(stateId, season, rooms, travellers) {
  const base = ratesForState(stateId);
  const mult = SEASON_MULTIPLIER[season];
  return {
    hotel: base.hotel * mult.hotel * rooms,
    food: base.food * mult.food * travellers,
    transport: base.transport * mult.transport * travellers,
    activities: base.activities * mult.activities * travellers,
  };
}
function seasonColor(t, season) {
  if (season === "Peak") return t.saffron;
  if (season === "Off") return "#4FA3C9";
  return t.gold;
}

function TripPlanner({ t, onOpenAttraction, favs, toggleFav, onAskGuide }) {
  const { tr } = useLang();
  const [region, setRegion] = useState("All");
  const [district, setDistrict] = useState("All");
  const [days, setDays] = useState(5);
  const [plan, setPlan] = useState(null);
  const [members, setMembers] = useState(["You"]);
  const [memberInput, setMemberInput] = useState("");
  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState("");
  const [roomsOverride, setRoomsOverride] = useState(null);

  // Dates drive trip length automatically; picking a date range takes over from
  // the quick day-count select (and a fresh itinerary is needed either way).
  useEffect(() => {
    if (startDate && endDate) {
      const diff = Math.round((new Date(endDate) - new Date(startDate)) / 86400000) + 1;
      const clamped = Math.min(Math.max(diff, 1), 21);
      if (diff > 0 && clamped !== days) {
        setDays(clamped);
        setPlan(null);
      }
    }
  }, [startDate, endDate]);

  const travellerCount = Math.max(members.length, 1);
  const autoRooms = Math.max(1, Math.ceil(travellerCount / 2));
  const effectiveRooms = roomsOverride != null ? roomsOverride : autoRooms;

  // Quick season preview, available as soon as a region + date are picked —
  // ahead of (and independent from) generating a full itinerary. A chosen
  // district always wins, since it's the most specific destination on offer.
  const previewSeason = useMemo(() => {
    const repState = district !== "All" ? DISTRICT_STATE_MAP[district]
      : isCityDestination(region) ? CITY_STATE_MAP[destinationCityName(region)]
      : isStateDestination(region) ? destinationStateId(region)
      : (REGION_REPRESENTATIVE_STATE[region] || null);
    const date = startDate ? new Date(startDate) : new Date();
    return seasonForState(repState, date);
  }, [region, district, startDate]);

  const selectStyle = {
    padding: "10px 14px", borderRadius: 10, border: `1px solid ${t.border}`, background: t.panel,
    color: t.text, fontSize: 13, outline: "none", cursor: "pointer",
  };

  const generate = () => {
    const stateId = destinationStateId(region);
    const cityName = destinationCityName(region);
    const pool = ALL_ATTRACTIONS.filter((a) => {
      // A chosen district is the most specific filter and overrides the
      // region/state/city select entirely.
      if (district !== "All") return districtForAttraction(a) === district;
      if (region === "All") return true;
      if (cityName) return a.city === cityName;
      if (stateId) return a.stateId === stateId;
      const st = STATES.find((s) => s.id === a.stateId);
      return st?.region === region;
    });
    const perDay = 2;
    const chosen = pool.slice(0, days * perDay);
    const daysArr = [];
    for (let i = 0; i < days; i++) {
      const items = chosen.slice(i * perDay, i * perDay + perDay);
      if (items.length) daysArr.push({ day: i + 1, items });
    }
    setPlan(daysArr);
  };

  const addMember = () => {
    const name = memberInput.trim();
    if (!name) return;
    setMembers((m) => [...m, name]);
    setMemberInput("");
  };
  const removeMember = (i) => setMembers((m) => m.filter((_, idx) => idx !== i));

  const estimate = useMemo(() => {
    if (!plan || plan.length === 0) return null;
    const travellers = travellerCount;
    const rooms = effectiveRooms;
    const base = startDate ? new Date(startDate) : new Date();

    const totals = { hotel: 0, food: 0, transport: 0, activities: 0 };
    const seasonTally = { Peak: 0, Shoulder: 0, Off: 0 };
    const forcedTotals = {
      Peak: { hotel: 0, food: 0, transport: 0, activities: 0 },
      Shoulder: { hotel: 0, food: 0, transport: 0, activities: 0 },
      Off: { hotel: 0, food: 0, transport: 0, activities: 0 },
    };

    plan.forEach((d, i) => {
      const date = addDaysToDate(base, i);
      const stateIds = [...new Set(d.items.map((a) => a.stateId))];
      if (stateIds.length === 0) stateIds.push(null);

      stateIds.forEach((sid) => {
        const season = seasonForState(sid, date);
        const cost = dayCostForState(sid, season, rooms, travellers);
        totals.hotel += cost.hotel / stateIds.length;
        totals.food += cost.food / stateIds.length;
        totals.transport += cost.transport / stateIds.length;
        totals.activities += cost.activities / stateIds.length;
        seasonTally[season] += 1 / stateIds.length;

        // Same destinations, priced as if every day fell in each season —
        // used only to find the cheapest season for this exact route.
        SEASON_LABELS.forEach((s) => {
          const forced = dayCostForState(sid, s, rooms, travellers);
          forcedTotals[s].hotel += forced.hotel / stateIds.length;
          forcedTotals[s].food += forced.food / stateIds.length;
          forcedTotals[s].transport += forced.transport / stateIds.length;
          forcedTotals[s].activities += forced.activities / stateIds.length;
        });
      });
    });

    const grandTotal = totals.hotel + totals.food + totals.transport + totals.activities;
    const low = grandTotal * PRICE_RANGE_FACTOR.low;
    const high = grandTotal * PRICE_RANGE_FACTOR.high;

    const detectedSeason = Object.entries(seasonTally).sort((a, b) => b[1] - a[1])[0][0];

    const seasonGrandTotals = {};
    SEASON_LABELS.forEach((s) => {
      const f = forcedTotals[s];
      seasonGrandTotals[s] = f.hotel + f.food + f.transport + f.activities;
    });
    const [bestSeason, bestTotal] = Object.entries(seasonGrandTotals).sort((a, b) => a[1] - b[1])[0];
    const savings = Math.max(0, grandTotal - bestTotal);
    const savingsPct = grandTotal > 0 ? (savings / grandTotal) * 100 : 0;

    return {
      rooms, travellers, nights: plan.length,
      hotelTotal: totals.hotel, foodTotal: totals.food, transportTotal: totals.transport, activitiesTotal: totals.activities,
      grandTotal, low, high,
      detectedSeason, bestSeason, bestTotal, savings, savingsPct,
      usingAssumedDate: !startDate,
    };
  }, [plan, members, startDate, effectiveRooms]);

  return (
    <div>
      <SectionLabel t={t} kicker="Plan a trip" title={tr("Build a quick heritage itinerary")} />

      {/* Trip members */}
      <div style={{ marginBottom: 20, padding: 16, borderRadius: 14, border: `1px solid ${t.border}`, background: t.panel }}>
        <div className="font-utility" style={{ fontSize: 11.5, color: t.gold, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
          <PartyPopper size={13} /> {tr("WHO'S GOING")}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 12 }}>
          {members.map((name, i) => (
            <span key={i} className="font-body" style={{
              display: "flex", alignItems: "center", gap: 6, padding: "6px 6px 6px 12px", borderRadius: 999,
              border: `1px solid ${t.border}`, background: t.panelAlt, color: t.text, fontSize: 12.5,
            }}>
              {name}
              <button onClick={() => removeMember(i)} title={`Remove ${name}`} style={{
                width: 18, height: 18, borderRadius: "50%", border: "none", background: `${t.border}`,
                display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
              }}>
                <X size={10} color={t.textDim} />
              </button>
            </span>
          ))}
          {members.length === 0 && <span className="font-body" style={{ fontSize: 12.5, color: t.textDim }}>{tr("No one added yet — add at least one traveller.")}</span>}
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input
            value={memberInput}
            onChange={(e) => setMemberInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") addMember(); }}
            placeholder={tr("Add a traveller's name")}
            className="font-body"
            style={{ flex: "1 1 200px", padding: "9px 14px", borderRadius: 10, border: `1px solid ${t.border}`, background: t.panelAlt, color: t.text, fontSize: 13, outline: "none" }}
          />
          <button onClick={addMember} className="font-utility" style={{
            padding: "9px 16px", borderRadius: 10, border: `1px solid ${t.border}`, background: t.panelAlt,
            color: t.text, fontSize: 12, fontWeight: 700, cursor: "pointer",
          }}>
            {tr("ADD")}
          </button>
        </div>
      </div>

      {/* Travel dates + rooms — drives the season-aware cost estimate below */}
      <div style={{ marginBottom: 20, padding: 16, borderRadius: 14, border: `1px solid ${t.border}`, background: t.panel }}>
        <div className="font-utility" style={{ fontSize: 11.5, color: t.gold, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
          <CalendarDays size={13} /> {tr("TRAVEL DATES")}
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
          <input
            type="date"
            value={startDate}
            onChange={(e) => { setStartDate(e.target.value); if (e.target.value && endDate && e.target.value > endDate) setEndDate(""); }}
            aria-label={tr("Start date")}
            className="font-body"
            style={{ padding: "9px 12px", borderRadius: 10, border: `1px solid ${t.border}`, background: t.panelAlt, color: t.text, fontSize: 13, outline: "none" }}
          />
          <span className="font-body" style={{ color: t.textDim, fontSize: 12.5 }}>→</span>
          <input
            type="date"
            value={endDate}
            min={startDate || undefined}
            onChange={(e) => setEndDate(e.target.value)}
            aria-label={tr("End date")}
            className="font-body"
            style={{ padding: "9px 12px", borderRadius: 10, border: `1px solid ${t.border}`, background: t.panelAlt, color: t.text, fontSize: 13, outline: "none" }}
          />

          <div style={{ display: "flex", alignItems: "center", gap: 8, marginLeft: "auto" }}>
            <span className="font-body" style={{ fontSize: 11.5, color: t.textDim }}>{tr("ROOMS")}</span>
            <button onClick={() => setRoomsOverride(Math.max(1, effectiveRooms - 1))} className="font-utility" style={{
              width: 26, height: 26, borderRadius: "50%", border: `1px solid ${t.border}`, background: t.panelAlt,
              color: t.text, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
            }}>
              <Minus size={12} />
            </button>
            <span className="font-display" style={{ fontSize: 14, color: t.text, minWidth: 14, textAlign: "center" }}>{effectiveRooms}</span>
            <button onClick={() => setRoomsOverride(effectiveRooms + 1)} className="font-utility" style={{
              width: 26, height: 26, borderRadius: "50%", border: `1px solid ${t.border}`, background: t.panelAlt,
              color: t.text, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
            }}>
              <Plus size={12} />
            </button>
          </div>
        </div>
        <div className="font-body" style={{ fontSize: 11, color: t.textDim, display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8 }}>
          <span>{tr("Optional — used to auto-detect season and set trip length")}</span>
          <span style={{
            display: "inline-flex", alignItems: "center", gap: 5, padding: "3px 9px", borderRadius: 999,
            border: `1px solid ${seasonColor(t, previewSeason)}55`, color: seasonColor(t, previewSeason), fontSize: 11, fontWeight: 700,
          }}>
            <Sun size={11} /> {tr("Detected season")}: {tr(previewSeason + " season")}
          </span>
          {!startDate && <span>({tr("based on today's date — set your travel dates above for an exact match")})</span>}
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", marginBottom: 22 }}>
        <select value={region} onChange={(e) => { setRegion(e.target.value); setPlan(null); }} className="font-utility" style={selectStyle}>
          <option value="All">{tr("All India")}</option>
          <optgroup label={tr("By Region")}>
            {REGIONS.map((r) => <option key={r} value={r}>{tr(r)}</option>)}
          </optgroup>
          <optgroup label={tr("By State / UT")}>
            {ALL_STATES_SORTED.map((s) => <option key={s.id} value={`st:${s.id}`}>{tr(s.name)}</option>)}
          </optgroup>
          <optgroup label={tr("By City")}>
            {ALL_CITIES_SORTED.map((c) => <option key={c.city} value={`ct:${c.city}`}>{tr(c.city)}</option>)}
          </optgroup>
        </select>
        <select value={district} onChange={(e) => { setDistrict(e.target.value); setPlan(null); }} className="font-utility" style={selectStyle}>
          <option value="All">{tr("All Districts")}</option>
          {ALL_DISTRICTS_SORTED.map((d) => <option key={d.district} value={d.district}>{tr(d.district)}</option>)}
        </select>
        <select
          value={days}
          onChange={(e) => { setDays(Number(e.target.value)); setPlan(null); setStartDate(""); setEndDate(""); }}
          className="font-utility"
          style={selectStyle}
        >
          {[...new Set([3, 5, 7, 10, days])].sort((a, b) => a - b).map((d) => <option key={d} value={d}>{d} days</option>)}
        </select>
        <button onClick={generate} className="font-utility" style={{
          padding: "10px 20px", borderRadius: 999, border: "none", background: t.saffron, color: "#1a0f00",
          fontSize: 12.5, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6,
        }}>
          <Compass size={14} /> {tr("GENERATE ITINERARY")}
        </button>
        <button
          onClick={() => onAskGuide && onAskGuide(plannerSelectionToGuideText({ region, district, days }))}
          className="font-utility"
          style={{
            padding: "10px 20px", borderRadius: 999, border: `1px solid ${t.border}`, background: "none", color: t.text,
            fontSize: 12.5, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6,
          }}
        >
          <Sparkles size={14} color={t.gold} /> {tr("ASK THE AI GUIDE INSTEAD")}
        </button>
      </div>

      {plan && plan.length === 0 && (
        <div className="font-body" style={{ color: t.textDim, fontSize: 13.5 }}>
          {district !== "All"
            ? tr("No heritage sites found for that district yet — try \"All Districts\".")
            : isCityDestination(region)
            ? tr("No heritage sites found for that city yet — try \"All India\".")
            : isStateDestination(region)
            ? tr("No heritage sites found for that state/UT yet — try \"All India\".")
            : tr("No heritage sites found for that region yet — try \"All India\".")}
        </div>
      )}

      {estimate && (
        <div style={{ marginBottom: 24, padding: 18, borderRadius: 14, border: `1px solid ${t.border}`, background: t.panel }}>
          <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 14 }}>
            <div className="font-utility" style={{ fontSize: 11.5, color: t.gold, display: "flex", alignItems: "center", gap: 6 }}>
              <Sparkles size={13} /> {tr("ESTIMATED TRIP COST")}
            </div>
            <span style={{
              display: "inline-flex", alignItems: "center", gap: 5, padding: "4px 10px", borderRadius: 999,
              border: `1px solid ${seasonColor(t, estimate.detectedSeason)}55`, background: `${seasonColor(t, estimate.detectedSeason)}18`,
              color: seasonColor(t, estimate.detectedSeason), fontSize: 11.5, fontWeight: 700,
            }}>
              <Sun size={11} /> {tr(estimate.detectedSeason + " season")}
            </span>
          </div>

          {/* Breakdown: Hotel + Food + Transport + Activities */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(130px,1fr))", gap: 16, marginBottom: 16 }}>
            <div>
              <div className="font-body" style={{ fontSize: 11.5, color: t.textDim, display: "flex", alignItems: "center", gap: 5, marginBottom: 4 }}>
                <Hotel size={12} /> {tr("HOTELS")} ({estimate.rooms} {tr(estimate.rooms > 1 ? "rooms" : "room")} · {estimate.nights} {tr(estimate.nights > 1 ? "nights" : "night")})
              </div>
              <div className="font-display" style={{ fontSize: 18, color: t.text }}>{formatINR(estimate.hotelTotal)}</div>

/* ============================== MULTI-CITY ROUTE PLANNER ==============================
   Ordered, arbitrary-length route across any named Indian places (not limited to
   this site's curated STATES data). Each stop is resolved live — top sights + where
   to stay — and every gap between consecutive stops gets real transport options.

   Gemini requests go through this site's own /api/gemini endpoint (see
   server.js), so the API key stays on the server and never reaches the
   browser. ======= */
const ROUTE_PLANNER_PLACEHOLDER = "e.g. Kanpur, Agra, Vrindavan";
// Every Gemini call goes to our own backend, which holds the key. Nothing
// secret ships to the browser, and one shared server-side key means visitors
// never have to supply their own.
const GEMINI_PROXY_ENDPOINT = "/api/gemini";

function parseRoutePlaces(raw) {
  const text = String(raw || "").trim();
  if (!text) return [];

  const explicit = text
    .split(/\s*(?:,|->|→|\u2192|\||;|\bthen\b|\bvia\b)\s*/i)
    .map(s => s.trim()).filter(Boolean);
  if (explicit.length > 1) return [...new Set(explicit)].slice(0, 6);

  const aliases = [
    ["new delhi", "New Delhi"], ["hyderabad", "Hyderabad"], ["hydrebad", "Hyderabad"],
    ["hydrabad", "Hyderabad"], ["hyderbad", "Hyderabad"], ["bengaluru", "Bengaluru"], ["bangalore", "Bengaluru"],
    ["kanpur", "Kanpur"], ["delhi", "Delhi"], ["agra", "Agra"], ["vrindavan", "Vrindavan"], ["jaipur", "Jaipur"],
    ["mumbai", "Mumbai"], ["kolkata", "Kolkata"], ["chennai", "Chennai"], ["lucknow", "Lucknow"],
    ["varanasi", "Varanasi"], ["rishikesh", "Rishikesh"], ["haridwar", "Haridwar"], ["ayodhya", "Ayodhya"],
    ["amritsar", "Amritsar"], ["udaipur", "Udaipur"], ["jodhpur", "Jodhpur"], ["goa", "Goa"],
    ["mysore", "Mysuru"], ["mysuru", "Mysuru"], ["kochi", "Kochi"], ["pune", "Pune"], ["ahmedabad", "Ahmedabad"],
    ["surat", "Surat"], ["indore", "Indore"], ["bhopal", "Bhopal"], ["patna", "Patna"], ["ranchi", "Ranchi"],
    ["dehradun", "Dehradun"], ["chandigarh", "Chandigarh"], ["jaisalmer", "Jaisalmer"], ["pushkar", "Pushkar"],
    ["mathura", "Mathura"]
  ].sort((a,b) => b[0].length - a[0].length);

  const normalized = text.toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  const found = [];
  let rest = normalized;

  const distance = (a,b) => {
    const prev = Array.from({length:b.length+1}, (_,i)=>i);
    for(let i=1;i<=a.length;i++){
      const cur=[i];
      for(let j=1;j<=b.length;j++) cur[j]=Math.min(cur[j-1]+1, prev[j]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
      for(let j=0;j<cur.length;j++) prev[j]=cur[j];
    }
    return prev[b.length];
  };

  while (rest && found.length < 6) {
    let matched = false;
    for (const [key,label] of aliases) {
      const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp(`^${escaped}(?=\\s|$)`, "i");
      if (re.test(rest)) {
        found.push(label);
        rest = rest.replace(re, "").trim();
        matched = true;
        break;
      }
    }
    if (matched) continue;

    const parts = rest.split(/\s+/);
    const token = parts[0];
    const candidate = aliases.find(([key]) => token.length >= 5 && distance(token,key) <= (token.length >= 8 ? 2 : 1));
    if (!candidate) break;
    found.push(candidate[1]);
    rest = parts.slice(1).join(" ").trim();
  }

  return found.length >= 2 ? [...new Set(found)].slice(0, 6) : [text];
}

/* ============================== GEMINI RELIABILITY LAYER ==============================
   Every Gemini-powered feature on the site (chatbot, route planner, history
   explainer, Hindi translation, weather advice, Solan planner, nearby-place
   pins) goes through requestGemini() below. These pieces are what make that
   one shared call resilient:

   - GEMINI_REQUEST_TIMEOUT_MS: a hard cap on how long a single call may hang,
     enforced with AbortController so the UI is never stuck on a spinner.
   - GeminiApiError: a typed error (still a real Error, so existing
     `.catch(() => fallback)` / `try { } catch (e) { }` callers are unaffected)
     carrying a stable `.code` any caller can optionally branch on.
   - geminiFriendlyMessage(): maps a `.code` to a short, non-technical message
     safe to show directly to a user — never a stack trace, endpoint, key or
     raw server error body.
========================================================================== */
const GEMINI_REQUEST_TIMEOUT_MS = 18000; // ~15-20s cap, see requirement above.

/* ============================== GEMINI SERVICE STATUS ==============================
   A tiny external store (read via React.useSyncExternalStore) tracking whether
   Gemini has actually been reachable, based purely on the outcome of real calls
   that some feature already made for its own reason (chatbot, route planner,
   weather advice, etc.) — this never fires a request just to "ping" the service,
   so there's no extra API cost and nothing runs on a timer/interval.
   States: "unknown" (no real call has completed yet this session — we simply
   haven't found out either way, so callers should say something neutral rather
   than claim "Online"), "online" (most recent real call succeeded), "unavailable"
   (most recent real call failed for a reason that indicates the service itself
   is unreachable/misconfigured, not just a one-off hiccup with that request).
========================================================================== */
let geminiServiceStatus = "unknown";
const geminiServiceListeners = new Set();
function setGeminiServiceStatus(next) {
  if (geminiServiceStatus === next) return;
  geminiServiceStatus = next;
  geminiServiceListeners.forEach((fn) => fn());
}
// Codes that mean the service/connection itself is the problem, as opposed to
// something specific to one request (a bad reply body, a momentary rate limit)
// that says nothing about whether Gemini is reachable overall.
const GEMINI_OUTAGE_CODES = new Set(["offline", "network", "timeout", "server_error", "invalid_config", "model_unavailable"]);
function useGeminiServiceStatus() {
  return React.useSyncExternalStore(
    (onChange) => { geminiServiceListeners.add(onChange); return () => geminiServiceListeners.delete(onChange); },
    () => geminiServiceStatus
  );
}

class GeminiApiError extends Error {
  constructor(code, debugMessage) {
    super(debugMessage || code);
    this.name = "GeminiApiError";
    this.code = code; // offline | timeout | cancelled | network | invalid_config |
                       // model_unavailable | rate_limited | server_error |
                       // invalid_response | empty_response | api_error
  }
}

function geminiFriendlyMessage(err) {
  const code = err && err.code;
  switch (code) {
    case "offline":
      return "You seem to be offline — check your internet connection and try again.";
    case "timeout":
      return "That's taking too long to respond — please try again.";
    case "invalid_config":
    case "model_unavailable":
      return "The AI assistant is temporarily unavailable.";
    case "rate_limited":
      return "The assistant is busy right now. Please try again in a moment.";
    case "server_error":
      return "The AI service is temporarily unavailable — please try again shortly.";
    case "invalid_response":
    case "empty_response":
      return "Something went wrong reading the AI's response — please try again.";
    case "cancelled":
      return ""; // Intentionally cancelled (e.g. component unmounted) — not a user-facing error.
    case "network":
    case "api_error":
    default:
      return "I couldn't reach the AI service right now — please try again.";
  }
}

/* Transport layer. Every Gemini-powered feature on this page funnels through
   here, so timeouts, cancellation, error codes and the service-status signal
   are dealt with once. It posts to our own /api/gemini endpoint, which holds
   the key, and returns the model's reply as raw text. */
async function requestGemini({ system, message, history, format, signal }) {
  // Cheap short-circuit: no point waiting out the full timeout when the
  // browser already knows there is no connection.
  if (typeof navigator !== "undefined" && navigator.onLine === false) {
    setGeminiServiceStatus("unavailable");
    throw new GeminiApiError("offline", "offline");
  }

  const controller = new AbortController();
  // A caller-driven cancel (component unmounted) and our own timeout both
  // surface as AbortError, but only the timeout deserves a user-facing
  // message — so record which one fired.
  let abortReason = null;
  const timer = setTimeout(() => { abortReason = "timeout"; controller.abort(); }, GEMINI_REQUEST_TIMEOUT_MS);
  let forwardAbort = null;
  if (signal) {
    if (signal.aborted) { abortReason = "external"; controller.abort(); }
    else {
      forwardAbort = () => { abortReason = "external"; controller.abort(); };
      signal.addEventListener("abort", forwardAbort);
    }
  }

  try {
    let response;
    try {
      response = await fetch(GEMINI_PROXY_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ system, message, history, format }),
        signal: controller.signal,
      });
    } catch (err) {
      if (err && err.name === "AbortError") {
        throw new GeminiApiError(abortReason === "external" ? "cancelled" : "timeout", "aborted");
      }
      // Nearly always means the page was opened straight from disk (file://)
      // or the Node server isn't running — there is nothing at /api/gemini.
      console.error(`[Gemini] could not reach ${GEMINI_PROXY_ENDPOINT}. Start the server with ` +
        `\`npm start\` and open the site through it rather than as a file:// URL.`, err);
      throw new GeminiApiError("network", err && err.message);
    }

    let body = null;
    try { body = await response.json(); } catch (err) { body = null; }

    if (!response.ok) {
      // The server has already logged the upstream detail; it hands back only a
      // stable code, so nothing about the key or the prompt reaches the client.
      throw new GeminiApiError((body && body.error) || statusToGeminiCode(response.status), `proxy_${response.status}`);
    }

    const text = body && typeof body.text === "string" ? body.text.trim() : "";
    if (!text) throw new GeminiApiError("empty_response", "empty_reply");

    setGeminiServiceStatus("online");
    return text;
  } catch (err) {
    // Only an unreachable or misconfigured service marks Gemini as down — one
    // rate-limited or malformed reply says nothing about the next call.
    if (err instanceof GeminiApiError && GEMINI_OUTAGE_CODES.has(err.code)) {
      setGeminiServiceStatus("unavailable");
    }
    throw err;
  } finally {
    clearTimeout(timer);
    if (signal && forwardAbort) signal.removeEventListener("abort", forwardAbort);
  }
}

// Fallback for the case where something between us and the server (a proxy, a
// dev tunnel) answers instead of the server's own JSON error body.
function statusToGeminiCode(status) {
  if (status === 429) return "rate_limited";
  if (status === 503) return "invalid_config";
  if (status === 504) return "timeout";
  if (status >= 500) return "server_error";
  return "api_error";
}

/* Structured features — route stops, transport legs, weather advice, the
   heritage explainer, Hindi translation, nearby map pins, the Solan planner —
   all want a parsed object, so they request JSON and share one parse here
   instead of each re-implementing it. */
async function callGeminiForRoute(systemPrompt, userPrompt, history, externalSignal) {
  const text = await requestGemini({
    system: systemPrompt,
    message: userPrompt,
    history,
    format: "json",
    signal: externalSignal,
  });

  let parsed;
  try {
    parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
  } catch (err) {
    throw new GeminiApiError("invalid_response", "reply_was_not_json");
  }

  // A few prompts come back wrapped in a { result: ... } envelope; unwrap it so
  // callers always see the shape their own prompt asked for.
  if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
    if (parsed.attractions || parsed.stay || parsed.options) return parsed;
    if (parsed.result && typeof parsed.result === "object") return parsed.result;
  }
  return parsed;
}

/* The chatbot wants prose. Forcing a conversational answer through a JSON
   envelope only added a way for a perfectly good reply to be discarded, so
   chat asks for plain text and gets the string straight back. */
function requestChatReply({ system, message, history, signal }) {
  return requestGemini({ system, message, history, format: "text", signal });
}

function findCuratedRouteAttractions(place) {
  const q = String(place || "").trim().toLowerCase();
  const matches = [];
  STATES.forEach((state) => (state.attractions || []).forEach((a) => {
    const hay = `${a.name} ${a.city || ""} ${state.name}`.toLowerCase();
    if (hay.includes(q) || q.includes(String(a.city || "").toLowerCase()) || q === String(state.name).toLowerCase()) matches.push(a);
  }));
  return matches.slice(0, 4);
}

function routeFallbackKey(place){
  const q=String(place||"").toLowerCase().replace(/[^a-z]/g,"");
  return q === "newdelhi" ? "delhi" : q;
}

function localRoutePlaceInfo(place) {
  const key = routeFallbackKey(place);
  const preset = ROUTE_CITY_FALLBACKS[key];
  if (preset) {
    return {
      attractions: preset.attractions.map(a => ({name:a[0],type:a[1],desc:a[2]})),
      stay: [
        {area:preset.city,tier:"Budget",price_range:"₹1,000–2,000",example:`Budget stays in ${preset.city}`},
        {area:preset.city,tier:"Mid-range",price_range:"₹2,000–4,500",example:`Mid-range stays in ${preset.city}`},
        {area:preset.city,tier:"Luxury",price_range:"₹5,000+",example:`Luxury stays in ${preset.city}`}
      ], source:"curated-fallback", city:preset.city, state:preset.state, coords:preset.coords
    };
  }
  const matches = findCuratedRouteAttractions(place);
  if (!matches.length) {
    // Last local fallback: resolve a close known city name instead of showing
    // a dead error card for a small spelling mistake.
    const aliases = Object.keys(ROUTE_CITY_FALLBACKS);
    const q = String(place || "").toLowerCase().replace(/[^a-z]/g, "");
    const dist = (a,b) => {
      const prev = Array.from({length:b.length+1}, (_,i)=>i);
      for(let i=1;i<=a.length;i++){ const cur=[i]; for(let j=1;j<=b.length;j++) cur[j]=Math.min(cur[j-1]+1, prev[j]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); for(let j=0;j<cur.length;j++) prev[j]=cur[j]; }
      return prev[b.length];
    };
    const close = aliases.find(k => q.length >= 5 && dist(q,k) <= (q.length >= 8 ? 2 : 1));
    if (close) {
      const preset = ROUTE_CITY_FALLBACKS[close];
      return { attractions:preset.attractions.map(a=>({name:a[0],type:a[1],desc:a[2]})), stay:[
        {area:preset.city,tier:"Budget",price_range:"₹1,000–2,000",example:`Budget stays in ${preset.city}`},
        {area:preset.city,tier:"Mid-range",price_range:"₹2,000–4,500",example:`Mid-range stays in ${preset.city}`},
        {area:preset.city,tier:"Luxury",price_range:"₹5,000+",example:`Luxury stays in ${preset.city}`}
      ], source:"curated-fallback", city:preset.city, state:preset.state, coords:preset.coords };
    }
    throw new Error("route_place_not_found");
  }
  const city = matches[0].city || place;
  return {attractions:matches.map(a=>({name:a.name,type:a.category||"Heritage",desc:a.shortDesc||a.overview||"Curated heritage attraction."})),stay:[
    {area:city,tier:"Budget",price_range:"₹1,000–2,000",example:`Budget stays in ${city}`},
    {area:city,tier:"Mid-range",price_range:"₹2,000–4,500",example:`Mid-range stays in ${city}`},
    {area:city,tier:"Luxury",price_range:"₹5,000+",example:`Luxury stays in ${city}`}
  ],source:"curated"};
}

// Turns the static "Check schedule" / "Depends on traffic" label into an
// actual clickable action — since there's no live timetable API wired up,
// this opens a sensibly-targeted search (IRCTC for trains, redBus for
// buses, a maps/cab search otherwise) so the label is genuinely workable
// instead of just inert text.
function routeScheduleUrl(mode, from, to) {
  const m = String(mode || "").toLowerCase();
  const q = (s) => encodeURIComponent(s);
  if (m.includes("train")) return `https://www.google.com/search?q=${q(`IRCTC trains from ${from} to ${to} schedule`)}`;
  if (m.includes("bus")) return `https://www.google.com/search?q=${q(`bus from ${from} to ${to} timings redBus`)}`;
  if (m.includes("cab") || m.includes("taxi")) return `https://www.google.com/search?q=${q(`cab fare ${from} to ${to} Ola Uber`)}`;
  return `https://www.google.com/search?q=${q(`${mode} from ${from} to ${to}`)}`;
}

function localRouteTransfer(from, to) {
  return {

function fetchRoutePlaceInfo(place) {
  const sys = "You are a concise India travel data source. Respond with ONLY a raw JSON object — no markdown fences, no preamble, no commentary.";

{"attractions":[{"name":string,"type":string (one or two words, e.g. "Temple","Fort","Ghat","Museum"),"desc":string (max 18 words, factual)}],"stay":[{"area":string (neighbourhood/locality name),"tier":string ("Budget","Mid-range", or "Luxury"),"price_range":string (INR per night, e.g. "₹1,200–2,000"),"example":string (a real or representative property/area name)}]}
Include 3 to 4 attractions covering different types (temples, monuments, nature, local experience) and exactly 3 stay options, one per tier. If "${place}" is ambiguous or not a real place, still return your best-guess real data for the most likely Indian location with that name.`;

function fetchRouteTransfer(from, to) {

/* ============================== AI HERITAGE GUIDE ==============================
   A grounded, natural-language trip planner: the person describes a budget,
   a number of days and their interests in plain words, and the guide picks a
   real state and a real day-by-day route from this site's own attraction
   data — never an invented place. A single short, warm intro line is
   optionally generated by a live call to the Claude API for tone; if that
   call is unavailable, everything else (route, cost, best time, food,
   transport) still works fully offline, since it's built entirely from data
   already in this file.
=========================================================================== */
const GUIDE_INTEREST_KEYWORDS = {
  Temple: ["temple", "temples", "shrine", "shrines", "jyotirling", "pilgrim", "pilgrimage", "spiritual", "devotional"],
  Fort: ["fort", "forts", "hillfort", "hill fort"],
  Palace: ["palace", "palaces", "royal", "maharaja"],
  Monument: ["monument", "monuments", "mausoleum", "tomb", "mughal"],
  Museum: ["museum", "museums", "gallery"],
  Mosque: ["mosque", "mosques"],
};

// Best-effort guess at a specific named place (a city, town or landmark) in
// the free-text query — e.g. "kanyakumari" out of "plan a trip to
// kanyakumari" or "Rishikesh" out of "4 days in Rishikesh". Deliberately
// case-insensitive: people typing casually often don't capitalize place
// names at all, so this can't rely on capitalization the way a stricter
// proper-noun heuristic would. Instead it strips every budget/day phrase,
// filler word (plan, trip, visit, budget…) and interest keyword out of the
// query and — if a short, specific-looking remainder survives — treats that
// as the place name. This mirrors the same "best-effort guess from free
// text" approach already used elsewhere on the site (see
// guessCategoryFromText / guessLocationFromText) rather than requiring an
// exact, correctly-capitalized match.
const GUIDE_FILLER_WORDS = new Set([
  "plan", "planning", "plane", "trip", "trips", "travel", "traveling", "travelling",
  "to", "in", "for", "a", "an", "the", "of", "and", "or", "with", "on",
  "day", "days", "budget", "rupees", "rs", "inr", "please", "would", "like", "likes",
  "want", "wants", "visit", "visiting", "go", "going", "where", "should", "i", "have", "has",
  "interested", "looking", "suggest", "suggestions", "me", "my", "near", "nearby", "around", "at",
  "best", "good", "nice", "places", "place", "india", "north", "south", "east", "west", "central",
  "region", "food", "cuisine", "traditional", "culinary", "eat", "dish", "dishes", "delicacies", "delicacy",
]);
const GUIDE_ALL_INTEREST_WORDS = new Set(
  Object.entries(GUIDE_INTEREST_KEYWORDS).flatMap(([cat, words]) => [cat.toLowerCase(), ...words.flatMap((w) => w.split(" "))])
);
function extractPlaceQuery(raw) {
  const noBudgetOrDays = raw.replace(/₹\s?[\d,]+/g, " ").replace(/\b\d+\s*-?\s*days?\b/gi, " ");
  const tokenize = (s) => s.match(/[A-Za-z]+/g) || [];
  const isFiller = (w) => GUIDE_FILLER_WORDS.has(w.toLowerCase()) || GUIDE_ALL_INTEREST_WORDS.has(w.toLowerCase());

  // Prefer whatever immediately follows a locating word ("to", "in",
  // "visit"…) — most explicit and least likely to be a false positive.
  const afterPreposition = noBudgetOrDays.match(
    /\b(?:to|in|visit(?:ing)?|near|around|at|for)\s+([a-zA-Z]+(?:\s+[a-zA-Z]+){0,3})/i
  );
  if (afterPreposition) {
    const words = tokenize(afterPreposition[1]).filter((w) => !isFiller(w));
    if (words.length) return words.join(" ");
  }

  // Otherwise, only for a short, terse query (e.g. just "kanyakumari", or
  // "kanyakumari 3 days") — strip every filler/interest word out and, if a
  // short remainder survives, treat it as the place name. Restricted to
  // short inputs so a longer ordinary sentence (with no named place at all)
  // can't accidentally leave behind unrelated words like "itinerary" or
  // "hotels" and get misread as a place.
  const allWords = tokenize(noBudgetOrDays);
  if (allWords.length <= 6) {
    const leftover = allWords.filter((w) => !isFiller(w));
    if (leftover.length && leftover.length <= 4) return leftover.join(" ");
  }
  return null;
}

// Best-effort guess at SEVERAL named places in one query — e.g. "Kanpur,
// Agra and Vrindavan, 5 days" — so a trip spanning more than one city/town
// can be planned as a single multi-stop route instead of only ever picking
// one place. Splits the query on commas, "and", "&", "then" and "via", then
// runs each resulting segment through the same filler/interest-word strip
// used by extractPlaceQuery. Deliberately conservative: a segment only
// counts as a place if a short (1-3 word) remainder survives, so an ordinary
// sentence like "temples and traditional food" (both filler/interest words)
// never gets misread as two places. Returns null unless at least two
// distinct place-like segments are found, so single-place queries keep
// going through the existing extractPlaceQuery path untouched.
function extractMultiPlaceQueries(raw) {
  const noBudgetOrDays = raw.replace(/₹\s?[\d,]+/g, " ").replace(/\b\d+\s*-?\s*days?\b/gi, " ");
  const segments = noBudgetOrDays.split(/\s*(?:,|&|\bthen\b|\bvia\b|\band\b)\s*/i);
  const tokenize = (s) => s.match(/[A-Za-z]+/g) || [];
  const isFiller = (w) => GUIDE_FILLER_WORDS.has(w.toLowerCase()) || GUIDE_ALL_INTEREST_WORDS.has(w.toLowerCase());
  const places = [];
  segments.forEach((seg) => {
    const words = tokenize(seg).filter((w) => !isFiller(w));
    if (words.length >= 1 && words.length <= 3) places.push(words.join(" "));
  });
  const seen = new Set();
  const uniquePlaces = places.filter((p) => {
    const k = p.toLowerCase();
    if (!k || seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  return uniquePlaces.length >= 2 ? uniquePlaces : null;
}

function parseGuideQuery(raw) {
  const lower = raw.toLowerCase();
  const budgetMatch =
    lower.match(/₹\s?([\d,]+)/) ||
    lower.match(/(?:rs\.?|inr)\s?([\d,]+)/) ||
    lower.match(/([\d,]{4,})\s?(?:rupees|rs\.?|inr)/);
  const budget = budgetMatch ? parseInt(budgetMatch[1].replace(/,/g, ""), 10) : null;
  const daysMatch = lower.match(/(\d+)\s*-?\s*day/);
  const days = daysMatch ? Math.max(1, Math.min(10, parseInt(daysMatch[1], 10))) : 3;
  const interests = Object.keys(GUIDE_INTEREST_KEYWORDS).filter((k) =>
    GUIDE_INTEREST_KEYWORDS[k].some((w) => lower.includes(w))
  );
  const wantsFood = /food|cuisine|culinary|\beat\b|dish|thali|delicac/.test(lower);
  const stateMatch = STATES.find((s) => s.id !== "india" && lower.includes(s.name.toLowerCase()));
  const regionMatch = REGIONS.find((r) => lower.includes(r.toLowerCase()));
  const placeQueries = stateMatch ? null : extractMultiPlaceQueries(raw);
  const placeQuery = stateMatch ? null : (placeQueries ? null : extractPlaceQuery(raw));
  return { budget, days, interests, wantsFood, stateMatch, regionMatch, placeQuery, placeQueries, raw };
}

function scoreStateForGuide(s, parsed) {
  if (!s.attractions || !s.attractions.length) return -Infinity;
  if (parsed.stateMatch) return s.id === parsed.stateMatch.id ? 1e6 : -1e6;
  let score = 0;
  const cats = s.attractions.map((a) => a.category);
  if (parsed.interests.length) {
    parsed.interests.forEach((i) => { score += cats.filter((c) => c === i).length * 4; });
  } else {
    score += Math.min(s.attractions.length, 5);
  }
  if (parsed.wantsFood) score += Math.min(s.culture?.food?.length || 0, 4);
  if (parsed.regionMatch && s.region === parsed.regionMatch) score += 6;
  score += Math.min(s.attractions.length, 3) * 0.5;
  return score;
}

function buildGuideItinerary(stateId, parsed) {
  const wanted = parsed.interests.length ? parsed.interests : null;
  const pool = ALL_ATTRACTIONS.filter((a) => a.stateId === stateId).slice().sort((a, b) => {
    const aM = wanted ? (wanted.includes(a.category) ? 1 : 0) : 0;
    const bM = wanted ? (wanted.includes(b.category) ? 1 : 0) : 0;
    return bM - aM;
  });
  const byCity = {};
  pool.forEach((a) => { (byCity[a.city] = byCity[a.city] || []).push(a); });
  const cities = Object.keys(byCity);
  const used = new Set();
  const perDay = 2;
  const days = [];
  for (let i = 0; i < parsed.days; i++) {
    let city = cities.length ? cities[i % cities.length] : null;
    let items = city ? (byCity[city] || []).filter((a) => !used.has(a.id)).slice(0, perDay) : [];
    if (items.length === 0) {
      const extra = pool.filter((a) => !used.has(a.id)).slice(0, perDay);
      if (extra.length) { items = extra; city = extra[0].city; }
    }
    items.forEach((a) => used.add(a.id));
    if (items.length) days.push({ day: i + 1, city, items });
  }
  return days;
}

function estimateGuideCost(days, travellers = 1) {
  const rooms = Math.max(1, Math.ceil(travellers / 2));
  let hotelTotal = 0;
  days.forEach((d) => {
    const prices = d.items.flatMap(
      (a) => a.travel?.hotels?.map((h) => HOTEL_TIER_INR[h.price] ?? HOTEL_TIER_INR["₹₹"]) || [HOTEL_TIER_INR["₹₹"]]
    );
    const nightly = prices.length ? prices.reduce((s, v) => s + v, 0) / prices.length : HOTEL_TIER_INR["₹₹"];
    hotelTotal += nightly * rooms;
  });
  const foodTotal = FOOD_PER_PERSON_PER_DAY_INR * travellers * Math.max(days.length, 1);
  return { hotelTotal, foodTotal, grandTotal: hotelTotal + foodTotal, rooms, travellers, nights: days.length };
}

function summarizeGuideBestTime(days) {
  const counts = {};
  days.forEach((d) => d.items.forEach((a) => {
    const m = a.bestTime?.months;
    if (m) counts[m] = (counts[m] || 0) + 1;
  }));
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  return entries[0]?.[0] || "Oct – Mar";
}

function summarizeGuideFood(state) {
  return (state.culture?.food || []).slice(0, 4).join(", ");
}

function summarizeGuideTransport(state, days) {
  const first = days[0]?.items?.[0];
  const local = first?.localTransport ? ` Locally: ${first.localTransport}` : "";
  if (first?.travel?.airport) {
    const busLeg = first?.travel?.bus ? `, or a bus to ${first.travel.bus.name}` : ", or a long-distance bus";
    return `Fly into ${first.travel.airport.name} (${first.travel.airport.code}), take the train to ${first.travel.railway?.name || state.capital}${busLeg}. Move between stops by train, bus, or a hired car.${local}`;
  }
  return `Fly or take the train into ${state.capital}, or arrive by long-distance bus; travel between stops by train, bus, or a hired car.${local}`;
}

// Splits free text into rough sentences, so a live Wikipedia extract can be
// spread across a multi-day plan (one idea per day) instead of dumped as a
// single block.
function splitIntoSentences(text) {
  return (text || "").split(/(?<=[.!?])\s+/).map((s) => s.trim()).filter(Boolean);
}

// Builds a day-by-day plan for a place that ISN'T in our curated STATES
// data, using a real live Wikipedia lookup (the same search engine API this
// site already uses for its own search bar — see fetchWikiSummary /
// buildWebAttraction) instead of our own hand-curated trip data. Clearly
// lighter-weight than a curated plan (one place, no hotel/food data), but
// grounded in a real live source rather than invented.
function buildLiveItinerary(parsed, webState, webAttraction, summary) {
  const sentences = splitIntoSentences(webAttraction.overview);
  const days = [];
  for (let i = 0; i < parsed.days; i++) {
    const blurb = sentences.length
      ? sentences[i % sentences.length]
      : "No live overview text was available — see the linked source for more on this place.";
    days.push({ day: i + 1, city: webAttraction.city, blurb });
  }
  const nightly = HOTEL_TIER_INR["₹₹"];
  const foodTotal = FOOD_PER_PERSON_PER_DAY_INR * Math.max(days.length, 1);
  const hotelTotal = nightly * Math.max(days.length, 1);
  const cost = { hotelTotal, foodTotal, grandTotal: hotelTotal + foodTotal, rooms: 1, travellers: 1, nights: days.length };
  const withinBudget = parsed.budget == null || cost.grandTotal <= parsed.budget;
  return {
    kind: "live", place: webAttraction.name, city: webAttraction.city, state: webState,
    days, cost, withinBudget, parsed, thumbnail: summary.thumbnail, pageUrl: webAttraction.pageUrl,
  };
}

// Splits a total day count as evenly as possible across N stops (earlier
// stops get the extra day(s) on an uneven split) — e.g. 5 days across 3
// stops becomes [2, 2, 1]. Every stop is guaranteed at least 1 day, so if
// there are more stops than requested days the trip quietly runs a little
// longer than asked rather than dropping a named place.
function distributeDaysAcrossStops(totalDays, stopCount) {
  const base = Math.floor(totalDays / stopCount);
  const rem = totalDays % stopCount;
  return Array.from({ length: stopCount }, (_, i) => Math.max(base + (i < rem ? 1 : 0), 1));
}

// Resolves one named stop in a multi-city query to either our own curated
// city data (preferred — gives real attractions, hotel tiers, best-time
// data) or, failing that, a live Wikipedia lookup (same engine the single-
// place guide already uses), or finally an "unknown" stop if neither finds
// anything — so a typo or very obscure place doesn't break the whole route.
async function resolveGuideStop(placeName) {
  const cityHit = ALL_ATTRACTIONS.find((a) => a.city.toLowerCase() === placeName.toLowerCase());
  if (cityHit) {
    const state = STATES.find((s) => s.id === cityHit.stateId);
    return { kind: "curated", displayName: cityHit.city, city: cityHit.city, stateId: cityHit.stateId, state };
  }
  const summary = await fetchWikiSummary(placeName);
  if (!summary) return { kind: "unknown", displayName: placeName, city: placeName };
  const { state: webState, attraction: webAttraction } = buildWebAttraction(placeName, summary);
  return { kind: "live", displayName: webAttraction.name, city: webAttraction.city, state: webState, attraction: webAttraction };
}

// Builds the day entries for one curated stop within a multi-city route.
// `usedIds` is shared across every stop in the route so the same attraction
// is never suggested twice even if two stops happen to share a state.
function buildCuratedStopDays(stop, numDays, parsed, startDayNum, usedIds) {
  const wanted = parsed.interests.length ? parsed.interests : null;
  const cityPool = ALL_ATTRACTIONS.filter((a) => a.stateId === stop.stateId && a.city === stop.city)
    .slice()
    .sort((a, b) => {
      const aM = wanted ? (wanted.includes(a.category) ? 1 : 0) : 0;
      const bM = wanted ? (wanted.includes(b.category) ? 1 : 0) : 0;
      return bM - aM;
    });
  const perDay = 2;
  const days = [];
  for (let i = 0; i < numDays; i++) {
    const items = cityPool.filter((a) => !usedIds.has(a.id)).slice(0, perDay);
    items.forEach((a) => usedIds.add(a.id));
    days.push({
      day: startDayNum + i, city: stop.city, items,
      blurb: items.length ? null : `Free time to explore ${stop.city} at your own pace — every curated highlight here is already on an earlier day.`,
    });
  }
  return days;
}

// Builds the day entries for a live (non-curated) stop, spreading its
// Wikipedia overview across the days allotted to it — same technique as
// the single-place buildLiveItinerary above.
function buildLiveStopDays(stop, numDays, startDayNum) {
  const sentences = splitIntoSentences(stop.attraction && stop.attraction.overview);
  const days = [];
  for (let i = 0; i < numDays; i++) {
    const blurb = sentences.length
      ? sentences[i % sentences.length]
      : `No live overview text was available for ${stop.city} — see live search results below for more.`;
    days.push({ day: startDayNum + i, city: stop.city, items: [], blurb });
  }
  return days;
}

function buildUnknownStopDays(stop, numDays, startDayNum) {
  const days = [];
  for (let i = 0; i < numDays; i++) {
    days.push({
      day: startDayNum + i, city: stop.displayName, items: [],
      blurb: `We couldn't find curated or live details for "${stop.displayName}" yet — check the live search links below for up-to-date info.`,
    });
  }
  return days;
}

const GUIDE_INTERCITY_HOP_INR = 1200; // rough per-hop train/bus/car estimate between consecutive stops

// Ties several named stops together into one continuous, day-numbered
// route — resolving each stop (curated data first, live search as a
// fallback), splitting the requested day count across them, and rolling up
// a combined cost/best-time/food/transport summary the same way the
// single-place guide does. This is what powers queries like "Kanpur, Agra
// and Vrindavan, 5 days" instead of only ever being able to plan for one
// city or state at a time.
async function buildMultiCityItinerary(parsed, placeNames) {
  const effectiveDays = Math.max(parsed.days, placeNames.length);
  const allocation = distributeDaysAcrossStops(effectiveDays, placeNames.length);
  const stops = [];
  for (const name of placeNames) stops.push(await resolveGuideStop(name));

  const usedIds = new Set();
  let dayCursor = 1;
  let allDays = [];
  stops.forEach((stop, i) => {
    const n = allocation[i];
    let stopDays;
    if (stop.kind === "curated") stopDays = buildCuratedStopDays(stop, n, parsed, dayCursor, usedIds);
    else if (stop.kind === "live") stopDays = buildLiveStopDays(stop, n, dayCursor);
    else stopDays = buildUnknownStopDays(stop, n, dayCursor);
    allDays = allDays.concat(stopDays);
    dayCursor += n;
  });

  let hotelTotal = 0;
  allDays.forEach((d) => {
    const prices = d.items.flatMap(
      (a) => (a.travel && a.travel.hotels && a.travel.hotels.map((h) => HOTEL_TIER_INR[h.price] ?? HOTEL_TIER_INR["₹₹"])) || []
    );
    const nightly = prices.length ? prices.reduce((s, v) => s + v, 0) / prices.length : HOTEL_TIER_INR["₹₹"];
    hotelTotal += nightly;
  });
  const foodTotal = FOOD_PER_PERSON_PER_DAY_INR * Math.max(allDays.length, 1);
  const hops = Math.max(stops.length - 1, 0);
  const transportTotal = hops * GUIDE_INTERCITY_HOP_INR;
  const grandTotal = hotelTotal + foodTotal + transportTotal;
  const cost = { hotelTotal, foodTotal, transportTotal, grandTotal, rooms: 1, travellers: 1, nights: allDays.length };
  const withinBudget = parsed.budget == null || grandTotal <= parsed.budget;

  const bestTime = summarizeGuideBestTime(allDays) || "Oct – Mar";

  const foodSet = new Set();
  stops.forEach((stop) => {
    if (stop.state && stop.state.culture && stop.state.culture.food) {
      stop.state.culture.food.slice(0, 4).forEach((f) => foodSet.add(f));
    }
  });
  const food = foodSet.size
    ? [...foodSet].slice(0, 6).join(", ")
    : "Local specialities vary by stop — worth asking locally at each one.";

  const route = stops.map((s) => s.displayName).join(" → ");
  const transport = hops
    ? `Route order: ${route}. Travel between stops by train, bus, or a hired car — budget roughly ₹${GUIDE_INTERCITY_HOP_INR.toLocaleString("en-IN")} per hop for the connecting legs.`
    : `Fly or take the train into ${stops[0] ? stops[0].displayName : "your destination"}.`;

  return { kind: "multi", stops, route, days: allDays, cost, bestTime, food, transport, withinBudget, parsed };
}

// Real, functioning search-engine links (Google Flights / Google Search) —
// no flight-price or news API key can be called directly from a static,
// client-side page without a backend (the same CORS/auth limit already
// noted above for the Claude API), so rather than fabricate numbers this
// opens genuine live search results in a new tab.
function googleFlightsUrl(fromCity, toQuery) {
  return `https://www.google.com/travel/flights?q=${encodeURIComponent(`Flights from ${fromCity} to ${toQuery}`)}`;
}
function googleSearchUrl(query) {
  return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
}
function guideDestinationName(built) {
  if (built.kind === "live") return built.place;
  if (built.kind === "multi") return built.route;
  return built.state.name;
}
function guideFlightDestination(built) {
  if (built.kind === "live") return `${built.city}, India`;
  if (built.kind === "multi") {
    const lastStop = built.stops[built.stops.length - 1];
    return `${lastStop ? lastStop.city : built.route}, India`;
  }
  const firstAirport = built.days[0]?.items?.[0]?.travel?.airport;
  if (firstAirport && firstAirport.code && firstAirport.code !== "N/A" && firstAirport.code !== "—") {
    return `${firstAirport.code} airport`;
  }
  return `${built.state.capital}, India`;
}

// Shared "real search engine" tools panel, rendered under both a curated
// (local) plan and a live (unlisted-place) plan alike.
function GuideSearchTools({ t, tr, built, departCity, setDepartCity }) {
  const destName = guideDestinationName(built);

  const linkBtnStyle = {

    border: `1px solid ${t.border}`, background: t.panelAlt, color: t.text, fontSize: 12.5,
    fontWeight: 600, cursor: "pointer", textDecoration: "none",
  };
  return (
    <div style={{ padding: 18, borderRadius: 14, border: `1px solid ${t.border}`, background: t.panel, marginTop: 18 }}>
      <div className="font-utility" style={{ fontSize: 11.5, color: t.gold, marginBottom: 12, display: "flex", alignItems: "center", gap: 6 }}>
        <Search size={13} /> {tr("Search real results for this trip")}
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <input
          value={departCity}
          onChange={(e) => setDepartCity(e.target.value)}
          placeholder={tr("Flying from…")}
          className="font-body"
          style={{ padding: "10px 14px", borderRadius: 10, border: `1px solid ${t.border}`, background: t.panelAlt, color: t.text, fontSize: 12.5, outline: "none", width: 150 }}
        />
        <a href={flightUrl} target="_blank" rel="noopener noreferrer" className="font-utility" style={linkBtnStyle}>
          <Plane size={13} /> {tr("Search real flights")} <ExternalLink size={12} />
        </a>
        <a href={infoUrl} target="_blank" rel="noopener noreferrer" className="font-utility" style={linkBtnStyle}>
          <Search size={13} /> {tr("Search live travel info")} <ExternalLink size={12} />
        </a>
        <a href={uberBookingLink(`${destName}, India`)} target="_blank" rel="noopener noreferrer sponsored" className="font-utility" style={linkBtnStyle}>
          <Car size={13} /> {tr("Book on Uber")} <ExternalLink size={12} />
        </a>
        {built.kind === "live" && built.pageUrl && (
          <a href={built.pageUrl} target="_blank" rel="noopener noreferrer" className="font-utility" style={linkBtnStyle}>
            <ScrollText size={13} /> {tr("Read source article")} <ExternalLink size={12} />
          </a>
        )}
      </div>
      <div className="font-body" style={{ fontSize: 11, color: t.textDim, marginTop: 10 }}>
        {tr("Flights, travel info and Uber open real live results in a new tab — this site doesn't fetch or display flight or ride prices directly.")}
      </div>
    </div>
  );
}

function AIHeritageGuide({ t, onOpenAttraction, favs, toggleFav, externalQuery }) {
  const { tr } = useLang();
  const [query, setQuery] = useState("");
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [aiNote, setAiNote] = useState(null);
  const [noteLoading, setNoteLoading] = useState(false);
  const [liveSearching, setLiveSearching] = useState(false);
  const [departCity, setDepartCity] = useState("Delhi");
  const lastExternalId = useRef(null);
  // Live-as-you-type search: debounce timer + a record of the last query
  // string that was actually run (whether triggered by typing, a preset
  // click, Enter, or the button), so the debounce effect below never fires
  // a redundant second run for a query that was just run manually.
  const debounceRef = useRef(null);
  const lastRunQuery = useRef("");
  const [pendingSearch, setPendingSearch] = useState(false);
  // Guards the fire-and-forget Gemini "intro line" fetch below against
  // setting state after this component has unmounted.
  const isMountedRef = useRef(true);
  useEffect(() => () => { isMountedRef.current = false; }, []);

  const PRESETS = [
    "I have ₹10,000 and 3 days. I like temples and traditional food. Where should I go?",
    "5 days, ₹40,000 budget, forts and palaces please",
    "3 days, museums and monuments, north India",
    "4 days in Rishikesh",
    "Kanpur, Agra and Vrindavan, 5 days",
  ];

  // Builds a plan purely from this site's own curated STATES/attraction
  // data — instant, and works fully offline. Used both when a query names a
  // curated state/city directly, and as the final fallback when nothing
  // more specific was recognized.
  const runLocalGuide = (parsed, forcedStateId) => {
    const eligible = STATES.filter((s) => s.id !== "india" && s.attractions?.length);
    const chosen = forcedStateId
      ? eligible.find((s) => s.id === forcedStateId)
      : eligible.map((s) => ({ s, score: scoreStateForGuide(s, parsed) })).sort((a, b) => b.score - a.score)[0]?.s;

    if (!chosen) {
      setError(tr("Try asking about a budget, a number of days, or an interest like temples, forts, palaces or food."));
      return;
    }

    const days = buildGuideItinerary(chosen.id, parsed);
    const cost = estimateGuideCost(days, 1);
    const bestTime = summarizeGuideBestTime(days);
    const food = summarizeGuideFood(chosen);
    const transport = summarizeGuideTransport(chosen, days);
    const withinBudget = parsed.budget == null || cost.grandTotal <= parsed.budget;
    const built = { kind: "local", state: chosen, parsed, days, cost, bestTime, food, transport, withinBudget };
    setResult(built);

    // A warm, grounded intro line for the plan. Gemini is asked to phrase it
    // from the real data already computed above (never to invent facts); if
    // the call is unavailable for any reason, the local template line below
    // is used instead so the guide never breaks.
    const cityList = [...new Set(days.map((d) => d.city))].join(", ");
    const localNote = `${chosen.name} fits what you're after — a ${days.length}-day route through ${cityList} for roughly ${formatINR(cost.grandTotal)}.`;
    setAiNote(localNote);
    setNoteLoading(true);
    const sys = "Respond with ONLY a raw JSON object of the exact shape {\"line\": string} — no markdown fences, no commentary. The line is one short, warm sentence (max 28 words) introducing a travel itinerary, using ONLY the facts given.";
    const user = `Destination: ${chosen.name}. Days: ${days.length}. Cities: ${cityList}. Estimated total cost: ${formatINR(cost.grandTotal)}. Traveler interests: ${(parsed.interests || []).join(", ") || "general heritage travel"}.`;
    callGeminiForRoute(sys, user)
      .then((res) => {
        if (!isMountedRef.current) return;
        const line = typeof res === "string" ? res : res?.line;
        if (line && line.trim()) setAiNote(line.trim());
      })
      .catch(() => {})
      .finally(() => { if (isMountedRef.current) setNoteLoading(false); });
  };

  const runGuide = async (text) => {
    const q = (text ?? query).trim();
    if (!q) return;
    lastRunQuery.current = q;
    if (debounceRef.current) { clearTimeout(debounceRef.current); debounceRef.current = null; }
    setPendingSearch(false);
    setError(null);
    setAiNote(null);
    setResult(null);
    setLiveSearching(false);

    const parsed = parseGuideQuery(q);

    // 0) Several named places were recognized (e.g. "Kanpur, Agra and
    //    Vrindavan, 5 days") — build one continuous multi-stop route across
    //    all of them instead of picking just one.
    if (parsed.placeQueries && parsed.placeQueries.length >= 2) {
      setLiveSearching(true);
      const built = await buildMultiCityItinerary(parsed, parsed.placeQueries);
      setLiveSearching(false);
      setResult(built);
      setAiNote(`A ${built.days.length}-day route through ${built.route} for roughly ${formatINR(built.cost.grandTotal)}.`);
      return;
    }

    // 1) A curated state was named directly — plan for it from our own data.
    if (parsed.stateMatch) {
      runLocalGuide(parsed, parsed.stateMatch.id);
      return;
    }

    // 2) A named place was recognized that happens to be one of our
    //    curated cities — resolve it to its state and use our own data.
    if (parsed.placeQuery) {
      const cityHit = ALL_ATTRACTIONS.find((a) => a.city.toLowerCase() === parsed.placeQuery.toLowerCase());
      if (cityHit) {
        runLocalGuide(parsed, cityHit.stateId);
        return;
      }
    }

    // 3) A named place was recognized but isn't in our curated data at all —
    //    look it up live via the same Wikipedia search-engine API this
    //    site's own search bar already uses, so a trip can be planned for
    //    ANY real Indian place, not only the ones we've hand-curated.
    if (parsed.placeQuery) {
      setLiveSearching(true);
      const summary = await fetchWikiSummary(parsed.placeQuery);
      setLiveSearching(false);
      if (!summary) {
        setError(tr(`Couldn't find "${parsed.placeQuery}" via live search — try a different spelling, or ask about a budget, days, or an interest like temples, forts, palaces or food.`));
        return;
      }
      const { state: webState, attraction: webAttraction } = buildWebAttraction(parsed.placeQuery, summary);
      const built = buildLiveItinerary(parsed, webState, webAttraction, summary);
      setResult(built);
      setAiNote(`${webAttraction.name} isn't in our curated collection yet, so this plan is built live from a public web search rather than our own trip data.`);
      return;
    }

    // 4) No named place at all — fall back to keyword-scored curated data,
    //    exactly as before.
    runLocalGuide(parsed, null);
  };

  // Handoff from the manual "Plan a trip" builder above: each time it sends
  // a new request (a fresh id), fill the input with its text and run the
  // guide automatically — so picking a region/days there and clicking
  // "Ask the AI Guide instead" lands here with an answer already showing.
  useEffect(() => {
    if (!externalQuery || externalQuery.id === lastExternalId.current) return;
    lastExternalId.current = externalQuery.id;
    setQuery(externalQuery.text);
    runGuide(externalQuery.text);
  }, [externalQuery]);

  // Live search-as-you-type: keeps every place this guide can plan for in
  // mind (curated states/cities, and — via runGuide's own fallback chain —
  // any real place at all through the live web/Wikipedia lookup) and
  // re-runs automatically a moment after typing pauses, instead of waiting
  // for Enter or a button click. Debounced so a fresh network/wiki lookup
  // isn't fired on every single keystroke, and skipped entirely if this
  // exact text was already just run manually (preset click, Enter, button).
  useEffect(() => {
    if (debounceRef.current) clearTimeout(debounceRef.current);
    const trimmed = query.trim();
    if (!trimmed || trimmed === lastRunQuery.current) { setPendingSearch(false); return; }
    // Wait for at least a short, plausibly-complete phrase before searching,
    // so we're not firing on "k", "ka", "kan"…
    if (trimmed.length < 4) { setPendingSearch(false); return; }
    setPendingSearch(true);
    debounceRef.current = setTimeout(() => { setPendingSearch(false); runGuide(trimmed); }, 800);
    return () => { if (debounceRef.current) clearTimeout(debounceRef.current); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [query]);

  const inputStyle = {
    flex: "1 1 320px", padding: "12px 16px", borderRadius: 12, border: `1px solid ${t.border}`,
    background: t.panelAlt, color: t.text, fontSize: 13.5, outline: "none",
  };

  return (
    <div>
      <SectionLabel t={t} kicker="AI Heritage Guide" title={tr("AI Heritage Guide")} />
      <div className="font-body" style={{ fontSize: 13.5, color: t.textDim, marginBottom: 10, maxWidth: 640 }}>
        {tr("Ask in plain words — a budget, days and interests — and get a grounded, ready-to-follow itinerary. Just start typing: it searches every place it knows automatically as you go, no need to press a button.")}
      </div>
      <button
        onClick={() => document.getElementById("sec-plan")?.scrollIntoView({ behavior: "smooth", block: "start" })}
        className="font-utility"
        style={{
          display: "inline-flex", alignItems: "center", gap: 6, marginBottom: 18, padding: "6px 12px", borderRadius: 999,
          border: `1px solid ${t.border}`, background: "none", color: t.textDim, fontSize: 11.5, cursor: "pointer",
        }}
      >
        <ChevronLeft size={12} /> {tr("Prefer to pick manually? Use the trip planner above")}
      </button>

      <div style={{ padding: 18, borderRadius: 14, border: `1px solid ${t.border}`, background: t.panel, marginBottom: 20 }}>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") runGuide(); }}
            placeholder={tr('e.g. I have ₹10,000 and 3 days. I like temples and traditional food. Where should I go?')}
            className="font-body"
            style={inputStyle}
          />
          <button onClick={() => runGuide()} className="font-utility" style={{
            padding: "12px 22px", borderRadius: 12, border: "none", background: t.saffron, color: "#1a0f00",
            fontSize: 12.5, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", gap: 6,
          }}>
            <Sparkles size={14} /> {tr("ASK THE GUIDE")}
          </button>
        </div>
        {pendingSearch && (
          <div className="font-body" style={{ fontSize: 11.5, color: t.textDim, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
            <Search size={12} /> {tr("Searching as you type…")}
          </div>
        )}
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {PRESETS.map((p) => (
            <button key={p} onClick={() => { setQuery(p); runGuide(p); }} className="font-body" style={{
              padding: "6px 12px", borderRadius: 999, border: `1px solid ${t.border}`, background: t.panelAlt,
              color: t.textDim, fontSize: 11.5, cursor: "pointer",
            }}>
              {p}
            </button>
          ))}
        </div>
      </div>

      {error && (

/* ============================== EXPLORE SOLAN WITH GEMINI AI ==============================
   A self-contained, standalone section — curated top attractions in and
   around Solan (nature, temples, cafés) plus a small Gemini-powered planner
   that suggests a shortlist from this same curated list based on the
   person's budget and number of days. Uses the site's existing
   callGeminiForRoute() Gemini call as-is; if it's unavailable, a local
   heuristic picks from the curated list instead so the feature never breaks.
   Fully additive — does not touch STATES, ALL_ATTRACTIONS, favorites, or
   any other existing section/data.
=========================================================================== */
const SOLAN_CATEGORY_META = {
  Nature: { icon: Trees, color: "#5B8C5A" },
  Temple: { icon: Landmark, color: "#E2723A" },
  Cafe: { icon: Coffee, color: "#B5793A" },
  Heritage: { icon: Building2, color: "#9B7FC7" },
};

const SOLAN_ATTRACTIONS = [
  { id: "shoolini-mata-temple", name: "Shoolini Mata Temple", category: "Temple", cost: "free", desc: "The hilltop temple of the goddess Shoolini, after whom Solan is named — right in the heart of town.", wiki: "Shoolini Mata Temple" },
  { id: "jatoli-shiv-mandir", name: "Jatoli Shiv Mandir", category: "Temple", cost: "free", desc: "One of the tallest Shiva temples in Asia, a short day trip from Solan with striking hilltop architecture.", wiki: "Jatoli Shiv Mandir" },
  { id: "karol-tibba", name: "Karol Tibba", category: "Nature", cost: "free", desc: "A pine-forested hill just above Solan's Mall Road, popular for an easy short hike and valley views.", wiki: "Karol Tibba" },
  { id: "kasauli", name: "Kasauli", category: "Nature", cost: "moderate", desc: "A quiet colonial-era hill town about an hour away, known for pine-lined walks, old churches and viewpoints.", wiki: "Kasauli" },
  { id: "mohan-shakti-heritage-park", name: "Mohan Shakti Heritage Park", category: "Heritage", cost: "paid", desc: "A large landscaped park with mythology-themed art, gardens and walking trails, popular with families.", wiki: "Mohan Shakti Heritage Park" },
  { id: "barog", name: "Barog", category: "Nature", cost: "free", desc: "A scenic halt on the historic Kalka–Shimla toy-train line, known for its long tunnel and pine forest walks.", wiki: "Barog railway station" },
  { id: "kasauli-brewery", name: "Kasauli Brewery", category: "Heritage", cost: "free", desc: "One of Asia's oldest breweries, now a heritage landmark worth a stop on the way up to Kasauli.", wiki: "Kasauli Brewery" },
  { id: "mall-road-cafes", name: "Mall Road Cafés", category: "Cafe", cost: "budget", desc: "A cluster of small cafés and snack stops along Solan's Mall Road — the easiest low-cost evening outing.", wiki: "Solan" },
];
