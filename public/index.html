<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Incredible India — Culture &amp; Heritage Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  a { color: inherit; }
  button { font: inherit; }
  input { font: inherit; }

/* ===== SIH POLISHED ROUTE PLANNER ===== */
.route-shell{position:relative}

/* ===== WEATHER GLASSMORPHISM CARD ===== */
@keyframes weatherOrbFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(16px,-18px) scale(1.08)}}
@keyframes weatherFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes weatherPulseDot{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

.weather-glass{
  position:relative;overflow:hidden;isolation:isolate;
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 10px 34px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.10);
}
.weather-glass-orb{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none;z-index:0}
.weather-glass-orb.a{width:190px;height:190px;top:-70px;right:-50px;background:radial-gradient(circle,rgba(66,133,244,.4),transparent 70%);animation:weatherOrbFloat 9s ease-in-out infinite}
.weather-glass-orb.b{width:160px;height:160px;bottom:-60px;left:-46px;background:radial-gradient(circle,rgba(255,175,70,.32),transparent 70%);animation:weatherOrbFloat 12s ease-in-out infinite reverse}
.weather-glass-content{position:relative;z-index:1}
.weather-live-dot{width:6px;height:6px;border-radius:50%;background:#5CE187;flex-shrink:0;animation:weatherPulseDot 1.8s ease-in-out infinite}
.weather-forecast-chip{
  backdrop-filter:blur(8px) saturate(140%);-webkit-backdrop-filter:blur(8px) saturate(140%);
  transition:transform .15s ease;
}
.weather-forecast-chip:hover{transform:translateY(-2px)}
.weather-advice-btn{
  position:relative;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#4285F4,#9C6ADE);color:#fff;font:600 12px "Rajdhani",sans-serif;letter-spacing:.03em;
  transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;
}
.weather-advice-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 20px rgba(66,90,244,.35)}
.weather-advice-btn:disabled{opacity:.55;cursor:default}
.weather-advice-panel{animation:geminiResponseFadeIn .3s cubic-bezier(.16,1,.3,1) both}
/* Generic alias of the same smooth fade-in, for other Gemini-generated
   response panels elsewhere on the page (loading-animation polish only). */
.gemini-response-fadein{animation:geminiResponseFadeIn .3s cubic-bezier(.16,1,.3,1) both}

/* ===== GEMINI AI HOMEPAGE HERO THEME (blue + purple glow) ===== */
@keyframes geminiFloatA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,-30px) scale(1.1)}}
@keyframes geminiFloatB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-22px,26px) scale(1.08)}}
@keyframes geminiShimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes geminiPulseDot{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
@keyframes geminiFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.gemini-hero-shell{position:relative;overflow:hidden;isolation:isolate}
.gemini-glow-orb{position:absolute;border-radius:50%;filter:blur(75px);pointer-events:none;z-index:0}
.gemini-glow-orb.blue{background:radial-gradient(circle,rgba(66,133,244,.38),transparent 70%);width:420px;height:420px;top:-140px;left:-80px;animation:geminiFloatA 11s ease-in-out infinite}
.gemini-glow-orb.purple{background:radial-gradient(circle,rgba(156,106,222,.34),transparent 70%);width:380px;height:380px;top:-80px;right:-100px;animation:geminiFloatB 13s ease-in-out infinite}
.gemini-glow-orb.pink{background:radial-gradient(circle,rgba(217,101,112,.22),transparent 70%);width:320px;height:320px;bottom:-140px;left:38%;animation:geminiFloatA 15s ease-in-out infinite}

.gemini-hero-inner{position:relative;z-index:1}

.gemini-badge-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}

.gemini-badge{
  position:relative;display:inline-flex;align-items:center;gap:7px;padding:7px 14px 7px 11px;border-radius:999px;
  background:linear-gradient(90deg, rgba(66,133,244,.14), rgba(156,106,222,.14));
  font:600 11px "Rajdhani",sans-serif;letter-spacing:.05em;color:#cdd9ff;
  animation:geminiFadeUp .3s ease-out;
}
.gemini-badge::before{
  content:"";position:absolute;inset:0;border-radius:999px;padding:1px;pointer-events:none;
  background:linear-gradient(90deg,#4285F4,#9C6ADE,#D96570,#4285F4);
  background-size:300% 100%;animation:geminiShimmer 4s linear infinite;
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.gemini-badge-dot{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#4285F4,#9C6ADE);animation:geminiPulseDot 1.8s ease-in-out infinite;flex-shrink:0}

.gemini-hero-title-accent{
  background:linear-gradient(90deg,#4285F4,#9C6ADE,#D96570,#4285F4);
  background-size:300% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:geminiShimmer 6s linear infinite;
}

.gemini-search-wrap{position:relative;border-radius:999px}
.gemini-search-wrap::before{
  content:"";position:absolute;inset:-2px;border-radius:999px;z-index:-1;
  background:linear-gradient(90deg,#4285F4,#9C6ADE,#D96570,#4285F4);
  background-size:300% 100%;opacity:.28;filter:blur(5px);
  animation:geminiShimmer 5s linear infinite;transition:opacity .25s ease;
}
.gemini-search-wrap.focused::before{opacity:.85;filter:blur(9px)}

/* ===== GEMINI FLOATING CHATBOT ===== */
@keyframes geminiChatPop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes geminiFabPulse{0%{box-shadow:0 0 0 0 rgba(66,133,244,.45)}70%{box-shadow:0 0 0 14px rgba(66,133,244,0)}100%{box-shadow:0 0 0 0 rgba(66,133,244,0)}}
/* Gemini "thinking" dots — smoother bounce with a touch of scale + glow so the
   wait feels alive rather than a flat blink. */
@keyframes geminiTypingDot{
  0%,60%,100%{transform:translateY(0) scale(.78);opacity:.35}
  30%{transform:translateY(-6px) scale(1.05);opacity:1}
}
/* Smooth, slightly more premium fade-in for AI-generated responses — gentle
   upward drift + soft blur-to-focus resolve instead of a flat opacity snap. */
@keyframes geminiResponseFadeIn{
  from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(3px)}
  60%{filter:blur(0)}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
@keyframes geminiMsgIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

.gemini-fab{
  position:fixed;right:22px;bottom:22px;z-index:200;width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,#4285F4,#9C6ADE);display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(66,90,244,.4);animation:geminiFabPulse 2.6s ease-out infinite;transition:transform .18s ease;
}
.gemini-fab:hover{transform:scale(1.07)}
.gemini-fab:active{transform:scale(.96)}

.gemini-chat-window{
  position:fixed;right:22px;bottom:96px;z-index:200;width:380px;max-width:calc(100vw - 32px);height:min(600px, calc(100vh - 140px));
  border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,.35);animation:geminiChatPop .16s ease-out;
}
.gemini-chat-header{
  padding:16px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;
  background:linear-gradient(120deg,#4285F4,#9C6ADE);color:#fff;position:relative;overflow:hidden;
}
.gemini-chat-avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gemini-chat-status-dot{width:7px;height:7px;border-radius:50%;background:#5CE187;flex-shrink:0;animation:geminiPulseDot 1.8s ease-in-out infinite}
.gemini-chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.gemini-msg-row{display:flex;gap:8px;max-width:88%;animation:geminiMsgIn .2s cubic-bezier(.16,1,.3,1) both}
.gemini-msg-row.user{align-self:flex-end;flex-direction:row-reverse}
.gemini-msg-row.ai{align-self:flex-start}
.gemini-msg-avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px}
.gemini-bubble{padding:10px 14px;border-radius:16px;font:400 13.5px/1.55 "Inter",sans-serif;word-wrap:break-word;white-space:pre-wrap}
.gemini-bubble.user{background:linear-gradient(135deg,#4285F4,#9C6ADE);color:#fff;border-bottom-right-radius:5px}
.gemini-bubble.ai{border-bottom-left-radius:5px}
.gemini-typing-dots{display:inline-flex;gap:4px;padding:12px 14px;border-radius:16px;border-bottom-left-radius:5px}
.gemini-typing-dots span{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;animation:geminiTypingDot 1.1s infinite cubic-bezier(.45,0,.55,1)}
.gemini-typing-dots span:nth-child(2){animation-delay:.15s}
.gemini-typing-dots span:nth-child(3){animation-delay:.3s}
/* Compact inline variant of the same thinking dots, for use next to
   "Thinking…"-style loading text inside buttons/labels elsewhere on the page. */
.gemini-thinking-inline{display:inline-flex;gap:3px;vertical-align:middle}
.gemini-thinking-inline span{width:4px;height:4px;border-radius:50%;background:currentColor;display:inline-block;animation:geminiTypingDot 1.1s infinite cubic-bezier(.45,0,.55,1)}
.gemini-thinking-inline span:nth-child(2){animation-delay:.15s}
.gemini-thinking-inline span:nth-child(3){animation-delay:.3s}
.gemini-chat-inputbar{flex-shrink:0;padding:12px;display:flex;gap:8px;align-items:center;border-top:1px solid rgba(128,128,128,.18)}
.gemini-chat-input{flex:1;border:none;outline:none;background:transparent;font:400 13.5px "Inter",sans-serif;padding:8px 4px}
.gemini-chat-send{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4285F4,#9C6ADE);transition:transform .15s ease,opacity .15s ease}
.gemini-chat-send:disabled{opacity:.4;cursor:default}
.gemini-chat-send:not(:disabled):hover{transform:scale(1.08)}
.gemini-chat-suggest{border:1px solid rgba(128,128,128,.28);background:transparent;border-radius:999px;padding:6px 11px;font:600 11px "Rajdhani",sans-serif;cursor:pointer;white-space:nowrap;transition:background .15s ease}

/* ===== HERITAGE-AT-RISK MAP MARKER ===== */
@keyframes heritageRiskPulse{0%{box-shadow:0 0 0 0 var(--risk-color,rgba(226,74,74,.55))}70%{box-shadow:0 0 0 14px rgba(226,74,74,0)}100%{box-shadow:0 0 0 0 rgba(226,74,74,0)}}
.heritage-risk-marker-ring{animation:heritageRiskPulse 2.2s ease-out infinite}

/* ===== VOICE INPUT (MIC) ===== */
@keyframes geminiMicPulse{0%{box-shadow:0 0 0 0 rgba(226,74,74,.45)}70%{box-shadow:0 0 0 11px rgba(226,74,74,0)}100%{box-shadow:0 0 0 0 rgba(226,74,74,0)}}
@keyframes geminiMicBar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.gemini-chat-mic{
  width:38px;height:38px;min-width:38px;border-radius:50%;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:transparent;
  border:1px solid rgba(128,128,128,.3);transition:transform .15s ease,background .15s ease,border-color .15s ease,opacity .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.gemini-chat-mic:disabled{opacity:.35;cursor:default}
.gemini-chat-mic:not(:disabled):hover{transform:scale(1.08)}
.gemini-chat-mic:not(:disabled):active{transform:scale(.94)}
.gemini-chat-mic.listening{
  background:linear-gradient(135deg,#E24A4A,#ff7a59);border-color:transparent;
  animation:geminiMicPulse 1.5s ease-in-out infinite;
}
.gemini-chat-listening-row{display:flex;align-items:center;gap:8px;padding:0 12px 8px;flex-shrink:0}
.gemini-chat-listening-bars{display:inline-flex;align-items:center;gap:2px;height:14px}
.gemini-chat-listening-bars span{width:3px;height:100%;border-radius:2px;background:#E24A4A;display:inline-block;animation:geminiMicBar .9s ease-in-out infinite}
.gemini-chat-listening-bars span:nth-child(2){animation-delay:.15s}
.gemini-chat-listening-bars span:nth-child(3){animation-delay:.3s}
.gemini-chat-listening-bars span:nth-child(4){animation-delay:.45s}

@media (max-width:520px){
  .gemini-chat-window{
    right:0;left:0;bottom:0;top:0;width:100%;max-width:100%;height:100%;border-radius:0;
  }
  .gemini-fab{right:16px;bottom:16px;width:56px;height:56px}
  .gemini-chat-mic,.gemini-chat-send{width:42px;height:42px;min-width:42px}
}

/* ===================================================================
   HACK DAYS POLISH — global buttons, cards, mobile, animation speed.
   Purely additive: no existing class/behavior removed or renamed, and
   nothing here calls a different API — this only layers on top via
   plain-tag/global selectors so every current feature keeps working.
=================================================================== */

/* ---- Buttons: consistent, snappy press/hover/focus feedback on every
   real <button> in the app, without touching each call site. ---- */
button{-webkit-tap-highlight-color:transparent}
button:not(:disabled){
  transition:transform .12s cubic-bezier(.2,.8,.2,1),
             box-shadow .12s ease, filter .12s ease, opacity .12s ease,
             background-color .12s ease, border-color .12s ease;
}
button:not(:disabled):active{transform:scale(.95)}
@media (hover:hover) and (pointer:fine){
  button:not(:disabled):hover{filter:brightness(1.08)}
}
button:focus-visible{outline:2px solid #4285F4;outline-offset:2px;border-radius:10px}
.reduce-motion button:not(:disabled){transition:none}
.reduce-motion button:not(:disabled):active{transform:none}

/* ---- Cards: the shared .tilt-card hover/active timing lives in the
   Fonts() component below (single source of truth) — sped up there.
   A few more repeated "card" surfaces across the site get the same
   fast hover-lift language where they previously had none. ---- */
.route-side-card,.route-main-card,.weather-glass{transition:transform .18s ease, box-shadow .18s ease}
@media (hover:hover) and (pointer:fine){
  .route-side-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.2)}
}

/* ---- Mobile UI: tighter, better-proportioned spacing on small screens.
   Targets the real <header>/<main>/<footer> tags directly so no JSX
   className changes are needed anywhere. ---- */
@media (max-width:480px){
  header > div{padding:12px 14px !important}
  main{padding:0 14px 44px !important}
  footer{padding:28px 14px !important}
}
@media (max-width:380px){
  header > div > div:last-child{flex-wrap:wrap;justify-content:flex-end;row-gap:6px;gap:6px !important}
}
/* Comfortable minimum tap target for icon-only circular buttons that sit
   on their own row (header/footer/chat controls) — thumbnail-overlaid
   mini buttons (favorite hearts on cards, marker pins, etc.) are left at
   their original size so they don't outgrow the space they're drawn in. */
@media (max-width:480px){
  header button, .gemini-chat-mic, .gemini-chat-send{min-width:38px;min-height:38px}
}


/* ===== FAVORITES PANEL ===== */
@keyframes favPanelSlide{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
.fav-panel-slide{animation:favPanelSlide .16s ease-out}
.fav-row{transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
.fav-row:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.fav-row:active{transform:translateY(0) scale(0.99)}
.route-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.route-badges{display:flex;gap:8px;flex-wrap:wrap}
.route-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(18,31,50,.72);font:600 10px Rajdhani,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.route-badge.ai{color:#68e0b1;border-color:rgba(72,214,160,.3)}
.route-badge.live{color:#7fc5ff;border-color:rgba(85,164,255,.3)}
.route-badge.best{color:#d3a8ff;border-color:rgba(170,110,255,.3)}
.route-input-box{background:rgba(17,29,47,.92);border:1px solid rgba(102,137,178,.25);border-radius:16px;padding:18px;margin-bottom:20px;box-shadow:0 14px 40px rgba(0,0,0,.16)}
.route-input-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.route-input-row input{min-height:48px!important;border-radius:11px!important;background:#172438!important;border-color:#2b3f59!important;color:#ffffff!important}
.route-input-row input::placeholder{color:#8ea1b8!important;opacity:1}
.route-plan-btn{min-height:48px!important;border-radius:11px!important;padding:0 25px!important;background:linear-gradient(135deg,#087cff,#1256df)!important;box-shadow:0 8px 24px rgba(0,102,255,.22)!important}
.route-examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.route-example{border:1px solid rgba(115,150,190,.25);background:rgba(30,45,65,.65);color:#aebed0;border-radius:999px;padding:6px 10px;font:600 10px Rajdhani,sans-serif;cursor:pointer}
.route-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.route-stop-wrap{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;position:relative}
.route-stop-wrap:not(:last-child):after{content:"";position:absolute;left:20px;top:40px;bottom:-15px;border-left:1px solid rgba(67,137,255,.5)}
.route-number{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #2388ff;background:#10284b;color:#fff;font:700 13px Rajdhani,sans-serif;position:relative;z-index:2}
.route-main-card{background:linear-gradient(180deg,rgba(24,39,60,.96),rgba(18,31,49,.96));border:1px solid rgba(93,126,165,.25);border-radius:16px;padding:18px;box-shadow:0 12px 32px rgba(0,0,0,.14)}
.route-main-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.route-main-title h3{margin:0;font:600 22px Marcellus,serif}
.route-stop-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:#aab9ca;font:500 11px Rajdhani,sans-serif}
.route-stop-meta span{display:inline-flex;gap:5px;align-items:center}
.route-transfer{margin:9px 0 13px;padding:11px 13px;border:1px solid rgba(55,211,157,.35);background:rgba(20,54,52,.22);border-radius:11px}
.route-transfer-head{display:flex;justify-content:space-between;gap:10px;color:#59d9ad;font:700 10px Rajdhani,sans-serif;text-transform:uppercase;letter-spacing:.07em}
.route-side{display:flex;flex-direction:column;gap:12px}
.route-side-card{background:rgba(18,31,49,.94);border:1px solid rgba(93,126,165,.25);border-radius:14px;padding:15px}
.route-side-card h4{margin:0 0 12px;font:600 16px Marcellus,serif}
.route-stat{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(100,130,165,.16);font:500 12px Rajdhani,sans-serif;color:#aebdce}
.route-stat:first-of-type{border-top:0;padding-top:0}
.route-stat b{color:#fff}
.route-option{display:grid;grid-template-columns:72px 1fr auto 80px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid rgba(100,130,165,.16);font:500 11px Rajdhani,sans-serif}
.route-option:first-of-type{border-top:0}
.route-option b{color:#fff}
.route-option span{color:#aebdce}
.route-ok{color:#58d9ad!important;cursor:pointer}
.route-ok:hover{text-decoration:underline!important}
.route-rate{color:#7fc5ff!important;font:700 11px Rajdhani,sans-serif;text-align:right;white-space:nowrap}
.route-stop-image{width:100%;height:150px;border-radius:11px;overflow:hidden;position:relative;margin-bottom:13px;background:#0e1c30}
.route-stop-image img{width:100%;height:100%;object-fit:cover;display:block}
.route-stop-image-tag{position:absolute;bottom:8px;left:8px;padding:4px 9px;border-radius:8px;background:rgba(10,18,30,.62);backdrop-filter:blur(2px);font:600 9.5px Rajdhani,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#e8eef6}

let _amadeusTokenCache = { token: null, expiresAt: 0 };
async function getAmadeusToken(apiKey, apiSecret) {
  const now = Date.now();
  if (_amadeusTokenCache.token && _amadeusTokenCache.expiresAt > now + 5000) return _amadeusTokenCache.token;
  let res;
  try {
    res = await fetch("https://test.api.amadeus.com/v1/security/oauth2/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: `grant_type=client_credentials&client_id=${encodeURIComponent(apiKey)}&client_secret=${encodeURIComponent(apiSecret)}`,
    });
  } catch (e) {
    // Almost always CORS or a blocked/offline network — most common cause when the
    // page is opened as a local file:// URL instead of served over http(s).
    throw new Error("network_or_cors: " + e.message);
  }
  if (!res.ok) {
    const body = await res.text().catch(() => "");
    throw new Error(`auth_failed_${res.status}: ${body.slice(0, 200)}`);
  }
  const data = await res.json();
  _amadeusTokenCache = { token: data.access_token, expiresAt: now + (data.expires_in || 1700) * 1000 };
  return data.access_token;
}

// Simple fuzzy match: does the offer hotel name share a meaningful word with our listed hotel name?
function namesLooselyMatch(a, b) {
  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9 ]/g, "").split(" ").filter((w) => w.length > 3);
  const wa = norm(a), wb = norm(b);
  return wa.some((w) => wb.includes(w));
}

  const token = await getAmadeusToken(apiKey, apiSecret); // throws with a specific reason on failure

  const authHeader = { Authorization: `Bearer ${token}` };
  const listRes = await fetch(`https://test.api.amadeus.com/v1/reference-data/locations/hotels/by-city?cityCode=${cityCode}`, { headers: authHeader });
  if (!listRes.ok) {
    const body = await listRes.text().catch(() => "");
    return { status: "unavailable", reason: `hotel_list_${listRes.status}: ${body.slice(0, 200)}` };
  }
  const listData = await listRes.json();
  const hotels = listData.data || [];
  if (!hotels.length) return { status: "unavailable", reason: `no_hotels_in_test_data_for_${cityCode}` };
  const match = hotels.find((h) => namesLooselyMatch(h.name || "", hotelName)) || hotels[0];

  const offersRes = await fetch(`https://test.api.amadeus.com/v3/shopping/hotel-offers?hotelIds=${match.hotelId}&currency=INR&adults=2`, { headers: authHeader });
  if (!offersRes.ok) {
    const body = await offersRes.text().catch(() => "");
    return { status: "unavailable", reason: `offers_${offersRes.status}: ${body.slice(0, 200)}` };
  }
  const offersData = await offersRes.json();
  const offer = offersData.data && offersData.data[0] && offersData.data[0].offers && offersData.data[0].offers[0];
  if (!offer) return { status: "unavailable", reason: `no_offer_returned_for_${match.name || match.hotelId}` };
  return { status: "live", price: Math.round(parseFloat(offer.price.total)), currency: offer.price.currency, matchedName: match.name };
}

function useLiveHotelRate(hotelName, city) {
  const { creds, liveEnabled } = useHotelRates();
  const [state, setState] = React.useState({ status: "idle" });
  React.useEffect(() => {
    let cancelled = false;
    if (!liveEnabled || !creds || !creds.apiKey || !creds.apiSecret) { setState({ status: "idle" }); return; }
    setState({ status: "loading" });
    fetchLiveHotelRate({ hotelName, city, apiKey: creds.apiKey, apiSecret: creds.apiSecret })
      .then((r) => { if (!cancelled) { setState(r); if (r.status !== "live") console.warn(`[live rates] ${hotelName}:`, r.reason); } })
      .catch((e) => { if (!cancelled) { setState({ status: "unavailable", reason: e.message }); console.error(`[live rates] ${hotelName}:`, e.message); } });
    return () => { cancelled = true; };
  }, [hotelName, city, liveEnabled, creds && creds.apiKey, creds && creds.apiSecret]);
  return state;
}

function LiveRatesSettings({ t }) {
  const { creds, setCreds, liveEnabled, setLiveEnabled } = useHotelRates();
  const [open, setOpen] = useState(false);
  const [key, setKey] = useState((creds && creds.apiKey) || "");
  const [secret, setSecret] = useState((creds && creds.apiSecret) || "");
  const [testStatus, setTestStatus] = useState(null); // { ok: bool, message: string }
  const [testing, setTesting] = useState(false);

  const runTest = async () => {
    setTesting(true);
    setTestStatus(null);
    try {
      _amadeusTokenCache = { token: null, expiresAt: 0 }; // force a fresh call, not a cached token
      await getAmadeusToken(key, secret);
      setTestStatus({ ok: true, message: "Connected — Amadeus accepted the key/secret." });
    } catch (e) {
      let hint = e.message;
      if (hint.startsWith("network_or_cors")) {
        hint = "Request was blocked before it reached Amadeus — almost always CORS. This happens when the page is opened directly as a file:// URL. Serve it over http(s) instead (e.g. `python3 -m http.server` in the folder, then open http://localhost:8000/...).";
      } else if (hint.startsWith("auth_failed_401") || hint.startsWith("auth_failed_400")) {
        hint = "Amadeus rejected the key/secret (401/400). Double-check you copied the TEST environment key and secret correctly, with no extra spaces.";
      }
      setTestStatus({ ok: false, message: hint });
    }
    setTesting(false);
  };

  return (
    <div style={{ marginBottom: 12 }}>
      <button onClick={() => setOpen((v) => !v)} className="font-utility"
        style={{ fontSize: 10.5, padding: "5px 10px", borderRadius: 20, border: `1px solid ${t.border}`, background: liveEnabled ? `${t.saffron}1f` : "none", color: t.textDim, cursor: "pointer" }}>
        {liveEnabled ? "● Live rates on" : "Connect live rates (Amadeus)"}
      </button>
      {open && (
        <div className="font-body" style={{ marginTop: 8, padding: 12, borderRadius: 10, border: `1px solid ${t.border}`, background: t.panel, fontSize: 11.5, color: t.textDim, maxWidth: 380 }}>
          <div style={{ marginBottom: 8 }}>
            Paste a free Amadeus for Developers <b>Test</b> API key + secret (from{" "}
            <a href="https://developers.amadeus.com" target="_blank" rel="noopener noreferrer" style={{ color: t.saffron }}>developers.amadeus.com</a>
            ) to try live rate lookups for hotels in larger cities. Keys stay in this browser tab only.
          </div>
          <input placeholder="API Key" value={key} onChange={(e) => setKey(e.target.value)}
            style={{ width: "100%", padding: "6px 8px", marginBottom: 6, borderRadius: 6, border: `1px solid ${t.border}`, background: "transparent", color: t.text, fontSize: 11.5 }} />
          <input placeholder="API Secret" value={secret} onChange={(e) => setSecret(e.target.value)} type="password"
            style={{ width: "100%", padding: "6px 8px", marginBottom: 8, borderRadius: 6, border: `1px solid ${t.border}`, background: "transparent", color: t.text, fontSize: 11.5 }} />
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button disabled={!key || !secret || testing} onClick={runTest}
              style={{ padding: "6px 12px", borderRadius: 6, border: `1px solid ${t.border}`, background: "none", color: t.text, fontSize: 11.5, cursor: (!key || !secret) ? "not-allowed" : "pointer", opacity: (!key || !secret) ? 0.5 : 1 }}>
              {testing ? "Testing…" : "Test connection"}
            </button>
            <button onClick={() => { setCreds({ apiKey: key, apiSecret: secret }); setLiveEnabled(true); setOpen(false); }}
              style={{ padding: "6px 12px", borderRadius: 6, border: "none", background: t.saffron, color: "#fff", fontSize: 11.5, cursor: "pointer" }}>Save & enable</button>
            {liveEnabled && (
              <button onClick={() => { setLiveEnabled(false); setOpen(false); }}
                style={{ padding: "6px 12px", borderRadius: 6, border: `1px solid ${t.border}`, background: "none", color: t.textDim, fontSize: 11.5, cursor: "pointer" }}>Turn off</button>
            )}
          </div>
          {testStatus && (
            <div style={{ marginTop: 8, padding: 8, borderRadius: 6, fontSize: 11, lineHeight: 1.5, background: testStatus.ok ? `${t.gold}1f` : "#ff4d4f1f", color: testStatus.ok ? t.gold : "#ff6b6b" }}>
              {testStatus.message}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ============================== IMAGE HELPERS ==============================
   Real photographs, sourced live from Wikipedia's own media for each place
   (its actual Wikipedia article images) so every state, territory and
   attraction shows the genuine landmark — not a generic stock photo. A
   loremflickr-based fallback fills in only if a Wikipedia article/image
   can't be found. Results are cached in-memory so repeated cards for the
   same place don't refetch.
=========================================================================== */
function photoUrl(name, city, seed, w = 800, h = 600) {
  const tags = `${name},${city},india`
    .replace(/[^a-zA-Z0-9\s,]/g, " ")
    .split(/[\s,]+/)
    .filter(Boolean)
    .slice(0, 4)
    .join(",");
  return `https://loremflickr.com/${w}/${h}/${encodeURIComponent(tags)}?lock=${seed}`;
}

// Last-resort image: a self-contained SVG data URI (no network call at all),
// so a place always shows *something* — a soft gradient card with its name —
// even if both the Wikipedia lookup and the loremflickr fallback fail to load.
const PLACEHOLDER_PALETTES = [
  ["#7c2d12", "#c2410c"], ["#713f12", "#a16207"], ["#134e4a", "#0d9488"],
  ["#1e3a5f", "#2563eb"], ["#4c1d95", "#7c3aed"], ["#701a75", "#a21caf"],
  ["#7f1d1d", "#b91c1c"], ["#14532d", "#16a34a"],
];
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}
function placeholderImg(label, w = 800, h = 600) {
  const [c1, c2] = PLACEHOLDER_PALETTES[hashStr(label || "india") % PLACEHOLDER_PALETTES.length];
  const safe = (label || "India").replace(/[<>&]/g, "");
  const words = safe.split(/\s+/).slice(0, 4).join(" ");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
    </linearGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#g)"/>
    <circle cx="${w * 0.82}" cy="${h * 0.22}" r="${Math.min(w, h) * 0.28}" fill="#ffffff14"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="#ffffffE0" font-family="Georgia, serif" font-size="${Math.max(18, w / 22)}">${words}</text>
  </svg>`;
  return `data:image/svg+xml,${encodeURIComponent(svg)}`;
}
// Attach to any <img> as onError to guarantee a graceful fallback, e.g.:
//   <img src={img} onError={imgFallback(name)} ... />
function imgFallback(label) {
  return (e) => {
    e.currentTarget.onerror = null;
    e.currentTarget.src = placeholderImg(label);
  };
}
function galleryFor(nameOrObj, city, count = 5) {
  const name = typeof nameOrObj === "string" ? nameOrObj : nameOrObj.name;
  // No more loremflickr fallback — it matched by loose tags and frequently
  // returned completely unrelated stock photos for niche places (e.g. a
  // street-cat statue for a limestone cave). A clean on-brand placeholder
  // is a better fallback than a wrong photo while the real Wikipedia photo
  // loads (or if no real photo exists at all).
  return Array.from({ length: count }, () => placeholderImg(name));
}

function wikiTitle(name) {
  // Strip long descriptive parentheticals (e.g. "Ross Island (Netaji Subhas
  // Chandra Bose Dweep)") — these are almost never the real article title,
  // and stripping them gives resolveWikiTitle() a cleaner search query.
  return name.replace(/\s*\([^)]*\)\s*$/, "").replace(/\s*&\s*/g, " and ").trim();
}

const _wikiThumbCache = {};
const _wikiGalleryCache = {};
const _wikiSearchCache = {};

// Wikipedia's summary/media-list endpoints need an EXACT article title —
// this is what was silently breaking photos across the site: names like
// "French Quarter" (which really means Puducherry's, but exact-matches New
// Orleans' article) or hand-typed titles that were just slightly off (e.g.
// "Baidyanath Temple, Deoghar" instead of "Baidyanath Temple") all returned
// a plain 404, not a CORS error. Resolving through Wikipedia's fuzzy search
// API first — with the city as extra context — finds the real article far
// more reliably than assuming our name is already the exact title.
async function _searchWikiPage(q) {
  const res = await fetch(`https://en.wikipedia.org/w/rest.php/v1/search/page?q=${encodeURIComponent(q)}&limit=1`);
  if (!res.ok) throw new Error(`search failed (HTTP ${res.status})`);
  const data = await res.json();
  return data?.pages?.[0]?.key || null;
}

async function resolveWikiTitle(query, context) {
  const q = context ? `${query} ${context}` : query;
  const key = q.toLowerCase().trim();
  if (_wikiSearchCache[key] !== undefined) return _wikiSearchCache[key];
  let resolved = null;
  try {
    resolved = await _searchWikiPage(q);
  } catch (e) {
    resolved = null;
  }
  // Adding the city/context sometimes steers the fuzzy search away from a
  // well-known monument's actual article (e.g. context text that doesn't
  // appear near the real page at all) — if the qualified search came up
  // empty, retry with just the bare place name before giving up.
  if (!resolved && context) {
    const bareKey = query.toLowerCase().trim();
    if (_wikiSearchCache[bareKey] !== undefined) {
      resolved = _wikiSearchCache[bareKey];
    } else {
      try {
        resolved = await _searchWikiPage(query);
        _wikiSearchCache[bareKey] = resolved;
      } catch (e) {
        _wikiSearchCache[bareKey] = null;
      }
    }
  }
  _wikiSearchCache[key] = resolved;
  return resolved;
}

// FALLBACK PATH — the REST summary/media-list endpoints need a near-exact
// article title and 404 (rather than gracefully degrading) on disambiguation
// pages, recently-renamed articles, or anything resolveWikiTitle() couldn't
// pin down. The legacy action API's generator=search + prop=pageimages is far
// more forgiving: it does fuzzy title matching AND the image lookup in one
// call, following redirects automatically, so it recovers a real photo in a
// lot of cases where the REST path above comes back empty. It's the reason
// most "blank"/placeholder cards should now show an actual photo.
async function fetchWikiThumbViaActionAPI(query) {
  try {
    const url = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=1&prop=pageimages|pageprops&piprop=thumbnail|original&pithumbsize=1200&format=json&origin=*`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`action api failed (HTTP ${res.status})`);
    const data = await res.json();
    const pages = (data && data.query && data.query.pages) || {};
    const page = Object.values(pages)[0];
    if (!page) return null;
    // pageprops.disambiguation is set on disambiguation pages — skip those,
    // same as the REST path does.
    if (page.pageprops && "disambiguation" in page.pageprops) return null;
    const src = (page.original && page.original.source) || (page.thumbnail && page.thumbnail.source) || null;
    return src;
  } catch (e) {
    return null;
  }
}

async function fetchWikiThumb(title, context) {
  const cacheKey = `${title}::${context || ""}`;
  if (_wikiThumbCache[cacheKey] !== undefined) return _wikiThumbCache[cacheKey];
  let src = null;
  try {
    const resolved = (await resolveWikiTitle(title, context)) || title;
    const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(resolved)}`);
    if (!res.ok) throw new Error(`no summary (HTTP ${res.status})`);
    const data = await res.json();
    if (data.type === "disambiguation") throw new Error("disambiguation page, not a real article");
    src = data?.originalimage?.source || data?.thumbnail?.source || null;
  } catch (e) {
    console.warn(`[photo] REST photo lookup for "${title}"${context ? ` (${context})` : ""} failed, trying fallback:`, e);
  }
  if (!src) {
    src = await fetchWikiThumbViaActionAPI(context ? `${title} ${context}` : title);
    if (!src) {
      console.warn(`[photo] All live photo lookups for "${title}"${context ? ` (${context})` : ""} failed — using placeholder.`);
    }
  }
  _wikiThumbCache[cacheKey] = src;
  return src;
}

// Secondary gallery source: pulls the image files actually embedded in the
// article (not just the lead photo) via the action API, then filters out the
// non-photographic furniture (icons, flags, locator maps, coats of arms,
// seals, logos) that page images generators otherwise pick up.
const _NON_PHOTO_FILE_RE = /(icon|logo|flag|symbol|seal|coat.?of.?arms|locator|map|emblem|signature|\.svg(\?|$))/i;
async function fetchWikiGalleryViaActionAPI(resolvedTitle, count) {
  try {
    const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(resolvedTitle)}&generator=images&gimlimit=40&prop=imageinfo&iiprop=url|mime&format=json&origin=*`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`action api images failed (HTTP ${res.status})`);
    const data = await res.json();
    const pages = (data && data.query && data.query.pages) || {};
    const urls = Object.values(pages)
      .map((p) => p.imageinfo && p.imageinfo[0] && p.imageinfo[0].url)
      .filter(Boolean)
      .filter((u) => /\.(jpe?g|png)(\?|$)/i.test(u))
      .filter((u) => !_NON_PHOTO_FILE_RE.test(u));
    return [...new Set(urls)].slice(0, count);
  } catch (e) {
    return [];
  }
}

async function fetchWikiGallery(title, count = 5, context) {
  const cacheKey = `${title}::${count}::${context || ""}`;
  if (_wikiGalleryCache[cacheKey] !== undefined) return _wikiGalleryCache[cacheKey];
  let unique = [];
  let resolved = title;
  try {
    resolved = (await resolveWikiTitle(title, context)) || title;
    const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/media-list/${encodeURIComponent(resolved)}`);
    if (!res.ok) throw new Error(`no media-list (HTTP ${res.status})`);
    const data = await res.json();
    const items = (data.items || []).filter((it) => it.type === "image" && Array.isArray(it.srcset) && it.srcset.length);
    const urls = items
      .map((it) => {
        const best = it.srcset[it.srcset.length - 1].src;
        return best.startsWith("http") ? best : `https:${best}`;
      })
      .filter((u) => !/\.svg(\?|$)/i.test(u));
    unique = [...new Set(urls)].slice(0, count);
  } catch (e) {
    console.warn(`[photo] REST gallery lookup for "${title}"${context ? ` (${context})` : ""} failed, trying fallback:`, e);
  }
  // Top up (or fully replace, if the REST call failed outright) via the more
  // forgiving action API so a place isn't left with zero real photos just
  // because the REST media-list endpoint 404'd.
  if (unique.length < count) {
    const extra = await fetchWikiGalleryViaActionAPI(resolved, count - unique.length);
    unique = [...new Set([...unique, ...extra])].slice(0, count);
  }
  // Last resort: a single confirmed thumbnail is still better than none.
  if (unique.length === 0) {
    const thumb = await fetchWikiThumb(title, context);
    if (thumb) unique = [thumb];
  }
  _wikiGalleryCache[cacheKey] = unique;
  return unique;
}

/* ============================== WIKI SUMMARY (for unlisted places) ==============================
   When someone searches a place that isn't in our curated STATES/attractions
   data, we still want to show it using the exact same detail-page layout as
   every curated place. This fetches a real summary (extract, image,
   coordinates) from Wikipedia's public REST API so we can build an
   attraction-shaped object on the fly.
=========================================================================== */
const _wikiSummaryCache = {};
async function fetchWikiSummary(title) {
  const key = title.toLowerCase().trim();
  if (_wikiSummaryCache[key] !== undefined) return _wikiSummaryCache[key];
  try {
    const resolved = (await resolveWikiTitle(wikiTitle(title), "India")) || wikiTitle(title);
    const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(resolved)}`);
    if (!res.ok) throw new Error("no summary");
    const data = await res.json();
    if (data.type === "disambiguation") throw new Error("disambiguation");
    const result = {
      title: data.title || title,
      description: data.description || "",
      extract: data.extract || "",
      thumbnail: (data.originalimage && data.originalimage.source) || (data.thumbnail && data.thumbnail.source) || null,
      coords: data.coordinates ? { lat: data.coordinates.lat, lng: data.coordinates.lon } : null,
      pageUrl: (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) || `https://en.wikipedia.org/wiki/${encodeURIComponent((data.title || title).replace(/ /g, "_"))}`,
    };
    _wikiSummaryCache[key] = result;
    return result;
  } catch (e) {
    _wikiSummaryCache[key] = null;
    return null;
  }
}

// Best-effort guess at a category (Fort / Temple / Museum / …) from free text,
// so unlisted places still get a sensible icon and accent colour.
function guessCategoryFromText(text) {
  const s = (text || "").toLowerCase();
  const rules = [
    ["Fort", /\bforts?\b/], ["Palace", /\bpalaces?\b/], ["Temple", /\btemples?\b|\bmandir\b/],
    ["Mosque", /\bmosques?\b|\bmasjid\b/], ["Church", /\bchurch(es)?\b|\bcathedral\b|\bbasilica\b/],
    ["Museum", /\bmuseums?\b/], ["Lake", /\blakes?\b/], ["Monument", /\bmonuments?\b|\bmausoleum\b|\btombs?\b|\bmemorial\b/],
  ];
  for (const [cat, re] of rules) if (re.test(s)) return cat;
  return "Landmark";
}

// Best-effort guess at which curated state a place belongs to (and its city),
// purely from the Wikipedia description/extract text.
function guessLocationFromText(description, extract) {
  const text = `${description || ""}. ${extract || ""}`;
  const stateMatch = STATES.find((s) => text.includes(s.name));
  const m = (description || "").match(/(?:in|at)\s+([A-Z][A-Za-z.'\-]+(?:\s[A-Z][A-Za-z.'\-]+){0,2})/);
  const city = (m && m[1]) || (stateMatch ? stateMatch.capital.split(/[\/(]/)[0].trim() : "India");
  return { state: stateMatch || null, city };
}

// Builds an attraction-shaped object (and a matching state object) from a
// Wikipedia summary, so unlisted search results can render through the exact
// same <AttractionDetail /> component used for every curated place.
function buildWebAttraction(query, summary) {
  const title = (summary && summary.title) || query;
  const description = (summary && summary.description) || "";
  const extract = (summary && summary.extract) || "";
  const text = `${description} ${extract}`;
  const category = guessCategoryFromText(text);
  const loc = guessLocationFromText(description, extract);
  const stateObj = loc.state || { id: "india", name: "India", capital: "New Delhi", region: "All" };
  const id = `web-${title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "")}`;
  const shortDesc = description || (extract ? extract.slice(0, 140) + (extract.length > 140 ? "…" : "") : "A place discovered via live web search.");
  const pageUrl = (summary && summary.pageUrl) || `https://en.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g, "_"))}`;
  return {
    state: stateObj,
    attraction: {
      id, coords: (summary && summary.coords) || null, name: title, city: loc.city, category, period: "Unknown",
      shortDesc,
      overview: extract || "No detailed overview is available yet for this place — it was found through a live web search rather than our curated collection.",
      history: ["A full historical timeline isn't curated for this place yet — see the Wikipedia article linked above for more detail."],
      architecture: extract || "Architectural details haven't been curated for this place yet.",
      facts: [
        "This page was generated live from a public web search and hasn't been reviewed by our editorial team.",
        extract ? "The overview text above is drawn from this place's public Wikipedia summary." : "Limited information is available for this place right now.",
      ],
      timeline: [{ year: "—", event: "A detailed timeline isn't available yet for this place." }],
      bestTime: { months: "Year-round", hours: "Varies", crowd: "Unknown", temp: "Varies" },
      weather: { temp: 25, feelsLike: 26, humidity: 55, wind: 10, visibility: 8, forecast: [
        { d: "Today", t: 25, rain: 10 }, { d: "Tomorrow", t: 25, rain: 10 }, { d: "Wed", t: 24, rain: 10 }, { d: "Thu", t: 26, rain: 10 }, { d: "Fri", t: 25, rain: 10 },
      ] },

/* ============================== LIVE WEATHER (Open-Meteo) ==============================
   Real current conditions + 5-day forecast, keyed off each attraction's lat/lng.
   Open-Meteo's public forecast endpoint needs no API key and is CORS-enabled,
   so it can be called directly from the browser.
=========================================================================== */
const _weatherCache = {};
const WMO_VISIBILITY = { 45: 3, 48: 2 }; // fog codes -> reduced visibility (km)

async function fetchLiveWeather(lat, lng) {
  const key = `${lat.toFixed(2)},${lng.toFixed(2)}`;
  if (_weatherCache[key] !== undefined) return _weatherCache[key];
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}` +
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code` +
      `&daily=temperature_2m_max,precipitation_probability_max,weather_code` +
      `&timezone=auto&forecast_days=5`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("weather fetch failed");
    const data = await res.json();
    const cur = data.current;
    const daily = data.daily;
    const forecast = daily.time.map((dateStr, i) => {
      const label = i === 0 ? "Today" : i === 1 ? "Tomorrow" : new Date(dateStr).toLocaleDateString("en-US", { weekday: "short" });
      return { d: label, t: Math.round(daily.temperature_2m_max[i]), rain: Math.round(daily.precipitation_probability_max[i] ?? 0) };
    });
    const result = {
      temp: Math.round(cur.temperature_2m),
      feelsLike: Math.round(cur.apparent_temperature),
      humidity: Math.round(cur.relative_humidity_2m),
      wind: Math.round(cur.wind_speed_10m),
      visibility: WMO_VISIBILITY[cur.weather_code] ?? 10,
      code: cur.weather_code,
      forecast,
    };
    _weatherCache[key] = result;
    return result;
  } catch (e) {
    _weatherCache[key] = null;
    return null;
  }
}

// Maps an Open-Meteo WMO weather_code to a display emoji + short label.
// Falls back to a plain sun glyph for bundled sample data, which has no code.
function weatherCodeMeta(code) {
  if (code === 0) return { emoji: "☀️", label: "Clear sky" };
  if (code === 1 || code === 2) return { emoji: "🌤️", label: "Mostly clear" };
  if (code === 3) return { emoji: "☁️", label: "Overcast" };
  if (code === 45 || code === 48) return { emoji: "🌫️", label: "Fog" };
  if ([51, 53, 55, 56, 57].includes(code)) return { emoji: "🌦️", label: "Drizzle" };
  if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return { emoji: "🌧️", label: "Rain" };
  if ([71, 73, 75, 77, 85, 86].includes(code)) return { emoji: "❄️", label: "Snow" };
  if ([95, 96, 99].includes(code)) return { emoji: "⛈️", label: "Thunderstorm" };
  return { emoji: "🌡️", label: "Weather" };
}

/* ============================== WEATHER TRAVEL ADVICE (Gemini) ==============================
   Sends the current live conditions to Gemini (reusing callGeminiForRoute — same
   endpoint/key/model as the route planner and chatbot) and asks for short,
   practical, weather-aware travel advice for the place being viewed.
=========================================================================== */
async function fetchWeatherTravelAdvice(placeLabel, w) {
  const sys = "You are a concise local travel assistant for tourists visiting places in India. " +
    "Given current weather conditions for a specific place, respond ONLY with strict JSON of the shape " +
    '{"advice": string, "tips": string[], "pack": string[]} and nothing else (no markdown, no code fences). ' +
    '"advice" is 2-3 short sentences of practical, specific guidance for sightseeing today given the weather. ' +
    '"tips" is exactly 3 short actionable tips (each under 8 words). ' +
    '"pack" is 2-4 short items to wear or carry (each under 4 words).';
  const forecastLine = (w.forecast || [])
    .map((f) => `${f.d}: ${f.t}°C, ${f.rain}% rain`)
    .join("; ");
  const user = `Place: ${placeLabel}\n` +
    `Current temperature: ${w.temp}°C (feels like ${w.feelsLike}°C)\n` +
    `Humidity: ${w.humidity}%\nWind: ${w.wind} km/h\nVisibility: ${w.visibility} km\n` +
    `Forecast: ${forecastLine}\n` +
    `Give a visitor practical, weather-aware advice for exploring this place today.`;
  return callGeminiForRoute(sys, user);
}

/* ============================== HERITAGE HISTORY EXPLAINER (Gemini) ==============================
   Reuses callGeminiForRoute (same endpoint/key/model as the route planner, the
   weather advice panel and the floating chatbot) to explain a heritage place's
   history in very simple English, with an on-demand Hindi translation.
=========================================================================== */
async function fetchGeminiHistoryExplainer(attraction, state) {
  const sys = "You are a friendly guide who explains Indian heritage history to first-time travellers in very simple, plain English — short sentences, everyday words, no jargon. " +
    'Respond ONLY with strict JSON of the shape {"explanation": string} and nothing else (no markdown, no code fences). ' +
    '"explanation" is a single easy-to-read paragraph of 4-6 short sentences, grounded in the facts given.';
  const knownFacts = [
    attraction.overview,
    ...(attraction.history || []),
    ...(attraction.timeline || []).map((tl) => `${tl.year}: ${tl.event}`),
  ].filter(Boolean).join("\n");
  const user = `Place: ${attraction.name}, ${attraction.city}, ${state.name}\n` +
    `Known facts:\n${knownFacts}\n\n` +
    `Explain the history of this place in very simple English for someone visiting for the first time.`;
  return callGeminiForRoute(sys, user);
}

async function translateHistoryToHindi(englishText) {
  const sys = "You translate short English travel explanations into simple, natural, conversational Hindi (Devanagari script), suitable for a general reader. " +
    'Respond ONLY with strict JSON of the shape {"translation": string} and nothing else — no markdown, no Roman transliteration, no extra text.';
  const user = `Translate the following into simple Hindi:\n\n${englishText}`;
  return callGeminiForRoute(sys, user);
}

// Live weather for an attraction, falling back to bundled sample data if the
// request fails (offline, rate-limited, etc.) so the UI never breaks.
function useLiveWeather(attraction) {
  const [w, setW] = useState(attraction.weather);
  const [failed, setFailed] = useState(false);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    let alive = true;
    setLoading(true);
    setFailed(false);
    setW(attraction.weather);
    const coords = attraction.coords;
    if (!coords) { setLoading(false); return; }
    fetchLiveWeather(coords.lat, coords.lng).then((live) => {
      if (!alive) return;
      if (live) setW(live);
      else setFailed(true);
      setLoading(false);
    });
    return () => { alive = false; };
    // eslint-disable-next-line
  }, [attraction.id]);
  return { weather: w, failed, loading };
}

/* ============================== LIVE SEARCH (Wikipedia) ==============================
   Supplements the built-in states/attractions search with real, live results
   from Wikipedia's public search API (no key required, CORS-enabled via origin=*),
   so queries outside the curated dataset still return something useful.
=========================================================================== */
const _wikiLiveSearchCache = {};
async function fetchWikiSearch(query) {
  const key = query.toLowerCase().trim();
  if (!key) return [];
  if (_wikiLiveSearchCache[key] !== undefined) return _wikiLiveSearchCache[key];
  try {
    const url = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query + " India")}&srlimit=5&format=json&origin=*`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("search fetch failed");
    const data = await res.json();
    const results = (data?.query?.search || []).map((r) => ({
      title: r.title,
      snippet: r.snippet.replace(/<\/?span[^>]*>/g, ""),
    }));
    _wikiLiveSearchCache[key] = results;
    return results;
  } catch (e) {
    _wikiLiveSearchCache[key] = [];
    return [];
  }
}

// Debounced live search-engine results for a query string.
function useLiveSearch(query) {
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  useEffect(() => {
    if (!query.trim()) { setResults([]); setLoading(false); return; }
    let alive = true;
    setLoading(true);
    const timer = setTimeout(() => {
      fetchWikiSearch(query).then((r) => {
        if (alive) { setResults(r); setLoading(false); }
      });
    }, 350); // debounce so we don't fire a request on every keystroke
    return () => { alive = false; clearTimeout(timer); };
  }, [query]);
  return { results, loading };
}

// Single real photo for a card/thumbnail, falling back to a guaranteed-to-render
// placeholder graphic.
// BUGFIX: this used to swap straight to the Wikipedia-provided URL as soon as the
// API call resolved, with no check that the image itself actually loads. Wikipedia
// occasionally returns URLs that 404 or hang (renamed files, hotlink limits, a
// disambiguation image, etc.) — for an <img> that's caught by onError={imgFallback},
// but the attraction hero uses this same hook to build a CSS background-image
// (url(...)), and CSS has no onError equivalent, so a bad URL there just rendered
// as blank space. Now the "real" URL is probe-loaded with an off-screen Image()
// first, and only swapped in once it's confirmed to actually load — otherwise the
// on-brand placeholder stays put instead of going blank.
function useWikiThumb(title, fallbackUrl, context) {
  const [url, setUrl] = useState(fallbackUrl);
  useEffect(() => {
    let alive = true;
    setUrl(fallbackUrl);
    fetchWikiThumb(wikiTitle(title), context).then((real) => {
      if (!alive || !real) return;
      const probe = new Image();
      probe.onload = () => { if (alive) setUrl(real); };
      probe.onerror = () => { console.warn(`[photo] Resolved photo URL for "${title}" failed to actually load:`, real); };
      probe.src = real;
    });
    return () => { alive = false; };
    // eslint-disable-next-line
  }, [title, context]);
  return url;
}

// Gallery of real photos for a place's detail page, topped up with fallback photos if needed.
function useWikiGallery(title, city, count = 5) {
  const fallback = useMemo(() => galleryFor(title, city, count), [title, city, count]);
  const [photos, setPhotos] = useState(fallback);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    let alive = true;
    setLoading(true);
    setPhotos(fallback);
    fetchWikiGallery(wikiTitle(title), count, city).then((real) => {
      if (!alive) return;
      if (real.length >= count) setPhotos(real.slice(0, count));
      else if (real.length > 0) setPhotos([...real, ...fallback].slice(0, count));
      setLoading(false);
    });
    return () => { alive = false; };
    // eslint-disable-next-line
  }, [title, city, count]);
  return { photos, loading };
}

function Gallery({ name, city, queryName, queryCity, t, count = 5 }) {
  const { photos, loading } = useWikiGallery(queryName || name, queryCity || city, count);
  const [active, setActive] = useState(0);
  const [lightbox, setLightbox] = useState(false);
  useEffect(() => { setActive(0); }, [name]);
  return (
    <div className="fade-up" style={{ marginBottom: 26 }}>
      <div onClick={() => setLightbox(true)} style={{ position: "relative", height: 340, borderRadius: 22, overflow: "hidden", border: `1px solid ${t.border}`, cursor: "zoom-in", background: t.panelAlt }}>
        <img src={photos[active]} alt={`${name}, ${city} — photo ${active + 1}`} loading="lazy" onError={imgFallback(name)} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
        <div style={{ position: "absolute", bottom: 10, right: 12, background: "#000000AA", color: "#fff", fontSize: 11, padding: "4px 9px", borderRadius: 999 }}>
          {active + 1} / {photos.length} &nbsp;·&nbsp; {loading ? "loading real photos…" : "click to enlarge"}
        </div>
      </div>
      <div className="scrollbar-thin" style={{ display: "flex", gap: 8, marginTop: 8, overflowX: "auto" }}>
        {photos.map((p, i) => (
          <img key={i} src={p} alt={`${name} thumbnail ${i + 1}`} loading="lazy" onError={imgFallback(name)} onClick={() => setActive(i)}
            style={{ width: 96, height: 66, objectFit: "cover", borderRadius: 10, cursor: "pointer", flexShrink: 0, border: active === i ? `2px solid ${t.saffron}` : `1px solid ${t.border}`, opacity: active === i ? 1 : 0.72 }} />
        ))}
      </div>
      {lightbox && (
        <div onClick={() => setLightbox(false)} style={{ position: "fixed", inset: 0, background: "#000000E8", zIndex: 300, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <img src={photos[active]} alt={name} onError={imgFallback(name)} style={{ maxWidth: "92vw", maxHeight: "76vh", borderRadius: 14, objectFit: "contain" }} />
          <div style={{ display: "flex", gap: 8, marginTop: 18 }}>
            {photos.map((p, i) => (
              <img key={i} src={p} alt={`${name} thumbnail ${i + 1}`} onError={imgFallback(name)} onClick={(e) => { e.stopPropagation(); setActive(i); }}
                style={{ width: 64, height: 46, objectFit: "cover", borderRadius: 8, cursor: "pointer", border: active === i ? "2px solid #E8A33D" : "2px solid transparent" }} />
            ))}
          </div>
          <button onClick={() => setLightbox(false)} style={{ position: "absolute", top: 22, right: 22, width: 40, height: 40, borderRadius: "50%", border: "none", background: "#ffffff22", color: "#fff", cursor: "pointer", fontSize: 16 }}>✕</button>
        </div>
      )}
    </div>
  );
}

/* ============================== WEATHER CARD ==============================
   Renders live conditions from Open-Meteo (via useLiveWeather). Falls back to
   the bundled sample figures — clearly labelled as such — if the request fails.
=========================================================================== */
function WeatherCard({ attraction, city, t }) {
  const { tr } = useLang();
  const { weather: w, failed, loading } = useLiveWeather(attraction);
  const [advice, setAdvice] = useState(null);
  const [adviceLoading, setAdviceLoading] = useState(false);
  const [adviceError, setAdviceError] = useState(false);
  // Guards against setting state after this card has unmounted or moved on
  // to a different attraction while a Gemini request was still in flight.
  const isMountedRef = useRef(true);
  useEffect(() => () => { isMountedRef.current = false; }, []);

  // Reset any previously fetched advice whenever the place changes.
  useEffect(() => {
    setAdvice(null);
    setAdviceError(false);
    setAdviceLoading(false);
  }, [attraction.id]);

  const askGeminiForAdvice = async () => {
    if (!w || adviceLoading) return;
    setAdviceLoading(true);
    setAdviceError(false);
    try {
      const placeLabel = `${attraction.name}, ${city}`;
      const res = await fetchWeatherTravelAdvice(placeLabel, w);
      if (!isMountedRef.current) return;
      if (res && (res.advice || res.tips)) setAdvice(res);
      else throw new Error("empty_advice");
    } catch (e) {
      if (isMountedRef.current) setAdviceError(true);
    } finally {
      if (isMountedRef.current) setAdviceLoading(false);
    }
  };

  if (!w) {
    return (
      <div className="weather-glass" style={{ padding: 18, borderRadius: 22, background: `${t.panelAlt}cc`, border: `1px solid ${t.border}` }}>
        <div className="weather-glass-content">
          <div className="font-utility" style={{ color: t.textDim, fontSize: 13 }}>{tr("CURRENT WEATHER")}</div>
          <div className="font-body" style={{ color: t.textDim, marginTop: 6 }}>{tr("Weather information is temporarily unavailable.")}</div>
        </div>
      </div>
    );
  }

  const meta = weatherCodeMeta(w.code);

  return (
    <div className="weather-glass" style={{ padding: 20, borderRadius: 22, background: `linear-gradient(150deg, ${t.panelAlt}dd, ${t.panel}cc)`, border: `1px solid ${t.border}` }}>
      <div className="weather-glass-orb a" />
      <div className="weather-glass-orb b" />
      <div className="weather-glass-content">
        <div className="font-utility" style={{ color: t.gold, fontSize: 12, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
          <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {!loading && !failed && <span className="weather-live-dot" />}
            {tr("CURRENT WEATHER")} · {city.toUpperCase()}
          </span>
          {loading && <span style={{ opacity: 0.6, fontSize: 10 }}>{tr("updating…")}</span>}
        </div>

        {/* TODAY hero card */}
        <div style={{
          marginTop: 14, padding: "16px 16px", borderRadius: 18,
          background: `${t.panel}80`, border: `1px solid ${t.border}`,
          display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12,
        }}>
          <div>
            <div className="font-utility" style={{ fontSize: 10, color: t.textDim, letterSpacing: "0.08em" }}>{tr("TODAY")}</div>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 10, marginTop: 4 }}>
              <div className="font-display" style={{ fontSize: 48, color: t.text, lineHeight: 1 }}>{w.temp}°C</div>
              <div className="font-body" style={{ color: t.textDim, marginBottom: 8, fontSize: 13 }}>{tr("Feels like")} {w.feelsLike}°C</div>
            </div>
          </div>
          <div style={{ fontSize: 46, lineHeight: 1 }} title={meta.label}>{meta.emoji}</div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8, marginTop: 14 }}>
          <div className="weather-forecast-chip font-body" style={{ fontSize: 12, color: t.textDim, display: "flex", flexDirection: "column", gap: 4, padding: "8px 10px", borderRadius: 12, background: `${t.panel}66`, border: `1px solid ${t.border}` }}>
            <Droplets size={14} color={t.saffron} /> {w.humidity}% {tr("humidity")}
          </div>
          <div className="weather-forecast-chip font-body" style={{ fontSize: 12, color: t.textDim, display: "flex", flexDirection: "column", gap: 4, padding: "8px 10px", borderRadius: 12, background: `${t.panel}66`, border: `1px solid ${t.border}` }}>
            <Wind size={14} color={t.saffron} /> {w.wind} km/h {tr("wind")}
          </div>
          <div className="weather-forecast-chip font-body" style={{ fontSize: 12, color: t.textDim, display: "flex", flexDirection: "column", gap: 4, padding: "8px 10px", borderRadius: 12, background: `${t.panel}66`, border: `1px solid ${t.border}` }}>
            <Eye size={14} color={t.saffron} /> {w.visibility} km {tr("visibility")}
          </div>
        </div>

        <div className="font-utility" style={{ fontSize: 10, color: t.textDim, letterSpacing: "0.08em", marginTop: 16 }}>{tr("5-DAY FORECAST")}</div>
        <div className="scrollbar-thin" style={{ display: "flex", gap: 10, marginTop: 8, overflowX: "auto", paddingBottom: 4 }}>
          {w.forecast.map((f, i) => (
            <div key={i} className="weather-forecast-chip" style={{ minWidth: 64, textAlign: "center", padding: "8px 6px", borderRadius: 12, background: `${t.panel}66`, border: `1px solid ${t.border}` }}>
              <div className="font-utility" style={{ fontSize: 10, color: t.textDim }}>{f.d}</div>
              <div className="font-body" style={{ fontSize: 14, color: t.text, marginTop: 4 }}>{f.t}°</div>
              <div className="font-body" style={{ fontSize: 10, color: t.gold, marginTop: 2 }}>{f.rain}% {tr("rain")}</div>
            </div>
          ))}
        </div>

        {/* Gemini-powered weather-aware travel advice */}
        <div style={{ marginTop: 18, paddingTop: 16, borderTop: `1px solid ${t.border}` }}>
          {!advice && (
            <button className="weather-advice-btn" onClick={askGeminiForAdvice} disabled={adviceLoading}>
              <Sparkles size={13} color="#fff" />
              {adviceLoading ? <>{tr("Getting advice…")} <GeminiThinkingDots /></> : tr("Ask Gemini for travel advice")}

          )}

          {adviceError && !adviceLoading && (
            <div style={{ marginTop: 10 }}>
              <div className="font-body" style={{ fontSize: 12, color: t.textDim }}>{tr("Gemini couldn't fetch advice right now — please try again.")}</div>
            </div>
          )}

          {advice && (
            <div className="weather-advice-panel" style={{
              padding: 14, borderRadius: 16, background: `${t.panel}80`, border: `1px solid ${t.border}`,
            }}>
              <div className="gemini-badge-row" style={{ justifyContent: "flex-start", marginBottom: 8 }}>
                <span className="gemini-badge">
                  <span className="gemini-badge-dot" />
                  ✨ {tr("Powered by Gemini AI")}
                </span>
              </div>
              {advice.advice && (
                <div className="font-body" style={{ fontSize: 13, color: t.text, lineHeight: 1.55 }}>{advice.advice}</div>
              )}
              {Array.isArray(advice.tips) && advice.tips.length > 0 && (
                <div style={{ marginTop: 10 }}>
                  <div className="font-utility" style={{ fontSize: 10, color: t.gold, letterSpacing: "0.06em" }}>{tr("Quick tips")}</div>
                  <ul className="font-body" style={{ margin: "6px 0 0", paddingLeft: 18, fontSize: 12.5, color: t.textDim, lineHeight: 1.6 }}>
                    {advice.tips.map((tip, i) => <li key={i}>{tip}</li>)}

                </div>
              )}
              {Array.isArray(advice.pack) && advice.pack.length > 0 && (
                <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
                  <span className="font-utility" style={{ fontSize: 10, color: t.gold, letterSpacing: "0.06em" }}>{tr("Pack for today")}:</span>
                  {advice.pack.map((item, i) => (

                  ))}
                </div>
              )}
              <div className="font-body" style={{ fontSize: 9.5, color: t.textDim, marginTop: 10, opacity: 0.7 }}>
                {tr("AI-generated · always confirm conditions before heading out.")}
              </div>
            </div>
          )}
        </div>

        <div className="font-body" style={{ fontSize: 10, color: t.textDim, marginTop: 12, opacity: 0.7 }}>
          {failed ? tr("Live weather unavailable right now · showing sample data") : tr("Live weather · Open-Meteo")}
        </div>
      </div>
    </div>
  );
}

/* ============================== LOCATION MAP ==============================
   A real, working embedded map (OpenStreetMap — no API key required) showing
   the attraction's actual coordinates, plus links out to full Google Maps /
   OpenStreetMap directions.
=========================================================================== */
function LocationMap({ attraction, state, t, onExploreSite }) {
  const { tr } = useLang();
  const coords = attraction.coords;
  // Heritage-at-risk lookup: reuses the SAME HERITAGE_AT_RISK array and
  // SEVERITY_META styling the Heritage at Risk cards/modal already use —
  // nothing about risk sites is duplicated or re-entered here, this just
  // finds (if any) the entry for the attraction this map is showing.
  const riskInfo = HERITAGE_AT_RISK.find((r) => r.attractionId === attraction.id) || null;
  const riskSev = riskInfo ? (SEVERITY_META[riskInfo.severity] || SEVERITY_META.Moderate) : null;
  const [riskOpen, setRiskOpen] = useState(false);
  if (!coords) {
    return (
      <div style={{ padding: 18, borderRadius: 16, background: t.panelAlt, border: `1px solid ${t.border}` }}>
        <div className="font-utility" style={{ color: t.gold, fontSize: 12, marginBottom: 10 }}>{tr("LOCATION")}</div>
        <div className="font-body" style={{ fontSize: 13, color: t.textDim }}>{tr("Map location is unavailable for this site.")}</div>
      </div>
    );
  }
  const { lat, lng } = coords;
  const d = 0.045;
  const bbox = `${(lng - d).toFixed(5)},${(lat - d).toFixed(5)},${(lng + d).toFixed(5)},${(lat + d).toFixed(5)}`;
  const osmEmbed = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat},${lng}`;
  const osmLink = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=14/${lat}/${lng}`;
  const gmapsLink = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

  /* ---- Gemini "nearby places" recommendations, plotted as markers on top
     of the existing embedded map (the iframe above is left completely
     untouched — these are just absolutely-positioned pins in the same
     relative-positioned container). ---- */
  const [nearby, setNearby] = useState([]);
  const [nearbyLoading, setNearbyLoading] = useState(true);
  const [nearbyError, setNearbyError] = useState(false);
  const [activeIdx, setActiveIdx] = useState(null);

  useEffect(() => {
    let alive = true;
    setNearby([]);
    setActiveIdx(null);
    setNearbyLoading(true);
    setNearbyError(false);

    const sys = "Respond with ONLY a raw JSON object of the exact shape "
      + "{\"places\": [{\"name\": string, \"category\": string, \"note\": string, \"lat\": number, \"lng\": number}]} "
      + "— no markdown fences, no commentary. Recommend 5 real, well-known places worth visiting "
      + "within roughly 5-8km of the given coordinates (other monuments, temples, markets, viewpoints, "
      + "parks or well-regarded local eateries — never the place itself). \"category\" must be one short word "
      + "(e.g. Temple, Fort, Market, Food, Nature, Museum). \"note\" must be under 12 words. \"lat\"/\"lng\" must "
      + "be realistic approximate coordinates near the given point.";
    const user = `Near ${attraction.name}, ${attraction.city}, ${state.name} — latitude ${lat}, longitude ${lng}.`;

    callGeminiForRoute(sys, user).then((res) => {
      if (!alive) return;
      const places = Array.isArray(res?.places) ? res.places : Array.isArray(res) ? res : [];
      const clean = places.filter((p) => p && typeof p.lat === "number" && typeof p.lng === "number" && p.name).slice(0, 6);
      if (clean.length === 0) setNearbyError(true);
      setNearby(clean);
    }).catch(() => {
      if (alive) setNearbyError(true);
    }).finally(() => {
      if (alive) setNearbyLoading(false);
    });

    return () => { alive = false; };
  }, [attraction.id, lat, lng]);

  // Project each recommended place's lat/lng into the same bbox the embedded
  // map iframe above already renders, so pins line up with real geography —
  // clamped a little inside the edges so a pin's marker head never gets cut off.
  const minLng = lng - d, maxLng = lng + d, minLat = lat - d, maxLat = lat + d;
  const clampPct = (v) => Math.min(96, Math.max(4, v));
  const nearbyPositioned = nearby.map((p) => ({
    ...p,
    xPct: clampPct(((p.lng - minLng) / (maxLng - minLng)) * 100),
    yPct: clampPct(((maxLat - p.lat) / (maxLat - minLat)) * 100),
  }));

  const nearbyIconFor = (category) => {
    const c = String(category || "").toLowerCase();
    if (c.includes("temple") || c.includes("mosque") || c.includes("shrine")) return { icon: Landmark, color: "#E2723A" };
    if (c.includes("fort") || c.includes("monument") || c.includes("palace")) return { icon: Landmark, color: "#C9A24B" };
    if (c.includes("museum")) return { icon: Building2, color: "#9B7FC7" };
    if (c.includes("church")) return { icon: Church, color: "#7C93C9" };
    if (c.includes("lake") || c.includes("nature") || c.includes("park") || c.includes("garden")) return { icon: Trees, color: "#4FA3C9" };
    if (c.includes("food") || c.includes("eat") || c.includes("cafe") || c.includes("restaurant")) return { icon: Coffee, color: "#C97A4B" };
    if (c.includes("market") || c.includes("shop") || c.includes("bazaar")) return { icon: Ticket, color: "#5B8C7A" };
    return { icon: MapPin, color: t.saffron };
  };

  return (

      <div className="font-utility" style={{ color: t.gold, fontSize: 12, marginBottom: 10 }}>LOCATION</div>

        <iframe
          key={attraction.id}
          title={`Map of ${attraction.name}`}
          src={osmEmbed}
          style={{ width: "100%", height: "100%", border: 0 }}
          loading="lazy"
          referrerPolicy="no-referrer-when-downgrade"
        />

        {/* Heritage-at-risk marker — only rendered when this attraction has an

              className="heritage-risk-marker-ring"
              style={{
                "--risk-color": `${riskSev.color}8c`,
                width: 30, height: 30, borderRadius: "50% 50% 50% 0", transform: "rotate(-45deg)",
                border: "2.5px solid #fff", cursor: "pointer", background: riskSev.color,
                boxShadow: "0 4px 12px rgba(0,0,0,.4)",
                display: "flex", alignItems: "center", justifyContent: "center", padding: 0,
              }}
            >
              <span style={{ transform: "rotate(45deg)", fontSize: 14, lineHeight: 1 }}>⚠️</span>
            </button>

            {riskOpen && (
              <div className="gemini-response-fadein" style={{
                position: "absolute", bottom: "calc(100% + 10px)", left: "50%", transform: "translateX(-50%)",
                width: 230, background: t.panel, border: `1px solid ${riskSev.color}77`, borderRadius: 12,
                padding: "12px 14px", boxShadow: "0 12px 30px rgba(0,0,0,.4)", zIndex: 6,
              }}>
                <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 6, marginBottom: 6 }}>
                  <div className="font-display" style={{ fontSize: 14, color: t.text, lineHeight: 1.25 }}>{attraction.name}</div>
                  <button onClick={() => setRiskOpen(false)} aria-label={tr("Close")} style={{ background: "none", border: "none", cursor: "pointer", padding: 0, flexShrink: 0, marginTop: 1 }}>
                    <X size={13} color={t.textDim} />
                  </button>
                </div>
                <div className="font-body" style={{ fontSize: 11.5, color: t.textDim, display: "flex", alignItems: "center", gap: 4, marginBottom: 8 }}>
                  <MapPin size={11} /> {attraction.city}, {state.name}
                </div>
                <span className="font-utility" style={{
                  display: "inline-flex", fontSize: 10, padding: "3px 9px", borderRadius: 999, marginBottom: 8,
                  border: `1px solid ${riskSev.color}77`, background: `${riskSev.color}1f`, color: riskSev.color,
                }}>{riskSev.emoji} {tr(riskInfo.severity).toUpperCase()} {tr("RISK")}</span>
                <div className="font-body" style={{ fontSize: 11.5, color: t.text, lineHeight: 1.5, marginBottom: 10 }}>
                  <strong style={{ color: riskSev.color }}>{tr("Preservation concern")}:</strong> {tr(riskInfo.concern)}
                </div>
                <button
                  onClick={() => { setRiskOpen(false); if (onExploreSite) onExploreSite(); }}
                  className="font-utility"
                  style={{
                    width: "100%", padding: "8px 12px", borderRadius: 999, border: "none",
                    background: t.saffron, color: "#1a0f00", fontSize: 11.5, fontWeight: 700, cursor: "pointer",
                    display: "flex", alignItems: "center", justifyContent: "center", gap: 5,
                  }}
                >
                  {tr("Explore Site")} <ChevronRight size={12} />
                </button>
              </div>
            )}
          </div>
        )}

        {/* Gemini-recommended nearby-place markers, overlaid on the embedded map above. */}
        <div style={{ position: "absolute", inset: 0, pointerEvents: "none" }}>
          {nearbyPositioned.map((p, i) => {
            const meta = nearbyIconFor(p.category);
            const IconComp = meta.icon;
            const isActive = activeIdx === i;
            return (
              <div key={i} style={{ position: "absolute", left: `${p.xPct}%`, top: `${p.yPct}%`, transform: "translate(-50%,-100%)", pointerEvents: "auto", zIndex: isActive ? 3 : 2 }}>
                <button
                  onClick={() => setActiveIdx(isActive ? null : i)}
                  title={p.name}
                  aria-label={p.name}
                  style={{
                    width: 24, height: 24, borderRadius: "50% 50% 50% 0", transform: "rotate(-45deg)",
                    border: "2px solid #fff", cursor: "pointer", background: meta.color,
                    boxShadow: isActive ? "0 0 0 4px rgba(255,255,255,.35), 0 4px 10px rgba(0,0,0,.35)" : "0 3px 8px rgba(0,0,0,.35)",
                    display: "flex", alignItems: "center", justifyContent: "center", padding: 0,
                    transition: "box-shadow .15s ease, transform .15s ease",
                  }}
                >
                  <IconComp size={11} color="#fff" style={{ transform: "rotate(45deg)" }} />
                </button>
                {isActive && (
                  <div className="gemini-response-fadein" style={{
                    position: "absolute", bottom: "calc(100% + 8px)", left: "50%", transform: "translateX(-50%)",
                    width: 170, background: t.panel, border: `1px solid ${t.border}`, borderRadius: 10,
                    padding: "8px 10px", boxShadow: "0 10px 26px rgba(0,0,0,.3)", zIndex: 4,
