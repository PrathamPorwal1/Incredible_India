function solanLocalPicks(budget, days) {
  // Heuristic fallback used only if the Gemini call is unavailable: fewer
  // days or a tighter budget narrows to the free/quick options first.
  const n = Number(days) || 1;
  const isLowBudget = typeof budget === "number" && budget > 0 && budget < 1500;
  let pool = SOLAN_ATTRACTIONS;
  if (isLowBudget) pool = pool.filter((a) => a.cost === "free" || a.cost === "budget");
  const count = n <= 1 ? 3 : n === 2 ? 5 : pool.length;
  const picks = pool.slice(0, count).map((a) => ({ name: a.name, why: a.desc }));
  const note = `A ${n}-day${isLowBudget ? ", budget-friendly" : ""} shortlist for Solan — starting with the closest, easiest stops.`;
  return { picks, note, source: "local" };
}

function SolanExplorer({ t }) {
  const { tr } = useLang();
  const [budget, setBudget] = useState("");
  const [days, setDays] = useState("1");
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  // Guards against setting state after this section has unmounted while a
  // Gemini request was still in flight.
  const isMountedRef = useRef(true);
  useEffect(() => () => { isMountedRef.current = false; }, []);

  const askGemini = async () => {
    setLoading(true);
    setError(null);
    setResult(null);
    const listForPrompt = SOLAN_ATTRACTIONS.map((a) => `${a.name} (${a.category}, ${a.cost} cost) — ${a.desc}`).join("\n");
    const sys = `Respond with ONLY a raw JSON object of the exact shape {"picks":[{"name":string,"why":string}],"note":string} — no markdown fences, no commentary. Choose ONLY from the provided list of real places in Solan, Himachal Pradesh — never invent a place. "why" must be under 20 words and grounded in the place's own description. "note" is one short sentence (under 25 words) summarizing the plan for the given budget and days.`;
    const user = `Places available in and around Solan:\n${listForPrompt}\n\nTraveler's budget: ${budget ? `₹${budget} total` : "not specified"}. Number of days: ${days || "1"}. Pick the best-fitting 3 to ${SOLAN_ATTRACTIONS.length} places, covering a mix of nature, temples and cafés where it fits the days available.`;
    try {
      const res = await callGeminiForRoute(sys, user);
      if (!isMountedRef.current) return;
      if (res && Array.isArray(res.picks) && res.picks.length) {
        setResult({ picks: res.picks, note: res.note || "", source: "gemini" });
      } else {
        setResult(solanLocalPicks(Number(budget), days));
      }
    } catch (e) {
      if (isMountedRef.current) setResult(solanLocalPicks(Number(budget), days));
    } finally {
      if (isMountedRef.current) setLoading(false);
    }

  return (

/* ============================== GEMINI FLOATING CHATBOT ==============================
   A small floating assistant available on every page. Shares the transport
   layer (requestGemini) with every other AI feature, but asks for a plain-text
   reply rather than JSON, since a conversational answer has no structure worth
   validating.
=========================================================================== */
// Chat history is kept in sessionStorage (not localStorage) so it survives the
// widget being closed/reopened and even an accidental page refresh within the
// same tab session, but doesn't linger forever like a permanent chat log.
/* The assistant's standing instructions. Kept per language because the reply
   should follow the site's own language toggle rather than whichever language
   the visitor happened to type in — someone browsing in Hindi expects a Hindi
   answer even to an English question, and Gemini reads both either way. */
const CHAT_SYSTEM_PROMPT = {
  en: [
    "You are the travel and culture guide for Incredible India, a site about India's states, monuments,",
    "heritage sites, festivals, food, crafts and trip planning. Answer within that world: where to go,",
    "what a place is and why it matters, when to visit, how to reach it, what to eat, what a festival or",
    "tradition means, and how to shape a short itinerary.",
    "Be conversational and specific. Two or three sentences for a simple question; a short list only when",
    "someone asks for a plan or a comparison. Keep ordinary answers under about 90 words.",
    "Earlier turns are there for context, so resolve references like \"it\" or \"there\" against the place",
    "already under discussion, and reply only to the latest message.",
    "Say so plainly when you are unsure instead of inventing a detail, and steer anything unrelated back",
    "to travelling in India. Reply as plain prose only: no JSON, no markdown, no asterisks or bullet symbols.",
  ].join(" "),
  hi: [
    "You are the travel and culture guide for Incredible India, a site about India's states, monuments,",
    "heritage sites, festivals, food, crafts and trip planning. Answer within that world: where to go,",
    "what a place is and why it matters, when to visit, how to reach it, what to eat, what a festival or",
    "tradition means, and how to shape a short itinerary.",
    "Write every reply in natural, conversational Hindi in the Devanagari script, even when the question",
    "is asked in English or Hinglish. Do not transliterate into Roman script and do not answer in English.",
    "Be conversational and specific. Two or three sentences for a simple question; a short list only when",
    "someone asks for a plan or a comparison. Keep ordinary answers under about 90 words.",
    "Earlier turns are there for context, so resolve references like \"it\" or \"there\" against the place",
    "already under discussion, and reply only to the latest message.",
    "Say so plainly when you are unsure instead of inventing a detail, and steer anything unrelated back",
    "to travelling in India. Reply as plain prose only: no JSON, no markdown, no asterisks or bullet symbols.",
  ].join(" "),
};

const GEMINI_CHAT_STORAGE_KEY = "geminiChatWidget_history_v1";
// How many recent messages (user + AI combined) we forward to Gemini as
// conversation context. Keeps follow-up questions like "who built it?"
// working without letting the request payload grow unbounded.
const GEMINI_CHAT_MAX_HISTORY_MESSAGES = 20;
// Max characters allowed in a single chat message before we block sending it.
const GEMINI_CHAT_MAX_MESSAGE_LENGTH = 1500;
// Minimum gap between two accepted sends — basic spam protection on top of
// the single-in-flight-request guard, without slowing down normal use (a
// real person reading a reply and typing a follow-up easily clears this).
const GEMINI_CHAT_MIN_SEND_INTERVAL_MS = 1000;

function loadStoredChatMessages() {
  try {
    const raw = sessionStorage.getItem(GEMINI_CHAT_STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed) && parsed.length && parsed.every((m) => m && typeof m.text === "string" && (m.role === "user" || m.role === "ai"))) {
      return parsed;
    }
  } catch (e) {
    // Corrupt or inaccessible storage (e.g. private browsing) — fall back to a fresh chat.
  }
  return null;
}

function GeminiChatWidget({ t, dark }) {
  const { tr, lang } = useLang();
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState(() => loadStoredChatMessages() || [
    { role: "ai", text: tr("Namaste! 🙏 Ask me anything about India's heritage, culture or travel — forts, festivals, food, best time to visit, whatever you're curious about.") },
  ]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [listening, setListening] = useState(false);
  const [micError, setMicError] = useState("");
  const [lengthError, setLengthError] = useState("");
  const bodyRef = useRef(null);
  const inputRef = useRef(null);
  const recognitionRef = useRef(null);
  const finalTranscriptRef = useRef("");
  // True while the user deliberately pressed the mic button to stop
  // listening, so onerror/onend know not to surface a scary error message
  // for something the user did on purpose.
  const manualStopRef = useRef(false);
  // True between recognition.start() being called and onstart actually
  // firing, so a rapid double-click on the mic button can't spin up a
  // second recognition instance before the first has registered as active.
  const startingRef = useRef(false);
  // Synchronous in-flight guard. React state (`typing`) updates are batched/
  // async, so relying on it alone can't reliably stop a second Gemini request
  // fired by a rapid double-click or double Enter-press in the same tick —
  // this ref flips true/false immediately, closing that gap.
  const sendingRef = useRef(false);
  // Tracks whether this widget is still mounted, so a slow/aborted Gemini
  // response that resolves after the component is gone never touches state.
  const isMountedRef = useRef(true);
  // The AbortController for whatever Gemini request is currently in flight
  // (if any), so unmounting can cancel it instead of leaving it to finish
  // pointlessly in the background.
  const activeControllerRef = useRef(null);
  // Timestamp of the last accepted send(), for the rate-limit cooldown below.
  const lastSendAtRef = useRef(0);
  // Real, request-derived Gemini availability shared across every AI feature
  // on the site — see the GEMINI SERVICE STATUS store above `send`'s callers.
  const geminiStatus = useGeminiServiceStatus();
  useEffect(() => {
    isMountedRef.current = true;
    return () => {
      isMountedRef.current = false;
      if (activeControllerRef.current) {
        try { activeControllerRef.current.abort(); } catch (e) {}
      }
    };
  }, []);

  // Persist the conversation on every change so it's still there if the user
  // closes the chat window, reopens it, or refreshes the page in this tab.
  useEffect(() => {
    try {
      sessionStorage.setItem(GEMINI_CHAT_STORAGE_KEY, JSON.stringify(messages));
    } catch (e) {
      // Storage full or unavailable — conversation still works in-memory for this session.
    }
  }, [messages]);

  // Web Speech API — supported on Chrome/Edge (desktop + Android) via the
  // webkit-prefixed constructor; Safari/iOS and Firefox currently have no
  // implementation, so the mic button below degrades to a disabled state
  // with an explanatory tooltip rather than throwing at runtime.
  const SpeechRecognitionCtor = typeof window !== "undefined" ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
  const micSupported = !!SpeechRecognitionCtor;

  useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [messages, typing]);

  useEffect(() => {
    if (open) requestAnimationFrame(() => inputRef.current?.focus());
  }, [open]);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape" && open) setOpen(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open]);

  // Fully tear down whatever recognition session is currently tracked:
  // detach every handler first (so a stop()/abort() firing onend/onerror
  // asynchronously can't touch state after teardown), then stop it, then
  // drop the ref. Safe to call multiple times / when nothing is running.
  const teardownRecognition = () => {
    const recognition = recognitionRef.current;
    if (recognition) {
      recognition.onstart = null;
      recognition.onresult = null;
      recognition.onerror = null;
      recognition.onend = null;
      try { recognition.stop(); } catch (e) {}
      try { recognition.abort && recognition.abort(); } catch (e) {}
    }
    recognitionRef.current = null;
    startingRef.current = false;
  };

  // Stop any in-flight recognition session when the chatbot closes so the
  // mic doesn't keep listening in the background after the widget disappears.
  useEffect(() => {
    if (!open) {
      teardownRecognition();
      setListening(false);
    }
  }, [open]);

  // Stop listening the moment another request starts processing (e.g. a
  // suggestion chip was tapped while the mic was still open) — voice input
  // and an in-flight Gemini request shouldn't run concurrently.
  useEffect(() => {
    if (typing) {
      teardownRecognition();
      setListening(false);
    }
  }, [typing]);

  // Clean up on unmount. No setState here — the component is gone.
  useEffect(() => () => teardownRecognition(), []);

  const stopListening = () => {
    // Marks this as a deliberate user action so onerror/onend don't show an
    // error message or otherwise treat it as a failure.
    manualStopRef.current = true;
    try { recognitionRef.current?.stop(); } catch (e) {}
  };

  const startListening = () => {
    if (!micSupported || typing) return;
    // Prevent multiple simultaneous recognition instances: ignore the call
    // if one is already running or is in the process of starting (guards
    // against rapid repeated clicks on the mic button).
    if (recognitionRef.current || startingRef.current) return;

    startingRef.current = true;
    manualStopRef.current = false;
    setMicError("");
    const recognition = new SpeechRecognitionCtor();
    recognitionRef.current = recognition;
    finalTranscriptRef.current = "";
    recognition.lang = lang === "hi" ? "hi-IN" : "en-IN";
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    // Guards every handler below against acting on a stale/superseded
    // session — e.g. this recognition was torn down (chatbot closed,
    // another request started, unmount) but a queued browser event for it
    // still fires afterwards. This is what keeps onresult/onerror/onend
    // from racing each other or from touching state for the wrong session.
    const isCurrent = () => recognitionRef.current === recognition;

    recognition.onstart = () => {
      if (!isCurrent()) return;
      startingRef.current = false;
      setListening(true);
    };

    recognition.onresult = (event) => {
      if (!isCurrent()) return;
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalTranscriptRef.current += chunk;
        else interim += chunk;
      }
      // Live-update the text box so the user can see speech being
      // transcribed in real time, exactly as if they were typing it. The
      // user reviews this and must press Send themselves — voice input
      // never sends a message on its own.
      setInput((finalTranscriptRef.current + " " + interim).trim());
    };

    recognition.onerror = (event) => {
      if (!isCurrent()) return;
      startingRef.current = false;
      setListening(false);
      // A manual stop can itself surface as an "aborted" (or occasionally
      // "no-speech") error in some browsers — don't show an error message
      // for something the user did on purpose.
      if (manualStopRef.current) return;
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        setMicError(tr("Microphone access was blocked — allow it in your browser settings to use voice input."));
      } else if (event.error === "no-speech") {
        setMicError(tr("Didn't catch that — try again."));
      } else if (event.error === "aborted") {
        // No user-facing message — this fires for routine cancellations.
      } else {
        setMicError(tr("Voice input isn't available right now."));
      }
    };

    // Recognition has finished — naturally, due to an error, or because the
    // user pressed the mic button to stop it manually. In every case we
    // simply leave whatever was transcribed sitting in the input box for
    // the user to review, edit, or delete. Voice input never sends a
    // message by itself; the user must press Send.
    recognition.onend = () => {
      if (!isCurrent()) return;
      startingRef.current = false;
      setListening(false);
      recognitionRef.current = null;
    };

    try {
      recognition.start();
    } catch (e) {
      startingRef.current = false;
      recognitionRef.current = null;
      setListening(false);
      setMicError(tr("Voice input isn't available right now."));
    }
  };

  const toggleMic = () => {
    if (listening || startingRef.current) stopListening();
    else startListening();
  };

  const send = async (textOverride) => {
    const text = (textOverride ?? input).trim();
    // Guard against duplicate/overlapping requests: repeated Enter presses,
    // multiple Send clicks, rapid suggestion-button taps, or a voice-input
    // auto-send landing while a request is already in flight all no-op here.
    if (!text || typing || sendingRef.current) return;

    // Basic rate-limit protection: silently ignore a send that comes in
    // faster than a person could plausibly have typed/read a reply — this
    // only ever catches spam (mashed Enter, a script clicking Send in a
    // loop), never normal back-and-forth conversation pacing.
    const now = Date.now();
    if (now - lastSendAtRef.current < GEMINI_CHAT_MIN_SEND_INTERVAL_MS) return;
    lastSendAtRef.current = now;

    if (text.length > GEMINI_CHAT_MAX_MESSAGE_LENGTH) {
      setLengthError(tr(`That message is a bit long — please keep it under ${GEMINI_CHAT_MAX_MESSAGE_LENGTH} characters so I can respond well.`));
      return;
    }
    setLengthError("");

    // Prior turns are what let "when should I visit it?" resolve against the
    // place named two messages ago. The opening greeting is skipped (it is
    // static, not a real exchange) and only the most recent turns are sent, so
    // a long session doesn't grow the request without bound.
    const history = messages
      .slice(1)
      .slice(-GEMINI_CHAT_MAX_HISTORY_MESSAGES)
      .map((m) => ({ role: m.role === "user" ? "user" : "model", text: m.text }));

    sendingRef.current = true;
    setMessages((prev) => [...prev, { role: "user", text }]);
    setInput("");
    setTyping(true);

    // The reply language follows the site's own language toggle (`lang`),
    // not whatever language the user happened to type their question in —
    // Gemini understands both English and Hindi input naturally either way,
    // this only fixes which language it writes the answer back in.
    const sys = CHAT_SYSTEM_PROMPT[lang] || CHAT_SYSTEM_PROMPT.en;

    // One controller per request: lets an unmount (see effect above) cancel
    // this specific in-flight call, and is always torn down in `finally`
    // below so nothing lingers once the request settles either way.
    const controller = new AbortController();
    activeControllerRef.current = controller;

    try {
      const reply = await requestChatReply({ system: sys, message: text, history, signal: controller.signal });
      if (!isMountedRef.current) return; // widget unmounted while we waited — nothing left to update.
      setMessages((prev) => [...prev, { role: "ai", text: reply }]);
    } catch (e) {
      if (!isMountedRef.current) return;
      // An intentional cancellation (e.g. the widget unmounted mid-request)
      // isn't a failure worth showing the user anything about.
      if (e && e.code === "cancelled") return;
      // A friendly, specific-where-possible message — never the raw error,
      // endpoint or API key. Falls back to a generic connectivity message
      // for anything unrecognized.
      setMessages((prev) => [...prev, { role: "ai", text: tr(geminiFriendlyMessage(e)) }]);
    } finally {
      // Refs are safe to touch after unmount (no re-render involved) — only
      // the state setter below needs the mounted guard.
      activeControllerRef.current = null;
      sendingRef.current = false;
      if (isMountedRef.current) setTyping(false);
    }
  };

  const suggestions = [tr("Best time to visit Rajasthan?"), tr("Tell me about Diwali"), tr("Top forts in India")];

  // Status shown in the header, driven entirely by real request outcomes
  // (see useGeminiServiceStatus) — never a hardcoded "Online" claim, and
  // never itself the cause of an extra Gemini call.
  const geminiStatusMeta =
    geminiStatus === "unavailable" ? { color: "#E24A4A", label: tr("Unavailable right now"), pulse: false } :
    geminiStatus === "online" ? { color: "#5CE187", label: tr("Online"), pulse: true } :
    { color: t.textDim, label: tr("Ready"), pulse: false };

  return (
    <>
      {!open && (
        <button className="gemini-fab" onClick={() => setOpen(true)} title={tr("Chat with Gemini AI")} aria-label={tr("Open Gemini AI chat")}>
          <Sparkles size={26} color="#fff" />
        </button>
      )}

      {open && (
        <div className="gemini-chat-window" style={{ background: t.panel, border: `1px solid ${t.border}` }}>
          <div className="gemini-chat-header">
            <div className="gemini-chat-avatar"><Sparkles size={17} color="#fff" /></div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div className="font-display" style={{ fontSize: 15, lineHeight: 1.15 }}>{tr("Gemini AI Guide")}</div>
              <div className="font-utility" style={{ fontSize: 10.5, display: "flex", alignItems: "center", gap: 5, opacity: 0.9, marginTop: 2 }}>
                <span className="gemini-chat-status-dot" style={{ background: geminiStatusMeta.color, animation: geminiStatusMeta.pulse ? undefined : "none" }} /> {geminiStatusMeta.label}
              </div>
            </div>
            <button onClick={() => setOpen(false)} style={{ background: "rgba(255,255,255,.16)", border: "none", width: 30, height: 30, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }} aria-label={tr("Close chat")}>
              <X size={16} color="#fff" />
            </button>
          </div>

          <div className="gemini-chat-body scrollbar-thin" ref={bodyRef}>
            {messages.map((m, i) => (
              <div key={i} className={`gemini-msg-row ${m.role}`}>
                <div className="gemini-msg-avatar" style={{ background: m.role === "user" ? t.panelAlt : "linear-gradient(135deg,#4285F4,#9C6ADE)" }}>
                  {m.role === "user" ? <User size={13} color={t.textDim} /> : <Sparkles size={13} color="#fff" />}
                </div>
                <div className={`gemini-bubble ${m.role}`} style={m.role === "ai" ? { background: t.panelAlt, color: t.text, border: `1px solid ${t.border}` } : undefined}>
                  {m.text}
                </div>
              </div>
            ))}
            {typing && (

function LoginPanel({ t, onClose, onSignIn, onSignUp }) {
  const { tr } = useLang();
  const [mode, setMode] = useState("signin"); // signin | signup
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [busy, setBusy] = useState(false);
  const emailRef = useRef(null);
  useEffect(() => { emailRef.current?.focus(); }, [mode]);

  const isValidEmail = (val) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim());

  const submit = async () => {
    setError("");
    setNotice("");
    if (!isValidEmail(email)) { setError(tr("Please enter a valid email address.")); return; }
    if (password.length < 6) { setError(tr("Password must be at least 6 characters.")); return; }
    if (mode === "signup" && !name.trim()) { setError(tr("Please enter your name.")); return; }
    if (mode === "signup" && password !== confirmPassword) { setError(tr("Passwords do not match.")); return; }

    setBusy(true);
    try {
      if (mode === "signup") {
        const result = await onSignUp({ name: name.trim(), email: email.trim(), password });
        if (result && result.error) setError(result.error);
        else if (result && result.needsConfirmation) setNotice(tr("Check your inbox to confirm your email, then sign in."));
      } else {
        const result = await onSignIn({ email: email.trim(), password });
        if (result && result.error) setError(result.error);
      }
    } finally {
      setBusy(false);
    }
  };

  const onKeyDown = (e) => { if (e.key === "Enter" && !busy) submit(); };

  const inputStyle = {
    width: "100%", padding: "11px 14px 11px 38px", borderRadius: 10, border: `1px solid ${t.border}`,
    background: t.panelAlt, color: t.text, fontSize: 13.5, outline: "none", boxSizing: "border-box",
  };
  const fieldWrap = { position: "relative" };
  const fieldIconStyle = { position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", pointerEvents: "none" };

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(5,8,12,0.7)", backdropFilter: "blur(4px)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: "6vh 16px" }}>
      <div onClick={(e) => e.stopPropagation()} className="fade-up" style={{ width: "100%", maxWidth: 400, background: t.panel, border: `1px solid ${t.border}`, borderRadius: 20, overflow: "hidden", boxShadow: "0 30px 80px rgba(0,0,0,0.5)" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "18px 20px 0" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={{ width: 32, height: 32, borderRadius: "50%", background: `${t.saffron}22`, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <User size={16} color={t.saffron} />
            </div>
            <span className="font-display" style={{ color: t.text, fontSize: 18 }}>{mode === "signin" ? tr("Sign In") : tr("Create Account")}</span>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}><X size={18} color={t.textDim} /></button>
        </div>

        <div style={{ padding: "10px 20px 4px" }}>
          <div className="font-body" style={{ color: t.textDim, fontSize: 12.5, lineHeight: 1.5 }}>
            {mode === "signin" ? tr("Sign in to save favorites and trip plans across visits.") : tr("Create an account to save favorites and trip plans.")}
          </div>
        </div>

        <div style={{ padding: "14px 20px 0", display: "flex", flexDirection: "column", gap: 10 }}>
          {mode === "signup" && (
            <div style={fieldWrap}>
              <User size={15} color={t.textDim} style={fieldIconStyle} />
              <input value={name} onChange={(e) => setName(e.target.value)} onKeyDown={onKeyDown}
                placeholder={tr("Full name")} className="font-body" style={inputStyle} />
            </div>
          )}
          <div style={fieldWrap}>
            <Mail size={15} color={t.textDim} style={fieldIconStyle} />
            <input ref={emailRef} type="email" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={onKeyDown}
              placeholder={tr("Email address")} className="font-body" style={inputStyle} />
          </div>
          <div style={fieldWrap}>
            <Lock size={15} color={t.textDim} style={fieldIconStyle} />
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={onKeyDown}
              placeholder={tr("Password")} className="font-body" style={inputStyle} />
          </div>
          {mode === "signup" && (
            <div style={fieldWrap}>
              <Lock size={15} color={t.textDim} style={fieldIconStyle} />
              <input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} onKeyDown={onKeyDown}
                placeholder={tr("Confirm password")} className="font-body" style={inputStyle} />
            </div>
          )}

          {error && (
            <div className="font-body" style={{ color: "#FF6B6B", fontSize: 12, background: "#FF6B6B18", border: "1px solid #FF6B6B44", borderRadius: 8, padding: "8px 10px" }}>
              {error}
            </div>
          )}
          {notice && (
            <div className="font-body" style={{ color: t.green, fontSize: 12, background: `${t.green}18`, border: `1px solid ${t.green}44`, borderRadius: 8, padding: "8px 10px" }}>
              {notice}
            </div>
          )}

          <button onClick={submit} disabled={busy} className="font-utility" style={{
            marginTop: 4, padding: "12px 18px", borderRadius: 999, border: "none",
            background: t.saffron, color: "#1a0f00", fontSize: 12.5, fontWeight: 700, cursor: busy ? "default" : "pointer",
            display: "flex", alignItems: "center", justifyContent: "center", gap: 6, opacity: busy ? 0.7 : 1,
          }}>
            <User size={14} /> {busy ? tr("Please wait…") : (mode === "signin" ? tr("Sign In") : tr("Create Account"))}
          </button>
        </div>

        <div style={{ padding: "14px 20px 20px", textAlign: "center" }}>
          <span className="font-body" style={{ color: t.textDim, fontSize: 12.5 }}>
            {mode === "signin" ? tr("New here?") : tr("Already have an account?")}{" "}
          </span>
          <span onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setError(""); setNotice(""); }}
            className="font-utility" style={{ color: t.saffron, fontSize: 12.5, cursor: "pointer", fontWeight: 700 }}>
            {mode === "signin" ? tr("Create Account") : tr("Sign In")}
          </span>
          <div className="font-body" style={{ color: t.textDim, fontSize: 10.5, marginTop: 12, lineHeight: 1.5, opacity: 0.75 }}>
            {tr("Secured by Supabase Auth.")}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================== APP ============================== */
// PERF: hoisted to module scope — these were previously re-created (new array/object
// identity) on every single App render, which is unnecessary churn for two constants
// that never change. Every nav label maps to a real section id on the Home page so
// clicking it actually goes somewhere, instead of being a dead label.
const NAV_ITEMS = ["Home", "Explore India", "Heritage", "Culture", "Map", "Plan Trip", "Route Planner", "AI Heritage Guide", "Solan"];
const SECTION_MAP = { "Explore India": "sec-explore", "Heritage": "sec-heritage", "Culture": "sec-culture", "Map": "sec-explore", "Plan Trip": "sec-plan", "Route Planner": "sec-route-planner", "AI Heritage Guide": "sec-ai-guide", "Solan": "sec-solan" };

function App() {
  const [loading, setLoading] = useState(true);
  const [dark, setDark] = useState(true);
  const [accentKey, setAccentKey] = useState("saffron");
  const [reduceMotion, setReduceMotion] = useState(false);
  const [view, setView] = useState({ page: "home" }); // home | state | attraction | webAttraction
  const [query, setQuery] = useState("");
  const [activeRegion, setActiveRegion] = useState("All");
  const [activeCategory, setActiveCategory] = useState(null);
  const [searchOpen, setSearchOpen] = useState(false);
  const [favOpen, setFavOpen] = useState(false);
  const [tripOpen, setTripOpen] = useState(false);
  const [favs, setFavs] = useState(new Set());
  const [tripItems, setTripItems] = useState(new Set());
  const [comments, setComments] = useState({}); // { [attractionId]: [{ id, name, text, userId }] } — loaded from Supabase per attraction
  const [ratings, setRatings] = useState({}); // { [attractionId]: [{ id, place, hotel, food, userId }] } — loaded from Supabase per attraction
  const [navOpen, setNavOpen] = useState(false);
  const [isNarrow, setIsNarrow] = useState(typeof window !== "undefined" ? window.innerWidth < 860 : false);
  const [pendingScroll, setPendingScroll] = useState(null);
  const [activeSection, setActiveSection] = useState(null);
  const [hotelRateCreds, setHotelRateCreds] = useState(null);
  const [liveRatesEnabled, setLiveRatesEnabled] = useState(false);
  const [lang, setLang] = useState("en");
  const [user, setUser] = useState(null); // currently signed-in user, or null
  const [authLoading, setAuthLoading] = useState(true);
  const [loginOpen, setLoginOpen] = useState(false);
  const [fileProtoBannerDismissed, setFileProtoBannerDismissed] = useState(false);
  const isFileProtocol = typeof location !== "undefined" && location.protocol === "file:";
  const [toast, setToast] = useState(null); // { message } | null — surfaces save failures (favorites/trip) that used to only go to console
  const toastTimerRef = useRef(null);
  const showToast = (message) => {
    setToast({ message });
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => setToast(null), 5000);
  };

  const t = useT(dark, accentKey);
  const tr = (s) => (lang === "hi" && TRANSLATIONS.hi[s]) || s;

  useEffect(() => {
    const timer = setTimeout(() => setLoading(false), 1600);
    return () => clearTimeout(timer);
  }, []);

  useEffect(() => {
    // PERF: throttled with requestAnimationFrame so a drag-resize doesn't fire a full
    // App re-render (and cascading child re-renders) on every single resize event —
    // at most once per animation frame instead.
    let raf = null;
    const onResize = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        const narrow = window.innerWidth < 860;
        setIsNarrow((prev) => (prev === narrow ? prev : narrow));
        if (!narrow) setNavOpen(false);
      });
    };
    window.addEventListener("resize", onResize);
    return () => {
      window.removeEventListener("resize", onResize);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  // Favorites, trip items, ratings and reviews are all persisted to Supabase
  // so that signing in on any device/day restores exactly what the person saved.
  // Every write here requires a signed-in user — if there's no session, we open
  // the login panel instead of silently discarding the action.
  const toggleFav = (id) => {
    if (!user) { setLoginOpen(true); return; }
    // BUGFIX: this used to return here with zero feedback whenever Supabase
    // wasn't reachable (CDN blocked/offline) — the heart looked clickable
    // but silently did nothing. Now it tells the person why instead of
    // leaving a dead-looking button.
    if (!supabaseClient) { showToast(tr("Couldn't save favorite") + ": " + tr("Something went wrong. Please try again.")); return; }
    const wasFav = favs.has(id);
    setFavs((prev) => {
      const next = new Set(prev);
      if (wasFav) next.delete(id); else next.add(id);
      return next;
    });
    const req = wasFav
      ? supabaseClient.from("favorites").delete().eq("user_id", user.id).eq("attraction_id", id)
      : supabaseClient.from("favorites").insert({ user_id: user.id, attraction_id: id });
    // BUGFIX: this used to be `.then(() => {})` — any write failure (RLS rejection,
    // network drop, etc.) was silently swallowed and the UI kept showing a "saved"
    // state that was never actually persisted. Now a failure rolls the optimistic
    // update back so the UI stays honest, and logs the reason for diagnosis.
    req.then(({ error }) => {
      if (!error) return;
      console.error(`[favorites] ${wasFav ? "delete" : "insert"} failed:`, error.message);
      setFavs((prev) => {
        const next = new Set(prev);
        if (wasFav) next.add(id); else next.delete(id);
        return next;
      });
      showToast(tr("Couldn't save favorite") + ": " + (error.message || tr("Something went wrong. Please try again.")));
    });
  };

  const toggleTrip = (id) => {
    if (!user) { setLoginOpen(true); return; }
    if (!supabaseClient) return; // backend unavailable — fail silently instead of crashing
    const wasInTrip = tripItems.has(id);
    setTripItems((prev) => {
      const next = new Set(prev);
      if (wasInTrip) next.delete(id); else next.add(id);
      return next;
    });
    const req = wasInTrip
      ? supabaseClient.from("trip_items").delete().eq("user_id", user.id).eq("attraction_id", id)
      : supabaseClient.from("trip_items").insert({ user_id: user.id, attraction_id: id });
    req.then(({ error }) => {
      if (!error) return;
      console.error(`[trip_items] ${wasInTrip ? "delete" : "insert"} failed:`, error.message);
      setTripItems((prev) => {
        const next = new Set(prev);
        if (wasInTrip) next.add(id); else next.delete(id);
        return next;
      });
      showToast(tr("Couldn't update trip") + ": " + (error.message || tr("Something went wrong. Please try again.")));
    });
  };

  const addComment = async (attractionId, name, text) => {
    if (!user) { setLoginOpen(true); return; }
    if (!supabaseClient) return; // backend unavailable — fail silently instead of crashing
    const trimmedText = text.trim();
    if (!trimmedText) return;
    const displayName = name.trim() || user.name || "Anonymous traveller";
    const { data, error } = await supabaseClient
      .from("reviews")
      .insert({ user_id: user.id, attraction_id: attractionId, name: displayName, text: trimmedText })
      .select()
      .single();
    if (error || !data) return;
    setComments((prev) => {
      const existing = prev[attractionId] || [];
      const entry = { id: data.id, name: data.name, text: data.text, userId: data.user_id };
      return { ...prev, [attractionId]: [...existing, entry] };
    });
  };

  const removeComment = async (attractionId, commentId) => {
    if (!user) return;
    if (!supabaseClient) return; // backend unavailable — fail silently instead of crashing
    const { error } = await supabaseClient.from("reviews").delete().eq("id", commentId).eq("user_id", user.id);
    if (error) return;
    setComments((prev) => ({
      ...prev,
      [attractionId]: (prev[attractionId] || []).filter((c) => c.id !== commentId),
    }));
  };

  const submitRating = async (attractionId, { place, hotel, food }) => {
    if (!user) { setLoginOpen(true); return; }
    if (!supabaseClient) return; // backend unavailable — fail silently instead of crashing
    const { data, error } = await supabaseClient
      .from("ratings")
      .upsert(
        { user_id: user.id, attraction_id: attractionId, place, hotel, food, updated_at: new Date().toISOString() },
        { onConflict: "user_id,attraction_id" }
      )
      .select()
      .single();
    if (error || !data) return;
    setRatings((prev) => {
      const existing = (prev[attractionId] || []).filter((r) => r.userId !== user.id);
      const entry = { id: `${data.user_id}:${attractionId}`, place: data.place, hotel: data.hotel, food: data.food, userId: data.user_id };
      return { ...prev, [attractionId]: [...existing, entry] };
    });
  };

  // Load this person's private favorites & trip list whenever they sign in,
  // and clear local state again on sign-out.
  useEffect(() => {
    if (!supabaseClient) return;
    if (!user) { setFavs(new Set()); setTripItems(new Set()); return; }
    let alive = true;
    (async () => {
      const [{ data: favRows }, { data: tripRows }] = await Promise.all([
        supabaseClient.from("favorites").select("attraction_id").eq("user_id", user.id),
        supabaseClient.from("trip_items").select("attraction_id").eq("user_id", user.id),
      ]);
      if (!alive) return;
      setFavs(new Set((favRows || []).map((r) => r.attraction_id)));
      setTripItems(new Set((tripRows || []).map((r) => r.attraction_id)));
    })();
    return () => { alive = false; };
  }, [user]);

  // Reviews and ratings are public per-attraction data — fetch fresh whenever
  // an attraction page is opened, rather than preloading everything up front.
  useEffect(() => {
    if (!supabaseClient) return;
    const attractionId = view.page === "attraction" ? view.attractionId : view.page === "webAttraction" ? `web:${view.title}` : null;
    if (!attractionId) return;
    let alive = true;
    (async () => {
      const [{ data: reviewRows }, { data: ratingRows }] = await Promise.all([
        supabaseClient.from("reviews").select("id,user_id,name,text").eq("attraction_id", attractionId).order("created_at", { ascending: true }),
        supabaseClient.from("ratings").select("user_id,place,hotel,food").eq("attraction_id", attractionId),
      ]);
      if (!alive) return;
      setComments((prev) => ({ ...prev, [attractionId]: (reviewRows || []).map((r) => ({ id: r.id, name: r.name, text: r.text, userId: r.user_id })) }));
      setRatings((prev) => ({ ...prev, [attractionId]: (ratingRows || []).map((r) => ({ id: `${r.user_id}:${attractionId}`, place: r.place, hotel: r.hotel, food: r.food, userId: r.user_id })) }));
    })();
    return () => { alive = false; };
  }, [view.page, view.attractionId, view.title]);

  // Restore an existing Supabase session on load, and keep `user` in sync
  // with sign-in / sign-out / token-refresh events from any tab.
  useEffect(() => {
    if (!supabaseClient) { setAuthLoading(false); return; }
    const toUser = (session) => {
      if (!session || !session.user) return null;
      const u = session.user;
      return { id: u.id, email: u.email, name: (u.user_metadata && u.user_metadata.name) || u.email };
    };
    supabaseClient.auth.getSession().then(({ data }) => {
      setUser(toUser(data.session));
      setAuthLoading(false);
    });
    const { data: sub } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      setUser(toUser(session));
    });
    return () => sub && sub.subscription && sub.subscription.unsubscribe();
  }, []);

  const friendlyAuthError = (message) => {
    const m = (message || "").toLowerCase();
    if (m.includes("already registered") || m.includes("already exists")) return tr("An account with this email already exists.");
    if (m.includes("invalid login credentials")) return tr("No account found with that email and password.");
    return message || tr("Something went wrong. Please try again.");
  };

  const handleSignUp = async ({ name, email, password }) => {
    if (!supabaseClient) return { error: tr("Something went wrong. Please try again.") };
    const { data, error } = await supabaseClient.auth.signUp({
      email, password, options: { data: { name } },
    });
    if (error) return { error: friendlyAuthError(error.message) };
    // With email confirmation enabled, Supabase returns a user but no active session yet.
    if (!data.session) return { needsConfirmation: true };
    setLoginOpen(false);
    return { ok: true };
  };

  const handleSignIn = async ({ email, password }) => {
    if (!supabaseClient) return { error: tr("Something went wrong. Please try again.") };
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) return { error: friendlyAuthError(error.message) };
    setLoginOpen(false);
    return { ok: true };
  };

  const handleLogout = () => { if (supabaseClient) supabaseClient.auth.signOut(); setUser(null); };

  const openState = (id) => { setView({ page: "state", stateId: id }); setSearchOpen(false); window.scrollTo({ top: 0 }); };
  const openAttraction = (stateId, attractionId) => { setView({ page: "attraction", stateId, attractionId }); setSearchOpen(false); window.scrollTo({ top: 0 }); };
  const openWebAttraction = (title) => { setView({ page: "webAttraction", title }); setSearchOpen(false); window.scrollTo({ top: 0 }); };
  const goHome = () => { setView({ page: "home" }); setNavOpen(false); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); };

  const scrollToSection = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  };

  // Central nav handler used by both the desktop nav and the mobile menu —
  // this is what makes Heritage / Culture / Map / Plan Trip actually work.
  const handleNavClick = (label) => {
    setNavOpen(false);
    setSearchOpen(false);
    if (label === "Home") { goHome(); return; }
    const targetId = SECTION_MAP[label];
    if (view.page !== "home") {
      setView({ page: "home" });
      setPendingScroll(targetId);
    } else {
      scrollToSection(targetId);
    }
  };

  // If we had to navigate home first (from a state/attraction page), scroll to
  // the requested section once Home has actually rendered.
  useEffect(() => {
    if (view.page === "home" && pendingScroll) {
      const id = pendingScroll;
      setPendingScroll(null);
      requestAnimationFrame(() => requestAnimationFrame(() => scrollToSection(id)));
    }
  }, [view.page, pendingScroll]);

  // Lightweight scroll-spy so the nav shows which section you're actually looking at.
  useEffect(() => {
    if (view.page !== "home" || loading) return;
    const ids = ["sec-culture", "sec-explore", "sec-heritage", "sec-plan", "sec-ai-guide"];
    const els = ids.map((id) => document.getElementById(id)).filter(Boolean);
    if (!els.length) return;
    const observer = new IntersectionObserver(
      (entries) => {
        const visible = entries.filter((e) => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio);
        if (visible.length) setActiveSection(visible[0].target.id);
        else if (window.scrollY < 120) setActiveSection(null);
      },
      { rootMargin: "-90px 0px -55% 0px", threshold: [0, 0.25, 0.5, 0.75, 1] }
    );
    els.forEach((el) => observer.observe(el));
    return () => observer.disconnect();
  }, [view.page, loading]);

  const currentState = view.stateId ? STATES.find((s) => s.id === view.stateId) : null;
  const currentAttraction = view.attractionId ? currentState?.attractions.find((a) => a.id === view.attractionId) : null;
  const attractionAccent = currentAttraction ? (CATEGORY_META[currentAttraction.category]?.color) : null;

  return (
    <HotelRatesContext.Provider value={{ creds: hotelRateCreds, setCreds: setHotelRateCreds, liveEnabled: liveRatesEnabled, setLiveEnabled: setLiveRatesEnabled }}>
    <LangContext.Provider value={{ lang, tr }}>
    <div className={reduceMotion ? "reduce-motion" : ""} style={{ minHeight: "100vh", background: t.bg, color: t.text, position: "relative", transition: "background .35s ease, color .35s ease" }}>
      <Fonts />
      <Backdrop t={t} accent={view.page === "attraction" ? attractionAccent : null} />
      {loading && <LoadingScreen t={t} />}

      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 200, background: "#7c2d12", color: "#fff5eb", padding: "10px 18px", borderRadius: 10, fontSize: 13, maxWidth: "min(480px,90vw)", textAlign: "center", boxShadow: "0 8px 24px rgba(0,0,0,.35)", display: "flex", alignItems: "center", gap: 12 }} className="font-body">
          <span>{toast.message}</span>
          <button onClick={() => setToast(null)} style={{ background: "#ffffff22", border: "none", color: "#fff", borderRadius: 6, padding: "3px 8px", cursor: "pointer", fontSize: 12, flexShrink: 0 }}>
            {tr("Dismiss")}
          </button>
        </div>
      )}

      {isFileProtocol && !fileProtoBannerDismissed && (
        <div style={{ position: "sticky", top: 0, zIndex: 51, background: "#7c2d12", color: "#fff5eb", padding: "10px 20px", fontSize: 13, textAlign: "center", display: "flex", alignItems: "center", justifyContent: "center", gap: 14, flexWrap: "wrap" }} className="font-body">
          <span>
            <b>Signing in, favorites, comments and ratings need this page hosted online</b> — it's currently open as a local file
            (<code style={{ background: "#00000030", padding: "1px 5px", borderRadius: 4 }}>file://</code>), and those features rely on
            an external login/database service that requires a real web address. Host this file (e.g. run <code style={{ background: "#00000030", padding: "1px 5px", borderRadius: 4 }}>python -m http.server</code> in
            its folder and open <code style={{ background: "#00000030", padding: "1px 5px", borderRadius: 4 }}>http://localhost:8000</code>, or upload it to any static
            host) to enable those. Photos work either way.
          </span>
          <button onClick={() => setFileProtoBannerDismissed(true)} style={{ background: "#ffffff22", border: "none", color: "#fff", borderRadius: 6, padding: "4px 10px", cursor: "pointer", fontSize: 12, flexShrink: 0 }}>
            Dismiss
          </button>
        </div>
      )}

      {/* NAVBAR */}
      <header style={{ position: "sticky", top: 0, zIndex: 50, background: `${t.bg}E6`, backdropFilter: "blur(10px)", borderBottom: `1px solid ${t.border}` }}>
        <div style={{ maxWidth: 1180, margin: "0 auto", padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div onClick={goHome} style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
            <span style={{ fontSize: 20 }}>🇮🇳</span>
            <span className="font-display" style={{ color: t.text, fontSize: 18 }}>{tr("Incredible India")}</span>
          </div>
          <nav className="font-utility" style={{ display: "flex", gap: 26, fontSize: 12.5 }}>
            {!isNarrow && NAV_ITEMS.map((l) => {
              const sectionId = SECTION_MAP[l];
              const isActive = view.page === "home" && (l === "Home" ? !activeSection : activeSection === sectionId);
              return (
                <span key={l} onClick={() => handleNavClick(l)} style={{ color: isActive ? t.saffron : t.textDim, cursor: "pointer", transition: "color .2s", position: "relative", paddingBottom: 4, borderBottom: isActive ? `1.5px solid ${t.saffron}` : "1.5px solid transparent" }}>
                  {tr(l).toUpperCase()}
                </span>
              );
            })}
          </nav>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick={() => setLang((l) => (l === "en" ? "hi" : "en"))} title="Language / भाषा" className="font-utility"
              style={{ height: 36, minWidth: 36, padding: "0 10px", borderRadius: 18, border: `1px solid ${t.border}`, background: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: t.textDim }}>
              {lang === "en" ? "हिं" : "EN"}
            </button>
            <button onClick={() => setSearchOpen(true)} title={tr("Search")} style={{ width: 36, height: 36, borderRadius: "50%", border: `1px solid ${t.border}`, background: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}><Search size={15} color={t.textDim} /></button>
            <button onClick={() => setFavOpen(true)} title={tr("Favorites")} style={{ width: 36, height: 36, borderRadius: "50%", border: `1px solid ${t.border}`, background: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
              <Heart size={15} color={t.textDim} />
              {favs.size > 0 && <span style={{ position: "absolute", top: -3, right: -3, background: t.saffron, color: "#1a0f00", fontSize: 9, borderRadius: 999, minWidth: 15, height: 15, display: "flex", alignItems: "center", justifyContent: "center" }}>{favs.size}</span>}
            </button>
            <button onClick={() => setTripOpen(true)} title={tr("My Trip")} style={{ width: 36, height: 36, borderRadius: "50%", border: `1px solid ${t.border}`, background: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
              <Briefcase size={15} color={t.textDim} />
              {tripItems.size > 0 && <span style={{ position: "absolute", top: -3, right: -3, background: t.saffron, color: "#1a0f00", fontSize: 9, borderRadius: 999, minWidth: 15, height: 15, display: "flex", alignItems: "center", justifyContent: "center" }}>{tripItems.size}</span>}
            </button>
            <button onClick={() => setDark((d) => !d)} title={tr("Toggle theme")} style={{ width: 36, height: 36, borderRadius: "50%", border: `1px solid ${t.border}`, background: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
              {dark ? <Sun size={15} color={t.textDim} /> : <Moon size={15} color={t.textDim} />}
            </button>
            <AccentPicker accentKey={accentKey} setAccentKey={setAccentKey} t={t} />
            {authLoading ? (
              <div style={{ width: 36, height: 36 }} />
            ) : user ? (
              <AccountMenu t={t} user={user} onLogout={handleLogout} />
            ) : (
              <button onClick={() => setLoginOpen(true)} title={tr("Login")} style={{ width: 36, height: 36, borderRadius: "50%", border: `1px solid ${t.border}`, background: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <User size={15} color={t.textDim} />
              </button>
            )}
            {isNarrow && (
              <button onClick={() => setNavOpen((v) => !v)} title="Menu" style={{ width: 36, height: 36, borderRadius: "50%", border: `1px solid ${t.border}`, background: navOpen ? `${t.saffron}1f` : "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                {navOpen ? <X size={16} color={t.saffron} /> : <Menu size={16} color={t.textDim} />}
              </button>
            )}
          </div>
        </div>
        {isNarrow && navOpen && (
          <div className="fade-up font-utility" style={{ borderTop: `1px solid ${t.border}`, padding: "6px 20px 14px", display: "flex", flexDirection: "column" }}>
            {NAV_ITEMS.map((l) => {
              const sectionId = SECTION_MAP[l];
              const isActive = view.page === "home" && (l === "Home" ? !activeSection : activeSection === sectionId);
              return (
                <span key={l} onClick={() => handleNavClick(l)} style={{ padding: "12px 2px", fontSize: 12.5, color: isActive ? t.saffron : t.textDim, cursor: "pointer", borderBottom: `1px solid ${t.border}` }}>
                  {tr(l).toUpperCase()}
                </span>
              );
            })}
          </div>
        )}
      </header>

      <main style={{ maxWidth: 1180, margin: "0 auto", padding: "0 20px 60px", position: "relative" }}>
        {view.page === "home" && (
          <Home t={t} dark={dark} query={query} setQuery={setQuery} activeRegion={activeRegion} setActiveRegion={setActiveRegion}
            activeCategory={activeCategory} setActiveCategory={setActiveCategory} onOpenState={openState} onOpenAttraction={openAttraction} onOpenWebAttraction={openWebAttraction}
            favs={favs} toggleFav={toggleFav} />
        )}
        {view.page === "state" && currentState && (
          <StatePage state={currentState} t={t} favs={favs} toggleFav={toggleFav} onOpenAttraction={(aid) => openAttraction(currentState.id, aid)} onBack={goHome} />
        )}
        {view.page === "attraction" && currentAttraction && currentState && (
          <AttractionDetail attraction={currentAttraction} state={currentState} t={t} dark={dark} fav={favs.has(currentAttraction.id)} toggleFav={toggleFav}
            inTrip={tripItems.has(currentAttraction.id)} toggleTrip={toggleTrip}
            onBack={() => openState(currentState.id)}
            comments={comments[currentAttraction.id] || []} onAddComment={(name, text) => addComment(currentAttraction.id, name, text)}
            onRemoveComment={(commentId) => removeComment(currentAttraction.id, commentId)}
            ratings={ratings[currentAttraction.id] || []} onSubmitRating={(r) => submitRating(currentAttraction.id, r)}
            currentUserId={user?.id} />
        )}
        {view.page === "webAttraction" && view.title && (
          <WebAttractionPage
            title={view.title} t={t} dark={dark}
            favs={favs} toggleFav={toggleFav}
            tripItems={tripItems} toggleTrip={toggleTrip}
            comments={comments[`web:${view.title}`] || []}
            onAddComment={(name, text) => addComment(`web:${view.title}`, name, text)}
            onRemoveComment={(commentId) => removeComment(`web:${view.title}`, commentId)}
            ratings={ratings[`web:${view.title}`] || []}
            onSubmitRating={(r) => submitRating(`web:${view.title}`, r)}
            onOpenState={openState} onGoHome={goHome}
            currentUserId={user?.id}
          />
        )}
      </main>

      {searchOpen && <SearchOverlay t={t} onClose={() => setSearchOpen(false)} onOpenState={openState} onOpenAttraction={openAttraction} onOpenWebAttraction={openWebAttraction} />}
      {favOpen && <FavoritesPanel t={t} favs={favs} toggleFav={toggleFav} onClose={() => setFavOpen(false)} onOpenAttraction={openAttraction} />}
      {tripOpen && <TripPanel t={t} tripItems={tripItems} onClose={() => setTripOpen(false)} onOpenAttraction={openAttraction} />}
      {loginOpen && <LoginPanel t={t} onClose={() => setLoginOpen(false)} onSignIn={handleSignIn} onSignUp={handleSignUp} />}
      <GeminiChatWidget t={t} dark={dark} />

      {/* FOOTER */}
      <footer style={{ borderTop: `1px solid ${t.border}`, padding: "36px 20px", textAlign: "center", position: "relative", zIndex: 1, background: t.bg }}>
        <div className="font-display" style={{ color: t.text, fontSize: 16, marginBottom: 6 }}>{tr("Incredible India — Culture & Heritage Explorer")}</div>
        <div className="font-body" style={{ color: t.textDim, fontSize: 12.5, marginBottom: 14 }}>{tr("Made to celebrate India's incredible cultural diversity.")}</div>
        <div className="font-utility" style={{ display: "flex", gap: 16, justifyContent: "center", flexWrap: "wrap", fontSize: 11, color: t.textDim, marginBottom: 16 }}>
          {/* BUGFIX: these used to be plain <span>s with cursor:pointer but no onClick at
              all — they looked clickable but did nothing. Ones with a real matching
              section now actually navigate there; the rest (no dedicated page exists)
              no longer fake a pointer cursor, so the UI doesn't promise a click it can't
              deliver. */}
          {[
            { label: "About", section: null },
            { label: "States", section: "sec-explore" },
            { label: "Heritage", section: "sec-heritage" },
            { label: "Culture", section: "sec-culture" },
            { label: "Map", section: "sec-explore" },
            { label: "Sources", section: null },
            { label: "Privacy", section: null },
          ].map(({ label, section }) => (
            <span
              key={label}
              onClick={section ? () => handleNavClick(label === "States" || label === "Map" ? "Explore India" : label) : undefined}
              style={{ cursor: section ? "pointer" : "default" }}
            >
              {tr(label).toUpperCase()}
            </span>
          ))}
        </div>
        <label className="font-body" style={{ fontSize: 11.5, color: t.textDim, display: "inline-flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
          <input type="checkbox" checked={reduceMotion} onChange={(e) => setReduceMotion(e.target.checked)} /> {tr("Reduce animations")}
        </label>
      </footer>
    </div>
    </LangContext.Provider>
    </HotelRatesContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
