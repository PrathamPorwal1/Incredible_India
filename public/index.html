      </div>
      <div className="font-body" style={{ fontSize: 12, color: t.textDim, margin: "10px 0 12px", display: "flex", alignItems: "center", gap: 6 }}>
        <MapPin size={13} color={t.saffron} /> {lat.toFixed(4)}°N, {lng.toFixed(4)}°E · {attraction.city}, {state.name}
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <a href={gmapsLink} target="_blank" rel="noopener noreferrer" className="font-utility"
          style={{ textDecoration: "none", fontSize: 11.5, color: "#1a0f00", background: t.saffron, padding: "8px 14px", borderRadius: 999, display: "inline-flex", alignItems: "center", gap: 6 }}>
          <Compass size={13} /> GET DIRECTIONS
        </a>
        <a href={osmLink} target="_blank" rel="noopener noreferrer" className="font-utility"
          style={{ textDecoration: "none", fontSize: 11.5, color: t.text, border: `1px solid ${t.border}`, padding: "8px 14px", borderRadius: 999, display: "inline-flex", alignItems: "center", gap: 6 }}>
          <MapPin size={13} /> OPEN FULL MAP
        </a>
      </div>

      {/* Gemini "nearby places" panel — same recommendations plotted as the pins above. */}
      <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${t.border}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 10 }}>
          <Sparkles size={13} color={t.gold} />
          <span className="font-utility" style={{ fontSize: 11.5, color: t.gold, letterSpacing: "0.04em" }}>{tr("GEMINI RECOMMENDS NEARBY")}</span>
          {nearbyLoading && <span className="gemini-thinking-inline" style={{ color: t.textDim }}><span /><span /><span /></span>}
        </div>

        {nearbyLoading && (
          <div className="font-body" style={{ fontSize: 12, color: t.textDim }}>{tr("Finding nearby places worth a visit…")}</div>
        )}
        {!nearbyLoading && nearbyError && (
          <div className="font-body" style={{ fontSize: 12, color: t.textDim }}>{tr("Couldn't fetch nearby recommendations right now — try again shortly.")}</div>
        )}
        {!nearbyLoading && !nearbyError && (
          <div className="gemini-response-fadein" style={{ display: "flex", flexDirection: "column", gap: 7 }}>
            {nearbyPositioned.map((p, i) => {
              const meta = nearbyIconFor(p.category);
              const IconComp = meta.icon;
              const isActive = activeIdx === i;
              return (
                <div
                  key={i}
                  onClick={() => setActiveIdx(isActive ? null : i)}
                  style={{
                    display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", borderRadius: 10, cursor: "pointer",
                    background: isActive ? `${t.saffron}14` : t.panel, border: `1px solid ${isActive ? t.saffron : t.border}`,
                    transition: "background .15s ease, border-color .15s ease",

                >
                  <div style={{ width: 26, height: 26, borderRadius: "50%", background: meta.color, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <IconComp size={13} color="#fff" />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="font-body" style={{ fontSize: 12.5, color: t.text, fontWeight: 600 }}>{p.name}</div>
                    {p.note && <div className="font-body" style={{ fontSize: 11, color: t.textDim, marginTop: 1 }}>{p.note}</div>}
                  </div>
                  {p.category && (
                    <span className="font-utility" style={{ fontSize: 9.5, color: t.textDim, border: `1px solid ${t.border}`, borderRadius: 999, padding: "3px 8px", flexShrink: 0 }}>
                      {p.category}
                    </span>
                  )}
                </div>
              );
            })}
          </div>
        )}
        <div className="font-body" style={{ fontSize: 9.5, color: t.textDim, marginTop: 10, opacity: 0.7 }}>
          {tr("AI-generated · always confirm details before heading out.")}
        </div>
      </div>
    </div>
  );
}

/* ============================== WEB ATTRACTION PAGE ==============================
   Renders a search result that isn't in our curated dataset through the exact
   same detail-page layout as every other place, backed by a live Wikipedia
   summary fetched on the fly.
=========================================================================== */
function WebAttractionPage({ title, t, dark, favs, toggleFav, tripItems, toggleTrip, comments, onAddComment, onRemoveComment, ratings, onSubmitRating, onOpenState, onGoHome, currentUserId }) {
  const { tr } = useLang();
  const [summary, setSummary] = useState(null);
  const [loading, setLoading] = useState(true);
  const [notFound, setNotFound] = useState(false);

  useEffect(() => {
    let alive = true;
    setLoading(true);
    setNotFound(false);
    fetchWikiSummary(title).then((s) => {
      if (!alive) return;
      if (!s) setNotFound(true);
      setSummary(s);
      setLoading(false);
    });
    return () => { alive = false; };
  }, [title]);

  if (loading) {
    return (
      <div className="fade-up font-body" style={{ textAlign: "center", padding: "100px 20px", color: t.textDim, fontSize: 14 }}>
        {tr("Looking up")} “{title}”…
      </div>
    );
  }

  const { state, attraction } = buildWebAttraction(title, summary);
  const handleBack = () => {
    if (state.id !== "india" && STATES.some((s) => s.id === state.id)) onOpenState(state.id);
    else onGoHome();
  };

  return (
    <div>
      <div className="fade-up font-body" style={{
        display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8, padding: "10px 14px", borderRadius: 12,
        background: `${t.gold}14`, border: `1px solid ${t.gold}55`, color: t.textDim, fontSize: 12.5, marginBottom: 18,
      }}>
        <Sparkles size={14} color={t.gold} style={{ flexShrink: 0 }} />
        <span>
          {notFound
            ? tr("We couldn't find a curated or web match for this place.")
            : tr("Generated live from a public web search — not yet part of our curated collection.")}
        </span>
        <a href={attraction.pageUrl} target="_blank" rel="noopener noreferrer" className="font-utility" style={{ color: t.gold, marginLeft: "auto", flexShrink: 0, textDecoration: "none", fontSize: 11.5 }}>
          {tr("VIEW ON WIKIPEDIA ↗")}
        </a>
      </div>
      <AttractionDetail
        attraction={attraction} state={state} t={t} dark={dark}
        fav={favs.has(attraction.id)} toggleFav={toggleFav}
        inTrip={tripItems.has(attraction.id)} toggleTrip={toggleTrip}
        onBack={handleBack}
        comments={comments} onAddComment={onAddComment} onRemoveComment={onRemoveComment}
        ratings={ratings} onSubmitRating={onSubmitRating}
        currentUserId={currentUserId}
      />
    </div>
  );
}

/* ============================== ATTRACTION DETAIL ============================== */
/* ============================== 3D MODEL VIEWER ==============================
   A real, interactive WebGL model (via three.js) for each attraction's detail
   page — a stylised low-poly form built from its category (fort, temple,
   mosque, palace, monument, museum, church, lake) rather than a photorealistic
   scan, since no live 3D-scan dataset exists for these sites. Drag to rotate,
   auto-rotates when idle, and is clearly labelled as illustrative.
=========================================================================== */
/* ---- seeded RNG so each individual place gets its own stable "fingerprint",
   instead of every attraction in a category sharing one identical shape ---- */
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function tintColor(hex, amt) {
  const r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
  const blend = (c) => Math.max(0, Math.min(255, Math.round(amt >= 0 ? c + (255 - c) * amt : c + c * amt)));
  return (blend(r) << 16) | (blend(g) << 8) | blend(b);
}

function buildMonument(group, category, accentHex, seedKey) {
  const rand = mulberry32(hashSeed(String(seedKey || category || "x")));
  const between = (a, b) => a + rand() * (b - a);
  const int = (a, b) => Math.floor(between(a, b + 1));
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];
  const flip = (p = 0.5) => rand() < p;

  const stoneColors = {
    Fort: 0xb5875a, Palace: 0xdcc79c, Temple: 0xc97b4a, Mosque: 0xefe7d4,
    Church: 0xd0c8b9, Monument: 0xf3ede1, Museum: 0xd0c8b9, Lake: 0x2e5266,
  };
  const base = tintColor(stoneColors[category] ?? 0xd0c8b9, between(-0.14, 0.14));
  const tintedAccent = tintColor(accentHex, between(-0.12, 0.12));
  const bodyMat = new THREE.MeshStandardMaterial({ color: base, roughness: 0.72 + rand() * 0.2, metalness: 0.02 + rand() * 0.06 });
  const accentMat = new THREE.MeshStandardMaterial({ color: tintedAccent, roughness: 0.3 + rand() * 0.15, metalness: 0.25 + rand() * 0.15 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x2a2118, roughness: 0.9 });
  const rockMat = new THREE.MeshStandardMaterial({ color: tintColor(base, -0.1), roughness: 0.95 });

  const addBox = (w, h, d, x, y, z, mat, ry) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || bodyMat); m.position.set(x, y, z); if (ry) m.rotation.y = ry; group.add(m); return m; };
  const addCyl = (rt, rb, h, x, y, z, mat, seg) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 16), mat || bodyMat); m.position.set(x, y, z); group.add(m); return m; };
  const addCone = (r, h, x, y, z, mat, seg) => { const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg || 16), mat || accentMat); m.position.set(x, y, z); group.add(m); return m; };
  const addDome = (r, x, y, z, mat) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 14, 0, Math.PI * 2, 0, Math.PI / 2), mat || accentMat); m.position.set(x, y, z); group.add(m); return m; };
  const addTorus = (r, tube, x, y, z, mat, rx) => { const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 28), mat || accentMat); m.position.set(x, y, z); m.rotation.x = rx ?? Math.PI / 2; group.add(m); return m; };

  /* ---- bespoke silhouettes for the handful of sites people would recognise
     on sight, so the most iconic landmarks don't fall back to a generic shape ---- */
  const bespoke = {
    "taj-mahal": () => {
      const poolMat = new THREE.MeshStandardMaterial({ color: 0x3f6f86, roughness: 0.12, metalness: 0.35 });
      const pathMat = new THREE.MeshStandardMaterial({ color: 0xcfc6ac, roughness: 0.85 });
      const sandstoneMat = new THREE.MeshStandardMaterial({ color: 0xaa5f42, roughness: 0.85 });

      // charbagh cross-axis paths + reflecting pool
      addBox(0.9, 0.03, 6.4, 0, 0.02, 3.4, pathMat);
      addBox(6.4, 0.03, 0.9, 0, 0.02, 3.4, pathMat);
      const pool = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.05, 1.2), poolMat);
      pool.position.set(0, 0.03, 3.4); group.add(pool);

      // raised marble plinth with corner finials
      addBox(4.8, 0.4, 4.8, 0, 0.2, 0, new THREE.MeshStandardMaterial({ color: 0xf3ede1, roughness: 0.7 }));
      [[-2.3, -2.3], [2.3, -2.3], [-2.3, 2.3], [2.3, 2.3]].forEach(([x, z]) => addCone(0.08, 0.3, x, 0.55, z, accentMat, 6));

      // main mausoleum with a recessed iwan arch on each face

  if (seedKey && bespoke[seedKey]) { bespoke[seedKey](); return; }

  switch (category) {
    case "Fort": {
      const w = between(4.0, 5.2), h = between(1.3, 1.9);
      addBox(w, h, w, 0, h / 2, 0);
      const half = w / 2 - 0.35;

      if (flip(0.5)) { addCyl(0.6, 0.7, towerH * 1.15, 0, (towerH * 1.15) / 2, 0, accentMat); addCone(0.8, roofH, 0, towerH * 1.15 + roofH / 2, 0, accentMat); }

      for (let i = -crenels; i <= crenels; i++) {
        addBox(0.3, 0.34, 0.3, (i * w) / (crenels * 2.4), h + 0.17, half + 0.16, darkMat);

    case "Palace": {
      const w = between(3.6, 4.8), d = between(2.4, 3.4), h = between(1.5, 2.1);

      addDome(domeR, 0, h + 0.45 + domeR * 0.55, 0);
      const wingDomes = pick([0, 2, 4]);
      for (let i = 0; i < wingDomes; i++) {
        const a = (i / wingDomes) * Math.PI * 2;
        const x = Math.cos(a) * (w / 2 - 0.5), z = Math.sin(a) * (d / 2 - 0.5);
        addCyl(0.45, 0.45, 0.16, x, h - 0.05, z, accentMat, 18);
        addDome(0.45, x, h + 0.2, z);
      }
      const pillars = int(2, 4);
      for (let i = 0; i < pillars; i++) addCyl(0.1, 0.1, h * 0.95, (i - (pillars - 1) / 2) * (w / pillars), h / 2, d / 2 + 0.25, bodyMat, 10);
      break;
    }
    case "Temple": {
      const tiers = int(3, 7);
      const shrink = between(0.32, 0.48);
      const startS = between(2.2, 2.9);
      const bandEvery = flip(0.5) ? 1 : 2;
      let y = 0.5, s = startS;
      const corners = flip(0.45);
      for (let i = 0; i < tiers; i++) {
        addBox(s, 0.5 + rand() * 0.15, s, 0, y, 0, i % bandEvery === 0 ? bodyMat : accentMat);
        if (corners && i < tiers - 2) {
          [[-s / 2, -s / 2], [s / 2, -s / 2], [-s / 2, s / 2], [s / 2, s / 2]].forEach(([cx, cz]) => addCone(0.22, 0.4, cx, y + 0.4, cz, accentMat, 6));
        }
        y += 0.55; s -= s * shrink * 0.6;
      }
      addCone(0.3 + rand() * 0.15, 0.7 + rand() * 0.4, 0, y + 0.1, 0, accentMat, pick([6, 8, 10]));
      addBox(startS + 0.6, 0.4, startS + 0.6, 0, 0.05, 0, darkMat);
      break;
    }
    case "Mosque": {
      const w = between(3.2, 4.2), d = between(2.6, 3.4);
      addBox(w, 1.5, d, 0, 0.75, 0);
      const domeR = between(0.95, 1.35);
      addDome(domeR, 0, 0.75 + domeR * 0.55, 0);
      if (flip(0.5)) { addDome(domeR * 0.55, -w / 4, 0.75 + domeR * 0.35, 0); addDome(domeR * 0.55, w / 4, 0.75 + domeR * 0.35, 0); }
      const minCount = pick([2, 2, 4]);
      const positions = minCount === 2
        ? [[-w / 2 + 0.35, -d / 2 + 0.3], [w / 2 - 0.35, -d / 2 + 0.3]]
        : [[-w / 2 + 0.3, -d / 2 + 0.25], [w / 2 - 0.3, -d / 2 + 0.25], [-w / 2 + 0.3, d / 2 - 0.25], [w / 2 - 0.3, d / 2 - 0.25]];
      const minH = between(2.2, 3.0);
      positions.forEach(([x, z]) => { addCyl(0.2, 0.25, minH, x, minH / 2, z); addDome(0.22, x, minH + 0.22, z); addCone(0.08, 0.3, x, minH + 0.5, z, accentMat, 8); });
      break;
    }
    case "Church": {
      addBox(3.6, 1.5, 3, 0, 0.75, 0);
      const spireH = between(1.3, 2.0), seg = pick([4, 6, 8]);
      addCone(1.0, spireH, 0, 1.5 + spireH / 2, 0, accentMat, seg);
      if (flip(0.55)) {
        addBox(0.9, 1.9, 0.9, 0, 2.45, -1.2, bodyMat);
        addCone(0.6, 1.0, 0, 3.9, -1.2, accentMat, seg);
      } else {
        [[-1.2, -1.2], [1.2, -1.2]].forEach(([x, z]) => { addBox(0.6, 1.6, 0.6, x, 2.3, z, bodyMat); addCone(0.42, 0.7, x, 3.45, z, accentMat, seg); });
      }
      break;
    }
    case "Monument": {
      const baseS = between(3.2, 4.0);
      addBox(baseS, 0.5, baseS, 0, 0.25, 0);
      addBox(baseS * 0.72, 1.6, baseS * 0.72, 0, 1.3, 0);
      const domeR = between(0.85, 1.25);
      addCyl(domeR, domeR, 0.6, 0, 2.4, 0, bodyMat, 24);
      addDome(domeR, 0, 2.4 + domeR * 0.6, 0);
      if (flip(0.65)) {
        const half = baseS * 0.42;
        [[-half, -half], [half, -half], [-half, half], [half, half]].forEach(([x, z]) => {
          addCyl(0.16, 0.2, 2.4, x, 1.2, z);
          addDome(0.2, x, 2.55, z);
        });
      } else {
        addCone(0.3, 0.9, 0, 2.4 + domeR * 1.3, 0, accentMat, 8);
      }
      break;
    }
    case "Museum": {
      const w = between(3.8, 4.8), pillars = int(5, 8);
      addBox(w, 1.7, 2.6, 0, 0.85, 0);
      for (let i = 0; i < pillars; i++) addCyl(0.16, 0.16, 1.7, (i - (pillars - 1) / 2) * (w / pillars), 0.85, 1.4, bodyMat, 10);
      addCone(w * 0.55, between(0.8, 1.2), 0, 2.2, 0, bodyMat, pick([3, 4]));
      break;
    }
    case "Lake": {
      const r = between(2.8, 3.8);
      const water = new THREE.Mesh(new THREE.CircleGeometry(r, 40), new THREE.MeshStandardMaterial({ color: base, roughness: 0.25, metalness: 0.15 }));
      water.rotation.x = -Math.PI / 2; water.position.y = 0.02; group.add(water);
      [r * 0.25, r * 0.45, r * 0.65].forEach((rr) => {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(rr, 0.018, 8, 48), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 }));
        ring.rotation.x = Math.PI / 2; ring.position.y = 0.03; group.add(ring);
      });
      addBox(0.9, 0.06, 0.9, 0, 0.4, 0);
      [[-0.35, -0.35], [0.35, -0.35], [-0.35, 0.35], [0.35, 0.35]].forEach(([x, z]) => addCyl(0.05, 0.05, 0.8, x, 0.8, z));
      addDome(0.6, 0, 1.35, 0);
      break;
    }
    default: {
      addBox(3.2, 1.4, 3.2, 0, 0.7, 0);
      addDome(1.0, 0, 1.45, 0);
    }
  }
}

function Monument3D({ category, accentColor, dark, height = 340, seedKey }) {
  const mountRef = useRef(null);

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount || typeof THREE === "undefined") return;

    const accentHex = parseInt((accentColor || "#D9B25C").replace("#", ""), 16) || 0xd9b25c;
    const width = mount.clientWidth || 300, h = mount.clientHeight || height;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, width / h, 0.1, 100);
    camera.position.set(0, 3.4, 9.2);
    camera.lookAt(0, 1.3, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    mount.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(dark ? 0x8fa0b5 : 0xffffff, dark ? 0.6 : 0.8));
    const key = new THREE.DirectionalLight(0xfff2d9, 1.15);
    key.position.set(5, 8, 6);
    scene.add(key);
    const rim = new THREE.DirectionalLight(accentHex, 0.55);
    rim.position.set(-6, 3, -5);
    scene.add(rim);

    const group = new THREE.Group();
    scene.add(group);
    buildMonument(group, category, accentHex, seedKey);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(6, 48),
      new THREE.MeshStandardMaterial({ color: dark ? 0x141c28 : 0xe9dfc6, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    scene.add(ground);

    let dragging = false, lastX = 0;
    const getX = (e) => (e.touches ? e.touches[0].clientX : e.clientX);
    const onDown = (e) => { dragging = true; lastX = getX(e); mount.style.cursor = "grabbing"; };
    const onMove = (e) => {
      if (!dragging) return;
      const x = getX(e);
      group.rotation.y += (x - lastX) * 0.008;
      lastX = x;
    };
    const onUp = () => { dragging = false; if (mount) mount.style.cursor = "grab"; };
    mount.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    mount.addEventListener("touchstart", onDown, { passive: true });
    window.addEventListener("touchmove", onMove, { passive: true });
    window.addEventListener("touchend", onUp);

    let raf, disposed = false;
    const animate = () => {
      if (disposed) return;
      if (!dragging) group.rotation.y += 0.0035;
      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    };
    animate();

    const onResize = () => {
      if (!mount) return;
      const w = mount.clientWidth, hh = mount.clientHeight;
      if (!w || !hh) return;
      camera.aspect = w / hh; camera.updateProjectionMatrix();
      renderer.setSize(w, hh);
    };
    window.addEventListener("resize", onResize);

    return () => {
      disposed = true;
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend", onUp);
      mount.removeEventListener("mousedown", onDown);
      mount.removeEventListener("touchstart", onDown);
      scene.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose());
          else obj.material.dispose();
        }
      });
      renderer.dispose();
      if (renderer.domElement && renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    };
  }, [category, accentColor, dark, seedKey]);

  return <div ref={mountRef} style={{ width: "100%", height: "100%", cursor: "grab" }} />;
}

   Outbound links to book a cab via Uber's web deep-link from the nearest railway
   station, airport or bus stand to a hotel near the attraction. No fare estimate
   is shown — Uber shows live pricing once the ride is opened in its own app.
=========================================================================== */
function parseKmFromDistance(distanceStr) {
  const m = (distanceStr || "").match(/[\d.]+/);
  return m ? parseFloat(m[0]) : null;
}
function uberBookingLink(dropoffLabel) {
  return `https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[formatted_address]=${encodeURIComponent(dropoffLabel)}`;
}

=========================================================================== */
const BUS_COMMISSION_RATE = 0.05; // 5%

function estimateBusFare(km) {

/* ============================== HOTEL PRICE CHART ==============================
   A simple horizontal bar chart comparing nightly rates across the hotels
   listed for an attraction. Each bar uses a live Amadeus rate when "live
   rates" is connected and a match is found (see useLiveHotelRate above),
   and otherwise falls back to the same illustrative tier price already
   used elsewhere on the card — so the chart always renders, and quietly
   upgrades bar-by-bar to real numbers as live lookups resolve.
=========================================================================== */
function HotelRateProbe({ h, city, setRates }) {
  const live = useLiveHotelRate(h.name, city);
  useEffect(() => {
    const price = live.status === "live" ? live.price : (HOTEL_TIER_INR[h.price] ?? HOTEL_TIER_INR["₹₹"]);
    const status = live.status === "live" ? "live" : (live.status === "loading" ? "loading" : "estimated");
    setRates((prev) => {
      const cur = prev[h.name];
      if (cur && cur.price === price && cur.status === status) return prev;
      return { ...prev, [h.name]: { price, status } };
    });
  }, [live.status, live.price, h.name]);
  return null;
}

function HotelPriceChart({ hotels, city, t, tr }) {
  const { liveEnabled } = useHotelRates();
  const [rates, setRates] = useState({});
  if (!hotels || !hotels.length) return null;
  const rows = hotels.map((h) => {
    const r = rates[h.name];
    return {
      name: h.name,
      price: r ? r.price : (HOTEL_TIER_INR[h.price] ?? HOTEL_TIER_INR["₹₹"]),
      status: r ? r.status : "estimated",
    };
  });
  const max = Math.max(...rows.map((r) => r.price), 1);
  return (
    <div style={{ marginBottom: 14 }}>
      {hotels.map((h, i) => <HotelRateProbe key={h.name || i} h={h} city={city} setRates={setRates} />)}
      <div className="font-utility" style={{ fontSize: 10.5, color: t.textDim, marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
        <TrendingDown size={12} color={t.saffron} /> {tr("NIGHTLY RATE COMPARISON")}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {rows.map((r) => (
          <div key={r.name} style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div className="font-body" style={{ width: 96, flexShrink: 0, fontSize: 10.5, color: t.textDim, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={r.name}>
              {r.name}
            </div>
            <div style={{ flex: 1, height: 14, borderRadius: 8, background: t.panel, overflow: "hidden" }}>
              <div style={{
                width: `${Math.max(4, (r.price / max) * 100)}%`, height: "100%", borderRadius: 8,
                background: r.status === "live" ? t.gold : t.saffron,
                opacity: r.status === "loading" ? 0.45 : 1,
                transition: "width 0.3s ease",
              }} />
            </div>
            <div className="font-utility" style={{ width: 78, flexShrink: 0, textAlign: "right", fontSize: 11, color: t.text }}>
              ₹{r.price.toLocaleString("en-IN")}{r.status === "live" && <span style={{ color: t.gold }}> ●</span>}
            </div>
          </div>
        ))}
      </div>
      <div className="font-body" style={{ fontSize: 10, color: t.textDim, marginTop: 8, lineHeight: 1.4 }}>
        {liveEnabled
          ? tr("Gold bars are live Amadeus rates; saffron bars are illustrative estimates where no live match was found.")
          : tr("Bars show illustrative estimated rates — connect live rates above for real-time Amadeus pricing.")}
      </div>
    </div>
  );
}

function HotelRow({ h, city, t, tr }) {
  const { liveEnabled } = useHotelRates();
  const live = useLiveHotelRate(h.name, city);
  return (
    <div style={{ padding: "10px 10px", borderRadius: 10, background: t.panel }}>

        <div style={{ textAlign: "right" }}>

              <div className="font-body" style={{ fontSize: 9.5, color: t.gold, marginTop: 1 }}>{tr("● LIVE")}</div>
            </>

  );
}

/* ============================== GEMINI HISTORY CARD ==============================
   One button, present on every heritage place page: asks Gemini to explain the
   place's history in very simple English, with an on-demand Hindi translation
   of that explanation. Reuses callGeminiForRoute (same endpoint/key/model as
   the rest of the app's Gemini features).
=========================================================================== */
function GeminiHistoryCard({ attraction, state, t }) {
  const { tr } = useLang();
  const [explanation, setExplanation] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(false);

  const [hindi, setHindi] = useState(null);
  const [hindiLoading, setHindiLoading] = useState(false);
  const [hindiError, setHindiError] = useState(false);
  const [showHindi, setShowHindi] = useState(false);
  // Guards against setting state after this card has unmounted (or the user
  // navigated to a different attraction) while a Gemini request was pending.
  const isMountedRef = useRef(true);
  useEffect(() => () => { isMountedRef.current = false; }, []);

  // Reset everything when navigating to a different place.
  useEffect(() => {
    setExplanation(null); setError(false); setLoading(false);
    setHindi(null); setHindiError(false); setHindiLoading(false); setShowHindi(false);
  }, [attraction.id]);

  const handleAsk = async () => {
    if (loading) return;
    setLoading(true); setError(false);
    setHindi(null); setShowHindi(false); setHindiError(false);
    try {
      const res = await fetchGeminiHistoryExplainer(attraction, state);
      if (!isMountedRef.current) return;
      if (res && res.explanation) setExplanation(res.explanation);
      else throw new Error("empty_explanation");
    } catch (e) {
      if (isMountedRef.current) setError(true);
    } finally {
      if (isMountedRef.current) setLoading(false);
    }
  };

  const handleTranslate = async () => {
    if (!explanation || hindiLoading) return;
    if (hindi) { setShowHindi(true); return; }
    setHindiLoading(true); setHindiError(false);
    try {
      const res = await translateHistoryToHindi(explanation);
      if (!isMountedRef.current) return;
      if (res && res.translation) { setHindi(res.translation); setShowHindi(true); }
      else throw new Error("empty_translation");
    } catch (e) {
      if (isMountedRef.current) setHindiError(true);
    } finally {
      if (isMountedRef.current) setHindiLoading(false);
    }
  };

  return (
    <div className="weather-glass" style={{ padding: 18, borderRadius: 20, background: `${t.panelAlt}cc`, border: `1px solid ${t.border}`, marginBottom: 22 }}>
      <div className="weather-glass-orb a" />
      <div className="weather-glass-orb b" />
      <div className="weather-glass-content">
        {!explanation && (
          <button className="weather-advice-btn" onClick={handleAsk} disabled={loading}>
            <Sparkles size={13} color="#fff" />
            {loading ? <>{tr("Thinking…")} <GeminiThinkingDots /></> : tr("Tell me the history with Gemini")}
          </button>
        )}

        {error && !loading && (
          <div className="font-body" style={{ marginTop: 10, fontSize: 12, color: t.textDim }}>
            {tr("Gemini couldn't fetch this right now — please try again.")}
          </div>
        )}

        {explanation && (
          <div className="weather-advice-panel">
            <div className="gemini-badge-row" style={{ justifyContent: "flex-start", marginBottom: 8 }}>
              <span className="gemini-badge">
                <span className="gemini-badge-dot" />
                ✨ {tr("Powered by Gemini AI")}
              </span>
            </div>
            <div className="font-utility" style={{ fontSize: 10, color: t.gold, letterSpacing: "0.06em", marginBottom: 6 }}>
              {showHindi && hindi ? tr("HISTORY · SIMPLE HINDI") : tr("HISTORY · SIMPLE ENGLISH")}
            </div>
            <div className="font-body" style={{ fontSize: 14.5, color: t.text, lineHeight: 1.75 }}>
              {showHindi && hindi ? hindi : explanation}
            </div>

            <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
              {!showHindi ? (
                <button onClick={handleTranslate} disabled={hindiLoading} className="font-utility"
                  style={{ padding: "7px 13px", borderRadius: 999, border: `1px solid ${t.border}`, background: "none", color: t.text, fontSize: 11.5, cursor: hindiLoading ? "default" : "pointer", opacity: hindiLoading ? 0.6 : 1 }}>
                  {hindiLoading ? <>{tr("Translating…")} <GeminiThinkingDots /></> : tr("Read in Hindi")}
                </button>
              ) : (
                <button onClick={() => setShowHindi(false)} className="font-utility"
                  style={{ padding: "7px 13px", borderRadius: 999, border: `1px solid ${t.border}`, background: "none", color: t.text, fontSize: 11.5, cursor: "pointer" }}>
                  {tr("Read in English")}
                </button>
              )}
              <button onClick={handleAsk} disabled={loading} className="font-utility"
                style={{ padding: "7px 13px", borderRadius: 999, border: `1px solid ${t.border}`, background: "none", color: t.textDim, fontSize: 11.5, cursor: "pointer", display: "flex", alignItems: "center", gap: 5 }}>
                <RotateCw size={11} /> {tr("Regenerate")}
              </button>
            </div>

            {hindiError && !hindiLoading && (
              <div className="font-body" style={{ marginTop: 8, fontSize: 11.5, color: t.textDim }}>
                {tr("Couldn't translate right now — please try again.")}
              </div>
            )}

            <div className="font-body" style={{ fontSize: 9.5, color: t.textDim, marginTop: 10, opacity: 0.7 }}>
              {tr("AI-generated summary · verify details against official sources for research.")}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================== RATINGS SECTION ============================== */
function StarPicker({ t, label, value, onChange }) {
  const { tr } = useLang();
  const [hover, setHover] = useState(0);
  const shown = hover || value;
  return (
    <div>
      <div className="font-body" style={{ fontSize: 12.5, color: t.textDim, marginBottom: 6 }}>{tr(label)}</div>
      <div style={{ display: "flex", gap: 4 }}>
        {[1, 2, 3, 4, 5].map((n) => (
          <button
            key={n}
            type="button"
            onClick={() => onChange(n)}
            onMouseEnter={() => setHover(n)}
            onMouseLeave={() => setHover(0)}
            style={{ background: "none", border: "none", cursor: "pointer", padding: 2 }}
            title={`${n} star${n > 1 ? "s" : ""}`}
          >
            <Star size={20} color={n <= shown ? t.gold : t.border} fillOverride={n <= shown ? t.gold : "none"} />
          </button>
        ))}
      </div>
    </div>
  );
}

function RatingSummaryRow({ t, label, icon: IconComp, values }) {
  const { tr } = useLang();
  const nums = values.filter((v) => v > 0);
  const avg = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "10px 0" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <IconComp size={15} color={t.saffron} />
        <div className="font-body" style={{ fontSize: 13.5, color: t.text }}>{tr(label)}</div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <div style={{ display: "flex", gap: 1 }}>
          {[1, 2, 3, 4, 5].map((n) => (
            <Star key={n} size={14} color={n <= Math.round(avg) ? t.gold : t.border} fillOverride={n <= Math.round(avg) ? t.gold : "none"} />
          ))}
        </div>
        <div className="font-utility" style={{ fontSize: 12, color: t.textDim }}>
          {nums.length ? `${avg.toFixed(1)} (${nums.length})` : tr("No ratings yet")}
        </div>
      </div>
    </div>
  );
}

function RatingsSection({ t, ratings, onSubmit }) {
  const { tr } = useLang();
  const [place, setPlace] = useState(0);
  const [hotel, setHotel] = useState(0);
  const [food, setFood] = useState(0);

  const safeRatings = ratings || [];
  const placeValues = safeRatings.map((r) => r.place || 0);
  const hotelValues = safeRatings.map((r) => r.hotel || 0);
  const foodValues = safeRatings.map((r) => r.food || 0);

  const canSubmit = place > 0 || hotel > 0 || food > 0;

  const submit = () => {
    if (!canSubmit) return;
    onSubmit({ place, hotel, food });
    setPlace(0); setHotel(0); setFood(0);
  };

  return (
    <div>
      <div style={{ padding: 18, borderRadius: 16, background: t.panelAlt, border: `1px solid ${t.border}`, marginBottom: 20 }}>
        <div className="font-utility" style={{ color: t.gold, fontSize: 12, marginBottom: 14 }}>{tr("RATE YOUR VISIT")}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 16, marginBottom: 16 }}>
          <StarPicker t={t} label="Place rating" value={place} onChange={setPlace} />
          <StarPicker t={t} label="Hotel rating" value={hotel} onChange={setHotel} />
          <StarPicker t={t} label="Food rating" value={food} onChange={setFood} />
        </div>
        <button onClick={submit} disabled={!canSubmit} className="font-utility" style={{
          padding: "9px 18px", borderRadius: 999, border: "none",
          background: canSubmit ? t.saffron : t.border, color: canSubmit ? "#1a0f00" : t.textDim,
          fontSize: 12, fontWeight: 700, cursor: canSubmit ? "pointer" : "not-allowed",
          display: "flex", alignItems: "center", gap: 6,
        }}>
          <Star size={13} /> {tr("SUBMIT RATING")}
        </button>
      </div>

      <div style={{ padding: 18, borderRadius: 16, background: t.panel, border: `1px solid ${t.border}` }}>
        <div className="font-utility" style={{ color: t.gold, fontSize: 12, marginBottom: 6 }}>{tr("AVERAGE RATINGS")}</div>
        <div style={{ display: "flex", flexDirection: "column" }}>
          <RatingSummaryRow t={t} label="Place" icon={Landmark} values={placeValues} />
          <div style={{ borderTop: `1px solid ${t.border}` }} />
          <RatingSummaryRow t={t} label="Hotel" icon={Hotel} values={hotelValues} />
          <div style={{ borderTop: `1px solid ${t.border}` }} />
          <RatingSummaryRow t={t} label="Food" icon={Utensils} values={foodValues} />
        </div>
      </div>
    </div>
  );
}

/* ============================== COMMENTS SECTION ============================== */
function CommentsSection({ t, comments, onAdd, onRemove, currentUserId }) {
  const { tr } = useLang();
  const [name, setName] = useState("");
  const [text, setText] = useState("");

  const submit = () => {
    if (!text.trim()) return;
    onAdd(name, text);
    setText("");
  };

  const inputStyle = {
    width: "100%", padding: "10px 14px", borderRadius: 10, border: `1px solid ${t.border}`,
    background: t.panelAlt, color: t.text, fontSize: 13.5, outline: "none", boxSizing: "border-box",
  };

  return (
    <div>
      <div style={{ padding: 18, borderRadius: 16, background: t.panelAlt, border: `1px solid ${t.border}`, marginBottom: 20 }}>
        <div className="font-utility" style={{ color: t.gold, fontSize: 12, marginBottom: 12 }}>{tr("LEAVE A COMMENT")}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input
            value={name}
            onChange={(e) => setName(e.target.value)}
            placeholder={tr("Your name (optional)")}
            className="font-body"
            style={inputStyle}
          />
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            placeholder={tr("Share a tip, memory, or question about this place...")}
            rows={3}
            className="font-body"
            style={{ ...inputStyle, resize: "vertical", fontFamily: "inherit" }}
          />
          <button onClick={submit} className="font-utility" style={{
            alignSelf: "flex-start", padding: "9px 18px", borderRadius: 999, border: "none",
            background: t.saffron, color: "#1a0f00", fontSize: 12, fontWeight: 700, cursor: "pointer",
            display: "flex", alignItems: "center", gap: 6,
          }}>
            <MessageCircle size={13} /> {tr("POST COMMENT")}
          </button>
        </div>
      </div>

      {(!comments || comments.length === 0) ? (
        <div className="font-body" style={{ color: t.textDim, fontSize: 13.5 }}>{tr("No comments yet — be the first to share your experience.")}</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {comments.map((c) => (

/* ============================== HERITAGE AT RISK — SECTION (filters + search) ==============================
   Self-contained: owns its own severity/region/search state and the
   quick-view modal, so nothing here reaches into Home's state. Filtering
   is pure client-side array filtering over the small HERITAGE_AT_RISK list
   — no network round-trip, so results update on every keystroke/click.
================================================================================================================*/
const RISK_SEVERITIES = ["All", "Critical", "High", "Moderate", "Low"];

function HeritageAtRiskSection({ t, onOpenAttraction }) {
  const { tr } = useLang();
  const [severity, setSeverity] = useState("All");
  const [region, setRegion] = useState("All");
  const [search, setSearch] = useState("");
  const [riskModalItem, setRiskModalItem] = useState(null);

  // Merge each risk entry with its full attraction record once, up front —
  // the same shape HeritageAtRiskCard / HeritageRiskModal already expect.
  // Items whose attractionId doesn't resolve in ALL_ATTRACTIONS are KEPT
  // (not dropped) with attraction: null, so the "needs attraction data"
  // gap is visible in the UI instead of the site silently vanishing.
  const enriched = useMemo(() => {
    return HERITAGE_AT_RISK.map((item) => {
      const a = ALL_ATTRACTIONS.find((x) => x.id === item.attractionId);
      if (a) {
        const st = STATES.find((s) => s.id === a.stateId);
        return { ...item, attraction: a, region: st ? st.region : null };
      }
      // No matching attraction in the existing dataset — surface it as a
      // pending entry rather than inventing an attraction id/page for it.
      return { ...item, attraction: null, region: item.pendingLabel?.region || null };
    });
  }, []);

  const missingList = useMemo(() => enriched.filter((item) => !item.attraction), [enriched]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return enriched.filter((item) => {
      if (severity !== "All" && item.severity !== severity) return false;
      if (region !== "All" && item.region !== region) return false;
      if (!q) return true;
      const a = item.attraction;
      const haystack = a
        ? [a.name, a.stateName, a.city, item.concern, a.category].filter(Boolean).join(" ").toLowerCase()
        : [item.pendingLabel?.name, item.pendingLabel?.state, item.concern].filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(q);
    });
  }, [enriched, severity, region, search]);

  const chipStyle = (active, color) => ({
    whiteSpace: "nowrap", padding: "8px 15px", borderRadius: 999, cursor: "pointer",
    border: `1px solid ${active ? color : t.border}`, background: active ? `${color}22` : "transparent",
    color: active ? color : t.textDim, fontSize: 12, display: "inline-flex", alignItems: "center", gap: 6,
    transition: "background .15s ease, border-color .15s ease, color .15s ease",
  });

  return (
    <section id="sec-heritage-risk" style={{ marginBottom: 46, scrollMarginTop: 90 }}>
      <div style={{ marginBottom: 18 }}>
        <div className="font-utility" style={{ fontSize: 11.5, color: t.saffron, marginBottom: 4 }}>{tr("PRESERVATION").toUpperCase()}</div>
        <div className="font-display" style={{ fontSize: "clamp(20px,3vw,28px)", color: t.text }}>🏛️ {tr("Heritage at Risk")}</div>
        <div className="font-body" style={{ fontSize: 13.5, color: t.textDim, marginTop: 6, maxWidth: 560 }}>{tr("Some stories need more than visitors. They need protection.")}</div>
      </div>

      {missingList.length > 0 && (
        <div style={{
          display: "flex", alignItems: "flex-start", gap: 10, padding: "12px 16px", borderRadius: 14,
          border: `1px solid ${t.gold}44`, background: `${t.gold}12`, marginBottom: 18,
        }}>
          <Info size={15} color={t.gold} style={{ flexShrink: 0, marginTop: 1 }} />
          <div className="font-body" style={{ fontSize: 12.5, color: t.textDim, lineHeight: 1.6 }}>
            <strong style={{ color: t.text }}>{missingList.length} {missingList.length === 1 ? tr("site needs") : tr("sites need")} {tr("attraction data added")}:</strong>{" "}
            {missingList.map((m, i) => (
              <span key={m.attractionId}>{m.pendingLabel?.name || m.attractionId}{i < missingList.length - 1 ? ", " : ""}</span>
            ))}
            {" "}{tr("— shown below with their preservation info, but their full attraction pages don't exist yet, so \"Explore Full Site\" is disabled for these until they're added to the attraction dataset.")}
          </div>
        </div>
      )}

      {/* Search */}
      <div style={{ position: "relative", maxWidth: 420, marginBottom: 16 }}>
        <Search size={15} color={t.textDim} style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)" }} />
        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder={tr("Search heritage sites...")}
          className="font-body"
          style={{
            width: "100%", padding: "10px 36px 10px 38px", borderRadius: 12, border: `1px solid ${t.border}`,
            background: t.panel, color: t.text, fontSize: 13, outline: "none", boxSizing: "border-box",
          }}
        />
        {search && (
          <button onClick={() => setSearch("")} aria-label={tr("Clear")} style={{
            position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)",
            background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center",
          }}><X size={14} color={t.textDim} /></button>
        )}
      </div>

      {/* Severity filter */}
      <div className="scrollbar-thin" style={{ display: "flex", gap: 8, marginBottom: 10, overflowX: "auto", paddingBottom: 4 }}>
        {RISK_SEVERITIES.map((sv) => {
          const meta = sv === "All" ? { emoji: "", color: t.gold } : SEVERITY_META[sv];
          return (
            <button key={sv} onClick={() => setSeverity(sv)} className="font-utility" style={chipStyle(severity === sv, meta.color)}>
              {meta.emoji && <span>{meta.emoji}</span>} {sv === "All" ? tr("All") : tr(sv)}
            </button>
          );
        })}
      </div>

      {/* Region filter */}
      <div className="scrollbar-thin" style={{ display: "flex", gap: 8, marginBottom: 20, overflowX: "auto", paddingBottom: 4 }}>
        {["All", ...REGIONS].map((r) => (
          <button key={r} onClick={() => setRegion(r)} className="font-utility" style={chipStyle(region === r, t.gold)}>
            {r === "All" ? tr("All Regions") : tr(r)}
          </button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <div style={{
          padding: "36px 20px", borderRadius: 16, border: `1px dashed ${t.border}`, background: t.panelAlt,
          textAlign: "center",
        }}>
          <div className="font-body" style={{ color: t.text, fontSize: 14.5, fontWeight: 600, marginBottom: 6 }}>{tr("No matching sites")}</div>
          <div className="font-body" style={{ color: t.textDim, fontSize: 13 }}>{tr("Try a different search term or clear the filters.")}</div>
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(280px,1fr))", gap: 18 }}>
          {filtered.map((item) => (
            <HeritageAtRiskCard key={item.attractionId} item={item} t={t}
              onOpen={() => setRiskModalItem(item)} />
          ))}
        </div>
      )}

      {riskModalItem && (
        <HeritageRiskModal
          item={riskModalItem}
          t={t}
          onClose={() => setRiskModalItem(null)}
          onExplore={() => {
            onOpenAttraction(riskModalItem.attraction.stateId, riskModalItem.attraction.id);
            setRiskModalItem(null);
          }}
        />
      )}
    </section>
  );
}

function Home({ t, dark, query, setQuery, activeRegion, setActiveRegion, activeCategory, setActiveCategory, onOpenState, onOpenAttraction, onOpenWebAttraction, favs, toggleFav }) {
  const { tr } = useLang();
  // Shared bridge between the manual "Plan a trip" builder and the AI
  // Heritage Guide below it: TripPlanner can hand off its current
  // region/district/days selection as a plain-text query, which scrolls
  // to and auto-runs the AI guide with that query pre-filled.
  const [guideRequest, setGuideRequest] = useState(null); // { id, text }
  const askGuideWithText = (text) => {
    setGuideRequest({ id: Date.now(), text });
    requestAnimationFrame(() => {
      document.getElementById("sec-ai-guide")?.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  };
  const filteredStates = useMemo(() => {
    return STATES.filter((s) => (activeRegion === "All" || s.region === activeRegion));
  }, [activeRegion]);

  const filteredByCategory = useMemo(() => {
    if (!activeCategory) return null;
    return ALL_ATTRACTIONS.filter((a) => a.category === activeCategory);
  }, [activeCategory]);

  // The hero search bar used to just hold text and do nothing with it.
  // Now it actually searches states + attractions and lets you jump straight in.
  const [heroFocused, setHeroFocused] = useState(false);
  const heroBoxRef = useRef(null);

  const heroResults = useMemo(() => {
    const ql = query.trim().toLowerCase();
    if (!ql) return null;
    return {
      states: STATES.filter((s) => s.name.toLowerCase().includes(ql) || s.capital.toLowerCase().includes(ql)).slice(0, 4),
      attractions: ALL_ATTRACTIONS.filter((a) => a.name.toLowerCase().includes(ql) || a.city.toLowerCase().includes(ql) || a.category.toLowerCase().includes(ql)).slice(0, 5),
    };
  }, [query]);

  // Live web results (Wikipedia search API) for anything outside the curated dataset.
  const { results: heroWebResults, loading: heroWebLoading } = useLiveSearch(query);

  const showHeroDropdown = heroFocused && query.trim().length > 0;

  useEffect(() => {
    const onClickOutside = (e) => {
      if (heroBoxRef.current && !heroBoxRef.current.contains(e.target)) setHeroFocused(false);
    };
    document.addEventListener("mousedown", onClickOutside);
    return () => document.removeEventListener("mousedown", onClickOutside);
  }, []);

  const handleHeroKeyDown = (e) => {
    if (e.key === "Enter" && heroResults) {
      if (heroResults.states.length) { onOpenState(heroResults.states[0].id); setHeroFocused(false); }
      else if (heroResults.attractions.length) { onOpenAttraction(heroResults.attractions[0].stateId, heroResults.attractions[0].id); setHeroFocused(false); }
      else if (heroWebResults.length) { onOpenWebAttraction(heroWebResults[0].title); setHeroFocused(false); }
    } else if (e.key === "Escape") {
      setQuery(""); setHeroFocused(false);
    }
  };

  return (
    <div style={{ position: "relative", zIndex: 1 }}>
      {/* HERO */}
      <section className="gemini-hero-shell" style={{ padding: "70px 0 40px", textAlign: "center" }}>
        <div className="gemini-glow-orb blue" />
        <div className="gemini-glow-orb purple" />
        <div className="gemini-glow-orb pink" />
        <div className="gemini-hero-inner">
        <div className="gemini-badge-row">
          <Chip style={{ borderColor: t.border, color: t.gold }} className="fade-up">{tr("🇮🇳 CULTURE · HERITAGE · TRAVEL")}</Chip>
          <span className="gemini-badge fade-up">
            <span className="gemini-badge-dot" />
            ✨ {tr("Powered by Gemini AI")}
          </span>
        </div>
        <h1 className="font-display fade-up" style={{ fontSize: "clamp(36px,6.5vw,74px)", color: t.text, margin: "0 auto 16px", maxWidth: 900, lineHeight: 1.08 }}>
          {tr("Discover the")} <span className="gemini-hero-title-accent">{tr("Soul")}</span> {tr("of India")}
        </h1>
        <p className="font-body fade-up" style={{ color: t.textDim, fontSize: "clamp(14px,1.6vw,18px)", maxWidth: 620, margin: "0 auto 34px", lineHeight: 1.7 }}>
          {tr("Explore thousands of years of culture, heritage, architecture and stories — one state at a time.")}
        </p>

        <div ref={heroBoxRef} className={`fade-up gemini-search-wrap${heroFocused ? " focused" : ""}`} style={{ maxWidth: 560, margin: "0 auto", position: "relative", textAlign: "left" }}>
          <Search size={18} color={t.textDim} style={{ position: "absolute", left: 18, top: 16, zIndex: 2 }} />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            onFocus={() => setHeroFocused(true)}
            onKeyDown={handleHeroKeyDown}
            placeholder={tr("Search states, monuments, temples, museums, cities…")}
            className="font-body"
            style={{
              width: "100%", padding: "15px 44px 15px 48px", borderRadius: showHeroDropdown ? "20px 20px 0 0" : 999, border: `1px solid ${t.border}`,
              background: t.panel, color: t.text, fontSize: 14.5, outline: "none", boxSizing: "border-box", position: "relative", zIndex: 1,
              boxShadow: `0 10px 40px -12px ${t.saffron}33`, transition: "border-radius .15s",
            }}
          />
          {query && <button onClick={() => { setQuery(""); setHeroFocused(false); }} style={{ position: "absolute", right: 14, top: 13, background: "none", border: "none", cursor: "pointer", zIndex: 2 }}><X size={18} color={t.textDim} /></button>}

          {showHeroDropdown && (
            <div className="scrollbar-thin" style={{
              position: "absolute", top: "100%", left: 0, right: 0, background: t.panel, border: `1px solid ${t.border}`,
              borderTop: "none", borderRadius: "0 0 20px 20px", boxShadow: "0 20px 50px rgba(0,0,0,0.25)", zIndex: 40,
              maxHeight: 360, overflowY: "auto", textAlign: "left",
            }}>
              {heroResults.states.length === 0 && heroResults.attractions.length === 0 && heroWebResults.length === 0 && !heroWebLoading && (
                <div className="font-body" style={{ color: t.textDim, fontSize: 13, textAlign: "center", padding: 20 }}>{tr("No matches yet — try a different spelling.")}</div>
              )}
              {heroResults.states.length > 0 && (
                <div style={{ padding: "10px 10px 4px" }}>
                  <div className="font-utility" style={{ fontSize: 10.5, color: t.gold, marginBottom: 4 }}>{tr("STATES")}</div>
                  {heroResults.states.map((s) => (
                    <div key={s.id} onClick={() => { onOpenState(s.id); setHeroFocused(false); }} style={{ display: "flex", justifyContent: "space-between", padding: "9px 8px", borderRadius: 10, cursor: "pointer" }}
                      onMouseEnter={(e) => e.currentTarget.style.background = t.panelAlt} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                      <div className="font-body" style={{ color: t.text, fontSize: 14 }}>{s.name}</div>
                      <div className="font-utility" style={{ color: t.saffron, fontSize: 11 }}>{tr("EXPLORE →")}</div>
                    </div>
                  ))}
                </div>
              )}
              {heroResults.attractions.length > 0 && (
                <div style={{ padding: "6px 10px 8px" }}>
                  <div className="font-utility" style={{ fontSize: 10.5, color: t.gold, marginBottom: 4 }}>{tr("PLACES")}</div>
                  {heroResults.attractions.map((a) => (
                    <div key={a.id} onClick={() => { onOpenAttraction(a.stateId, a.id); setHeroFocused(false); }} style={{ padding: "9px 8px", borderRadius: 10, cursor: "pointer" }}
                      onMouseEnter={(e) => e.currentTarget.style.background = t.panelAlt} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                      <div className="font-body" style={{ color: t.text, fontSize: 14 }}>{a.name}</div>
                      <div className="font-body" style={{ color: t.textDim, fontSize: 11.5 }}>{a.city}, {a.stateName} · {a.category}</div>
                    </div>
                  ))}
                </div>
              )}
              {heroWebResults.length > 0 && (
                <div style={{ padding: "6px 10px 10px" }}>
                  <div className="font-utility" style={{ fontSize: 10.5, color: t.gold, marginBottom: 4 }}>{tr("FROM THE WEB")}</div>
                  {heroWebResults.map((r, i) => (
                    <div key={i} onClick={() => { onOpenWebAttraction(r.title); setHeroFocused(false); }}
                      style={{ display: "block", padding: "9px 8px", borderRadius: 10, cursor: "pointer" }}
                      onMouseEnter={(e) => e.currentTarget.style.background = t.panelAlt} onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>
                      <div className="font-body" style={{ color: t.text, fontSize: 14 }}>{r.title}</div>
                      <div className="font-body" style={{ color: t.textDim, fontSize: 11.5, marginTop: 2 }}>{r.snippet}</div>
                    </div>
                  ))}
                </div>
              )}
              {heroWebLoading && (
                <div className="font-utility" style={{ color: t.textDim, fontSize: 10.5, textAlign: "center", padding: "6px 10px 10px" }}>{tr("searching…")}</div>
              )}
            </div>
          )}
        </div>
        </div>
      </section>

      {/* DISCOVERY */}
      <section id="sec-culture" style={{ marginBottom: 40, scrollMarginTop: 90 }}>
        <SectionLabel t={t} kicker="Culture" title={tr("What are you interested in?")} />
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          {CATEGORIES.map((c) => {
            const CIcon = c.icon;
            const active = activeCategory === c.key;
            return (
              <button key={c.key} onClick={() => setActiveCategory(active ? null : c.key)} className="font-utility"
                style={{
                  display: "flex", alignItems: "center", gap: 8, padding: "10px 16px", borderRadius: 999, cursor: "pointer",
                  border: `1px solid ${active ? t.saffron : t.border}`, background: active ? `${t.saffron}1f` : t.panel,
                  color: active ? t.saffron : t.textDim, fontSize: 12.5,
                }}>
                <CIcon size={14} /> {tr(c.label).toUpperCase()}
              </button>
            );
          })}
        </div>

        {filteredByCategory && (
          <div className="fade-up" style={{ marginTop: 20, display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(240px,1fr))", gap: 18 }}>
            {filteredByCategory.map((a) => (
              <AttractionCard key={a.id} a={a} t={t} fav={favs.has(a.id)} onOpen={() => onOpenAttraction(a.stateId, a.id)} onFav={() => toggleFav(a.id)} />
            ))}
          </div>
        )}
      </section>

      {/* EXPLORE INDIA MAP */}
      <section id="sec-explore" style={{ marginBottom: 46, scrollMarginTop: 90 }}>
        <SectionLabel t={t} kicker="Explore India · Map" title={tr("Choose a state or region")} />
        <div className="scrollbar-thin" style={{ display: "flex", gap: 8, marginBottom: 20, overflowX: "auto", paddingBottom: 4 }}>
          {["All", ...REGIONS].map((r) => (
            <button key={r} onClick={() => setActiveRegion(r)} className="font-utility" style={{
              whiteSpace: "nowrap", padding: "8px 16px", borderRadius: 999, cursor: "pointer",
              border: `1px solid ${activeRegion === r ? t.gold : t.border}`, background: activeRegion === r ? `${t.gold}22` : "transparent",
              color: activeRegion === r ? t.gold : t.textDim, fontSize: 12,
            }}>{r === "All" ? tr("ALL INDIA") : tr(r).toUpperCase()}</button>
          ))}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(220px,1fr))", gap: 16 }}>
          {filteredStates.map((s) => <StateTile key={s.id} s={s} t={t} onOpen={() => onOpenState(s.id)} />)}
        </div>
      </section>

      {/* FEATURED HERITAGE */}
      <section id="sec-heritage" style={{ marginBottom: 46, scrollMarginTop: 90 }}>
        <SectionLabel t={t} kicker="Featured heritage" title={tr("Iconic heritage across India")} />
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(240px,1fr))", gap: 18 }}>
          {ALL_ATTRACTIONS.slice(0, 4).map((a) => (
            <AttractionCard key={a.id} a={a} t={t} fav={favs.has(a.id)} onOpen={() => onOpenAttraction(a.stateId, a.id)} onFav={() => toggleFav(a.id)} />
          ))}
        </div>
      </section>

      {/* HERITAGE AT RISK */}
      <HeritageAtRiskSection t={t} onOpenAttraction={onOpenAttraction} />

      {/* PLAN TRIP */}
      <section id="sec-plan" style={{ marginBottom: 46, scrollMarginTop: 90 }}>
        <TripPlanner t={t} onOpenAttraction={onOpenAttraction} favs={favs} toggleFav={toggleFav} onAskGuide={askGuideWithText} />
      </section>

      {/* MULTI-CITY ROUTE PLANNER */}
      <section id="sec-route-planner" style={{ marginBottom: 46, scrollMarginTop: 90 }}>
        <MultiCityRoutePlanner t={t} />
      </section>

      {/* AI HERITAGE GUIDE */}
      <section id="sec-ai-guide" style={{ marginBottom: 46, scrollMarginTop: 90 }}>
        <AIHeritageGuide t={t} onOpenAttraction={onOpenAttraction} favs={favs} toggleFav={toggleFav} externalQuery={guideRequest} />
      </section>

        <SolanExplorer t={t} />
      </section>

      {/* TWELVE JYOTIRLINGAS */}

        <SectionLabel t={t} kicker="Sacred Shiva shrines" title={tr("The Twelve Jyotirlingas")} />
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(200px,1fr))", gap: 16 }}>
          {JYOTIRLINGAS.map((j, i) => (
            <JyotirlingaCard key={j.attractionId} j={j} i={i} t={t} onOpen={() => onOpenAttraction(j.stateId, j.attractionId)} />
